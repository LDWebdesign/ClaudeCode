   m:"Everyone who received Jesus was given the right to become a child of God. Not a servant, not an employee, a child. Being God's child isn't something you earn by being good. It's a gift you receive by believing. Your identity is settled: you belong in God's family.",
   q:"How do you see yourself most often?", o:["As God's child","As a servant","As a disappointment","As a stranger to God"],
   p:"What would change in your day if you truly lived as a beloved child of God?",
   a:"Remind yourself throughout the day: I am a child of God."},
  {r:"Psalm 107:28-30", t:"Then they cry unto the LORD in their trouble, and he bringeth them out of their distresses. He maketh the storm a calm, so that the waves thereof are still. Then are they glad because they be quiet; so he bringeth them unto their desired haven.", th:"The storm made calm", c:"Psalm 107:23-32",
   m:"Sailors caught in a storm reached their wits' end. Then they cried out, and God calmed the sea and brought them to their desired haven. Sometimes we pray only when we've run out of options. God still answers. And he doesn't just stop the storm. He brings you home.",
   q:"What storm are you in right now?", o:["A relationship","My finances","My health","My mind"],
   p:"What would your desired haven look like? Write a prayer from the middle of the storm.",
   a:"Pray today for someone you know who's in a storm."},
  {r:"Ezekiel 37:3", t:"And he said unto me, Son of man, can these bones live? And I answered, O Lord GOD, thou knowest.", th:"Can these bones live?", c:"Ezekiel 37:1-14",
   m:"God showed Ezekiel a valley full of bones, very many and very dry, long dead. Then he asked, can these bones live? Ezekiel's answer was honest and humble: O Lord GOD, thou knowest. Then God breathed life into them. No situation is too dead for God to revive.",
   q:"What in your life feels like dry bones?", o:["A dream","A relationship","My faith","My energy"],
   p:"Describe your valley of dry bones. Then answer God's question the way Ezekiel did: Lord, you know.",
   a:"Pray over something you'd given up on today, asking God to breathe life into it."},
  {r:"Hebrews 10:24-25", t:"And let us consider one another to provoke unto love and to good works: Not forsaking the assembling of ourselves together, as the manner of some is; but exhorting one another: and so much the more, as ye see the day approaching.", th:"Stir each other up", c:"Hebrews 10:19-25",
   m:"'Provoke' usually means to irritate. Here it means to stir up: think about how to stir each other up to love and good works. And don't give up meeting together. Faith isn't meant to be lived alone. We need each other to keep going.",
   q:"How connected are you to other believers?", o:["Very connected","Somewhat","Not much","I've drifted away"],
   p:"Who could you stir up toward love and good works this week? Who does that for you?",
   a:"Connect with another believer today, in person if you can."},
  {r:"Proverbs 25:11", t:"A word fitly spoken is like apples of gold in pictures of silver.", th:"A word fitly spoken", c:"Proverbs 25:11-15",
   m:"A word spoken at the right time is like golden apples in a silver setting: beautiful, valuable, and well placed. The right words at the right moment can stay with someone for years. Timing matters as much as content. Sometimes the most loving thing is knowing when to speak.",
   q:"Do you tend to speak too soon or too late?", o:["Too soon","Too late","Usually about right","I tend to stay silent"],
   p:"Write about a word fitly spoken to you that you still remember.",
   a:"Watch for the right moment to say something encouraging to someone today."},
  {r:"1 Samuel 16:7", t:"But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the LORD seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart.", th:"The Lord looks on the heart", c:"1 Samuel 16:1-13",
   m:"Samuel was sent to anoint the next king. He saw tall, impressive Eliab and assumed he was the one. God said no. David, the youngest, hadn't even been called in. He was out with the sheep. God doesn't measure people the way we do. He looks at the heart.",
   q:"Where do you judge by outward appearance?", o:["Myself","Others","Leaders","Success"],
   p:"If God is looking at your heart today, what does he see? Write honestly.",
   a:"Give someone a second look today, beyond first impressions."},
  {r:"John 3:16", t:"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.", th:"For God so loved", c:"John 3:14-21",
   m:"It may be the most famous verse in the Bible, and it's worth reading slowly. God so loved, that he gave. Love led to giving. The world means everyone, not just the good ones. Whosoever means the door is open to anyone. And the gift is everlasting life, starting now.",
   q:"Which part of this verse speaks to you today?", o:["God so loved","He gave","Whosoever","Everlasting life"],
   p:"Read the verse with your name in place of 'the world.' How does it feel?",
   a:"Tell someone today, in your own words, what this verse means to you."},
  {r:"Psalm 116:1-2", t:"I love the LORD, because he hath heard my voice and my supplications. Because he hath inclined his ear unto me, therefore will I call upon him as long as I live.", th:"He bent down to listen", c:"Psalm 116:1-9",
   m:"The psalmist loves God because God listened. 'Inclined his ear' is the picture of someone leaning down to hear a small voice, like a parent bending to listen to a child. Because God bent down to listen, the psalmist decides to call on him as long as he lives.",
   q:"Do you feel heard by God?", o:["Yes","Sometimes","Not lately","I'm not sure"],
   p:"What do you want God to bend down and hear today? Write it as if he's leaning close.",
   a:"Lean in and really listen to someone today, the way God listens to you."},
  {r:"Hebrews 11:8", t:"By faith Abraham, when he was called to go out into a place which he should after receive for an inheritance, obeyed; and he went out, not knowing whither he went.", th:"Not knowing where", c:"Hebrews 11:8-16",
   m:"Abraham left home without knowing where he was going. He only knew who he was going with. Faith often looks like this: obeying before you understand, moving before you can see the destination. The map comes later. The trust comes first.",
   q:"Where is God calling you into the unknown?", o:["A move","A career change","A relationship","A new way to serve"],
   p:"What would it look like to obey God even without knowing where it leads?",
   a:"Take one step of obedience today without needing the full picture."},
  {r:"John 3:30", t:"He must increase, but I must decrease.", th:"He must increase", c:"John 3:25-36",
   m:"John the Baptist had crowds and followers. When Jesus came, people started leaving John for him. John's disciples were upset. John wasn't. He said: He must increase, but I must decrease. Real joy comes when we stop needing to be the center and let Jesus be.",
   q:"Where do you need to decrease?", o:["My need for credit","My need for control","My ego","My worries"],
   p:"Where in your life is Jesus increasing? Where do you need to step back?",
   a:"Give someone else the credit today, or take a back seat on purpose."},
  {r:"Daniel 3:17-18", t:"If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king. But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up.", th:"But if not", c:"Daniel 3:13-28",
   m:"Three young men faced a furnace for refusing to bow to a golden statue. They said God was able to save them. But if not, they still wouldn't bow. That's mature faith: believing God can, trusting him even if he doesn't, and staying faithful either way.",
   q:"Can you say 'but if not' about your biggest prayer?", o:["Yes","I'm trying","Not yet","I don't want to"],
   p:"Write your biggest prayer. Then write: God is able. But if not, I will still trust him.",
   a:"Stay faithful today in one area where it would be easier to compromise."},
  {r:"Psalm 118:6", t:"The LORD is on my side; I will not fear: what can man do unto me?", th:"The Lord is on my side", c:"Psalm 118:5-9",
   m:"The psalmist called on God in distress and was set in a large place, with room to breathe. Now he can say, the LORD is on my side; I will not fear. This isn't arrogance. It's confidence that comes from being rescued. Fear shrinks when you know who's beside you.",
   q:"Whose opinion or anger are you afraid of?", o:["Someone's criticism","A boss or authority","Someone's temper","Rejection"],
   p:"How would you act differently today if you were sure God was on your side?",
   a:"Do one thing today you've been avoiding because of what someone might think."},
  {r:"1 Samuel 17:47", t:"And all this assembly shall know that the LORD saveth not with sword and spear: for the battle is the LORD's, and he will give you into our hands.", th:"The battle is the Lord's", c:"1 Samuel 17:38-50",
   m:"David faced Goliath without armor, with just a sling and five stones. Everyone else saw a giant. David saw a God who was bigger. He didn't claim his own strength. He said the battle is the LORD's. Your giants are real, but they aren't bigger than God.",
   q:"What giant are you facing?", o:["Fear","A habit","A person","A circumstance"],
   p:"Name your giant. Then write what you know about God that's bigger than it.",
   a:"Face one small piece of your giant today, trusting God with the outcome."},
  {r:"Hebrews 13:5", t:"Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee.", th:"Never leave thee", c:"Hebrews 13:1-6",
   m:"Be content with what you have, because God has said: I will never leave thee, nor forsake thee. In Greek it's a stacked negative, something like 'I will never, no, never leave you.' Contentment doesn't come from having more. It comes from knowing God will never leave.",
   q:"What would make you feel more content right now?", o:["More money","Better relationships","Less stress","Nothing, I'm content"],
   p:"How does God's promise to never leave you change what you need to feel secure?",
   a:"Practice contentment today. Don't buy anything you don't need."},
  {r:"John 4:14", t:"But whosoever drinketh of the water that I shall give him shall never thirst; but the water that I shall give him shall be in him a well of water springing up into everlasting life.", th:"Living water", c:"John 4:5-15",
   m:"Jesus met a Samaritan woman at a well at midday, perhaps when she could avoid the other women. He offered her water that would become a spring inside her, never running dry. Everything else we drink from leaves us thirsty again. Jesus offers something that satisfies from the inside out.",
   q:"What well do you keep going back to that leaves you thirsty?", o:["Approval","Achievement","Relationships","Entertainment"],
   p:"What would it look like for Jesus to be a spring inside you, rather than something you have to go get?",
   a:"Each time you drink water today, ask Jesus to satisfy your deeper thirst."},
  {r:"Proverbs 27:17", t:"Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.", th:"Iron sharpens iron", c:"Proverbs 27:17-19",
   m:"Iron gets sharp by rubbing against iron, and that involves friction and sparks. People sharpen each other the same way: through honest conversations, challenge, and accountability. The friends who sharpen you aren't always the ones who agree with you. They help you become better.",
   q:"Who sharpens you?", o:["A close friend","A mentor","My spouse or family","No one right now"],
   p:"Who are the people who make you better? How could you be iron for someone else?",
   a:"Have an honest, encouraging conversation with a friend today about how you're both really doing."},
  {r:"Psalm 119:11", t:"Thy word have I hid in mine heart, that I might not sin against thee.", th:"Hid in my heart", c:"Psalm 119:9-16",
   m:"Psalm 119 is the longest chapter in the Bible, and it's all about God's word. Hiding Scripture in your heart means memorizing it, keeping it close so it's there when you need it. In moments of temptation or fear, the verses you know by heart are the ones that rise up.",
   q:"How many verses do you know by heart?", o:["None","A few","Many","I used to know more"],
   p:"What verse would you most like to hide in your heart right now? Why that one?",
   a:"Choose one verse from this week and memorize it today."},
  {r:"Daniel 6:10", t:"Now when Daniel knew that the writing was signed, he went into his house; and his windows being open in his chamber toward Jerusalem, he kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did aforetime.", th:"As he did aforetime", c:"Daniel 6:1-23",
   m:"When Daniel learned that praying could get him thrown to the lions, he went home, opened his windows, and prayed three times a day, as he did aforetime. Same as always. His faithfulness in the crisis was built on years of daily habit. The lions' den was prepared for long before.",
   q:"What spiritual habit could you keep up no matter what?", o:["Daily prayer","Reading Scripture","Worship","I'm still building one"],
   p:"What daily habit is preparing you for future challenges? What habit would you like to build?",
   a:"Pray at three set times today, like Daniel."},
  {r:"John 6:35", t:"And Jesus said unto them, I am the bread of life: he that cometh to me shall never hunger; and he that believeth on me shall never thirst.", th:"The bread of life", c:"John 6:32-40",
   m:"The day after feeding five thousand people, Jesus told the crowd that he himself was the bread of life. Bread was the most basic food in that world, eaten every day. Jesus isn't dessert or a special occasion. He's meant to be daily nourishment, the thing that keeps you alive.",
   q:"How often do you feed on Jesus?", o:["Daily","A few times a week","Sundays","Rarely"],
   p:"What would it look like to make Jesus your daily bread, not just an occasional treat?",
   a:"Eat a piece of bread slowly today and thank Jesus for being your bread of life."},
  {r:"Hebrews 13:8", t:"Jesus Christ the same yesterday, and to day, and for ever.", th:"The same forever", c:"Hebrews 13:7-9",
   m:"Everything around us changes: technology, culture, bodies, relationships. But Jesus Christ is the same yesterday, today, and forever. The Jesus who healed, forgave, and welcomed people in the Gospels is the same Jesus you pray to today. He hasn't changed.",
   q:"What's changing most in your life right now?", o:["My health","My relationships","My work","My faith"],
   p:"Which Gospel story do you most need Jesus to repeat in your life today?",
   a:"Read a Gospel story today and remember that he's still the same."},
  {r:"Psalm 119:18", t:"Open thou mine eyes, that I may behold wondrous things out of thy law.", th:"Open mine eyes", c:"Psalm 119:17-24",
   m:"The psalmist knows that reading Scripture isn't only an exercise. You need God to open your eyes to see the wondrous things in it. It's a simple prayer to pray before reading the Bible: Open my eyes. Words you've read many times can come alive in new ways.",
   q:"How does Scripture feel to you right now?", o:["Alive","Dry","Confusing","Comforting"],
   p:"Pray this verse, then read today's verse again slowly. What do you notice that you missed before?",
   a:"Pray 'Open thou mine eyes' every time you open your Bible this week."},
  {r:"1 Samuel 30:6", t:"And David was greatly distressed; for the people spake of stoning him, because the soul of all the people was grieved, every man for his sons and for his daughters: but David encouraged himself in the LORD his God.", th:"Encouraged in the Lord", c:"1 Samuel 30:1-8",
   m:"David's camp had been raided, the families taken, and his own men were talking about stoning him. He was completely alone. And David encouraged himself in the LORD his God. When no one else is there to lift you up, you can still turn to God and remind yourself who he is.",
   q:"When you're discouraged, where do you turn first?", o:["Other people","Distraction","Isolation","God"],
   p:"Write a few things you can remind yourself about God the next time you're discouraged.",
   a:"Make a short list of God's past faithfulness and keep it somewhere you'll see it."},
  {r:"John 6:37", t:"All that the Father giveth me shall come to me; and him that cometh to me I will in no wise cast out.", th:"I will not cast out", c:"John 6:35-40",
   m:"Him that cometh to me I will in no wise cast out. In Greek it's a double negative for emphasis: I will never, ever throw out anyone who comes to me. No matter what you've done, how many times you've failed, or how long you've been gone, Jesus won't turn you away.",
   q:"Do you ever fear being rejected by God?", o:["Often","Sometimes","Rarely","Never"],
   p:"Write about what makes you afraid God might turn you away. Then write Jesus's promise.",
   a:"Come to Jesus today with something you've been afraid to bring."},
  {r:"James 1:5", t:"If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.", th:"Ask for wisdom", c:"James 1:5-8",
   m:"If you need wisdom, ask God. He gives generously and 'upbraideth not,' meaning he doesn't scold you for asking. You don't have to be embarrassed for not knowing what to do. God loves to give wisdom to anyone who asks.",
   q:"Where do you need wisdom most right now?", o:["A decision","A relationship","My finances","My family"],
   p:"Write down the situation where you need wisdom. Then ask God for it, plainly.",
   a:"Ask God for wisdom before every decision today."},
  {r:"Psalm 119:71", t:"It is good for me that I have been afflicted; that I might learn thy statutes.", th:"Learning in affliction", c:"Psalm 119:65-72",
   m:"This is a hard verse. The psalmist says it was good that he suffered, because it taught him God's ways. It doesn't say suffering is good in itself. It says God used it. Some lessons can only be learned in hard places, and many people say their deepest growth came there.",
   q:"What has a hard season taught you?", o:["To depend on God","To have compassion","What really matters","I'm still learning"],
   p:"Write about something you learned in affliction that you couldn't have learned any other way.",
   a:"Thank God today for one lesson a hard time taught you."},
  {r:"Hosea 6:3", t:"Then shall we know, if we follow on to know the LORD: his going forth is prepared as the morning; and he shall come unto us as the rain, as the latter and former rain unto the earth.", th:"As sure as morning", c:"Hosea 6:1-3",
   m:"Hosea calls people to follow on to know the LORD, to keep pressing in. And God's coming is as sure as the sunrise and as refreshing as spring rain. You don't wonder whether the sun will come up tomorrow. God's faithfulness is that dependable.",
   q:"How would you describe your pursuit of God lately?", o:["Pressing in","Coasting","Drifting","Starting again"],
   p:"What would it look like to follow on to know the LORD this week?",
   a:"Learn one new thing about God today, through Scripture or a good book."},
  {r:"Proverbs 29:25", t:"The fear of man bringeth a snare: but whoso putteth his trust in the LORD shall be safe.", th:"The fear of man", c:"Proverbs 29:25-26",
   m:"Worrying too much about what people think is a trap. It catches you and keeps you from doing what's right. The alternative is trusting God, which makes you safe, literally 'set on high.' When God's opinion matters most, other opinions lose their power to trap you.",
   q:"Whose opinion holds the most power over you?", o:["Family","Friends","Coworkers","Strangers online"],
   p:"Where has the fear of what people think kept you from doing what you know is right?",
   a:"Do one thing today that's right, even if someone might disapprove."},
  {r:"John 6:68", t:"Then Simon Peter answered him, Lord, to whom shall we go? thou hast the words of eternal life.", th:"To whom shall we go?", c:"John 6:60-69",
   m:"After a hard teaching, many followers left Jesus. He turned to the twelve and asked if they wanted to leave too. Peter answered: Lord, to whom shall we go? You have the words of eternal life. Sometimes faith isn't having all the answers. It's knowing there's nowhere better to go.",
   q:"Have you ever wanted to walk away from faith?", o:["Yes, recently","Yes, in the past","Briefly","No"],
   p:"What keeps you following Jesus, even when it's hard?",
   a:"Write down one reason you stay with Jesus, and keep it handy."},
  {r:"James 1:19", t:"Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath.", th:"Swift to hear", c:"James 1:19-27",
   m:"Quick to listen, slow to speak, slow to anger. Most of us do the opposite. James says listen more than you talk, and give anger time to cool before you act on it. It's simple advice that could change almost every conversation.",
   q:"Which is hardest for you?", o:["Swift to hear","Slow to speak","Slow to wrath","All three"],
   p:"Think of a recent conversation. What would have changed if you listened more and spoke less?",
   a:"In every conversation today, listen fully before you respond."},
  {r:"Psalm 121:3-4", t:"He will not suffer thy foot to be moved: he that keepeth thee will not slumber. Behold, he that keepeth Israel shall neither slumber nor sleep.", th:"He will not slumber", c:"Psalm 121",
   m:"Ancient gods were sometimes pictured as needing sleep. Israel's God never does. He who keeps you will not slumber. While you sleep, while you're distracted, while you forget him, he's still watching over you. You can rest because he doesn't need to.",
   q:"When do you feel least protected?", o:["At night","When traveling","When I'm alone","When I'm overwhelmed"],
   p:"What would it mean to really trust that God never sleeps on your watch?",
   a:"Tonight, before you sleep, give God everything you're worried about and let him keep watch."},
  {r:"1 Kings 19:7", t:"And the angel of the LORD came again the second time, and touched him, and said, Arise and eat; because the journey is too great for thee.", th:"The journey is too great", c:"1 Kings 19:1-8",
   m:"Elijah was exhausted and wanted to die. He'd just seen a huge victory, then crashed. God didn't lecture him. An angel brought bread and water, twice, and said, 'Arise and eat; because the journey is too great for thee.' Sometimes the most spiritual thing you can do is eat and sleep.",
   q:"How is your body doing today?", o:["Rested","Tired","Running on empty","Sick or hurting"],
   p:"Where are you running on empty? What would it look like to let God care for your body?",
   a:"Take care of your body today: a real meal, water, and an early night."},
  {r:"John 8:12", t:"Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.", th:"The light of the world", c:"John 8:12-20",
   m:"Jesus said this in the temple around the time of the Feast of Tabernacles, a festival known for great lamps lit in the temple courts. Against that backdrop he said: I am the light of the world. Following him means you won't walk in darkness. You'll have the light of life, a light that goes with you.",
   q:"Where do you feel like you're walking in darkness?", o:["A decision","My emotions","My circumstances","My faith"],
   p:"What would following the light of the world look like in that dark place?",
   a:"Turn off a light tonight and pray: Jesus, you are my light."},
  {r:"Hosea 11:4", t:"I drew them with cords of a man, with bands of love: and I was to them as they that take off the yoke on their jaws, and I laid meat unto them.", th:"Bands of love", c:"Hosea 11:1-4",
   m:"God describes himself like a parent teaching a toddler to walk, holding them by the arms, drawing them with gentle cords of love, and bending down to feed them. Israel kept running away, and God's heart still ached with compassion. This is how God leads: with kindness, not force.",
   q:"How does God usually draw you?", o:["Through kindness","Through hard times","Through people","Through beauty"],
   p:"Write about a time you felt God drawing you back with bands of love.",
   a:"Lead someone today with kindness instead of pressure."},
  {r:"Psalm 126:5-6", t:"They that sow in tears shall reap in joy. He that goeth forth and weepeth, bearing precious seed, shall doubtless come again with rejoicing, bringing his sheaves with him.", th:"Sow in tears, reap in joy", c:"Psalm 126",
   m:"Picture a farmer weeping as he plants precious seed, not knowing if there'll be a harvest. The promise is that he will doubtless come again with rejoicing, carrying sheaves. Tears and seeds often go together. What you plant in sorrow, God can turn into a harvest of joy.",
   q:"What are you sowing in tears right now?", o:["Prayers for someone","Hard work","Faithfulness in a hard place","Grief"],
   p:"What seed are you planting through tears? What harvest are you hoping for?",
   a:"Keep doing one faithful thing today, even if you're tired or sad."},
  {r:"James 4:8", t:"Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners; and purify your hearts, ye double minded.", th:"Draw near", c:"James 4:6-10",
   m:"Draw near to God, and he will draw near to you. It's a promise with an invitation. God isn't waiting with his arms crossed. Take one step toward him, and you'll find him already coming toward you. Then James adds: clean up what needs cleaning, and stop being double-minded.",
   q:"How close do you feel to God today?", o:["Very close","Somewhat close","Distant","Far away"],
   p:"What step could you take toward God today? What might be keeping you double-minded?",
   a:"Take one deliberate step toward God today: a prayer, a verse, a moment of quiet."},
  {r:"John 8:32", t:"And ye shall know the truth, and the truth shall make you free.", th:"The truth sets you free", c:"John 8:31-36",
   m:"Jesus says that continuing in his word leads to knowing the truth, and the truth sets you free. Lies trap us: lies about who we are, what we're worth, and what God is like. Truth breaks those chains. And Jesus himself is the truth.",
   q:"What lie do you sometimes believe about yourself?", o:["I'm not enough","I'm unlovable","I'm a failure","I'm alone"],
   p:"Write down a lie you've believed. Then write the truth God says about it.",
   a:"When a lie comes to mind today, answer it with a truth from Scripture."},
  {r:"Proverbs 31:25-26", t:"Strength and honour are her clothing; and she shall rejoice in time to come. She openeth her mouth with wisdom; and in her tongue is the law of kindness.", th:"The law of kindness", c:"Proverbs 31:10-31",
   m:"The woman described in Proverbs 31 is clothed with strength and honor, and she can rejoice about the time to come instead of fearing it. Her words are wise, and her tongue carries the law of kindness. Whoever you are, this is a picture of a life well lived: strong, unafraid, wise, and kind.",
   q:"Which quality do you want to grow in?", o:["Strength","Honor","Fearlessness about the future","Kindness in my words"],
   p:"What would it look like for you to rejoice about the days to come instead of worrying about them?",
   a:"Speak with intentional kindness in every conversation today."},
  {r:"1 Kings 19:11-12", t:"And he said, Go forth, and stand upon the mount before the LORD. And, behold, the LORD passed by, and a great and strong wind rent the mountains, and brake in pieces the rocks before the LORD; but the LORD was not in the wind: and after the wind an earthquake; but the LORD was not in the earthquake: And after the earthquake a fire; but the LORD was not in the fire: and after the fire a still small voice.", th:"A still small voice", c:"1 Kings 19:9-13",
   m:"Elijah waited on the mountain. A wind tore the rocks, then came an earthquake, then a fire, and God wasn't in any of them. Then came a still small voice, a gentle whisper. We often look for God in the dramatic. He often speaks in the quiet.",
   q:"Where do you usually look for God?", o:["Big moments","Answered prayers","Quiet moments","Other people"],
   p:"What noise in your life might be drowning out God's still small voice?",
   a:"Find five minutes of complete quiet today and simply listen."},
  {r:"Psalm 127:1-2", t:"Except the LORD build the house, they labour in vain that build it: except the LORD keep the city, the watchman waketh but in vain. It is vain for you to rise up early, to sit up late, to eat the bread of sorrows: for so he giveth his beloved sleep.", th:"He gives his beloved sleep", c:"Psalm 127",
   m:"You can rise early, stay up late, and work yourself to exhaustion, but if God isn't building the house, it's in vain. This psalm of Solomon says God gives his beloved sleep. Rest isn't laziness. It's trust that God is the real builder.",
   q:"How balanced are work and rest in your life?", o:["Too much work","Too much rest","Pretty balanced","Hard to tell"],
   p:"What are you trying to build in your own strength? What would it look like to let God build it?",
   a:"Stop working at a reasonable time today and rest without guilt."},
  {r:"James 5:16", t:"Confess your faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much.", th:"Confess and pray", c:"James 5:13-16",
   m:"Confess your faults to one another, and pray for one another, so that you may be healed. There's healing in being honest with another person. Secrets grow in the dark. Bringing them into the light, with someone trustworthy, takes away their power.",
   q:"Do you have someone you can be honest with?", o:["Yes","Sort of","No","I used to"],
   p:"What have you been keeping hidden that might lose its power if you shared it with someone you trust?",
   a:"Pray for a friend today, and let them know you did."},
  {r:"Joel 2:25", t:"And I will restore to you the years that the locust hath eaten, the cankerworm, and the caterpiller, and the palmerworm, my great army which I sent among you.", th:"Restored years", c:"Joel 2:21-27",
   m:"Locusts had stripped the land bare, wiping out years of harvest. God promised to restore what the locusts had eaten. Many people carry lost years, to addiction, grief, bad choices, or other people's harm. God specializes in restoration, even of time we thought was gone forever.",
   q:"Do you have lost years?", o:["Yes, several","A season","I'm in one now","Not really"],
   p:"What years or seasons feel lost to you? Write a prayer asking God to restore them.",
   a:"Thank God today for something he's already restored in your life."},
  {r:"John 10:10", t:"The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly.", th:"Abundant life", c:"John 10:7-11",
   m:"Jesus contrasts himself with a thief who comes to steal, kill, and destroy. Jesus came so that we could have life, and have it more abundantly. Not just survival, but fullness. Abundant life doesn't mean an easy life. It means a life full of God's presence, purpose, and joy.",
   q:"How abundant does your life feel right now?", o:["Full","Okay","Empty","Stolen from"],
   p:"What has the thief been stealing from you? What would abundant life look like?",
   a:"Do one thing today that makes you feel fully alive."},
  {r:"Psalm 130:5-6", t:"I wait for the LORD, my soul doth wait, and in his word do I hope. My soul waiteth for the Lord more than they that watch for the morning: I say, more than they that watch for the morning.", th:"Watching for the morning", c:"Psalm 130",
   m:"A watchman on night duty knows morning will come, but the night can feel long. The psalmist waits for God more than a watchman waits for dawn, and he says it twice. Waiting on God isn't empty. It's full of hope, because you know the morning is coming.",
   q:"What are you watching for?", o:["An answer","A change","Healing","God's presence"],
   p:"What does your waiting look like right now? What helps you keep hoping through the night?",
   a:"Watch the sunrise tomorrow if you can, and pray this verse as the light comes."},
  {r:"1 Peter 2:9", t:"But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people; that ye should shew forth the praises of him who hath called you out of darkness into his marvellous light.", th:"Into his marvellous light", c:"1 Peter 2:4-10",
   m:"Peter writes to scattered, struggling believers and tells them who they are: chosen, royal, holy, and 'peculiar,' which in King James English meant God's own special possession. And why: to show the praises of the God who called them out of darkness into his marvellous light. Your identity is what God says, not what the world says.",
   q:"Which description do you need to hear today?", o:["Chosen","Royal","Holy","God's own"],
   p:"Write about where God has brought you from darkness into his light.",
   a:"Share with someone today how God has brought you into his light."},
  {r:"John 10:11", t:"I am the good shepherd: the good shepherd giveth his life for the sheep.", th:"The good shepherd", c:"John 10:11-18",
   m:"A hired hand runs when the wolf comes. A good shepherd stays and fights, even giving his life for the sheep. Jesus says that's who he is and what he does. He doesn't care for you because it's his job. He loves you enough to die for you.",
   q:"Which part of the shepherd picture comforts you most?", o:["He stays","He protects","He knows me","He gave his life"],
   p:"How have you experienced Jesus as your good shepherd?",
   a:"Read Psalm 23 today with Jesus in mind as the shepherd."},
  {r:"2 Kings 6:16-17", t:"And he answered, Fear not: for they that be with us are more than they that be with them. And Elisha prayed, and said, LORD, I pray thee, open his eyes, that he may see. And the LORD opened the eyes of the young man; and he saw: and, behold, the mountain was full of horses and chariots of fire round about Elisha.", th:"More are with us", c:"2 Kings 6:8-17",
   m:"Elisha's servant woke up to find an enemy army surrounding the city. He panicked. Elisha calmly prayed for God to open his eyes. Then the servant saw the hills full of horses and chariots of fire. What we can see is not all there is.",
   q:"What feels like it's surrounding you right now?", o:["Pressure","Problems","Fear","Criticism"],
   p:"Pray Elisha's prayer for yourself: Open my eyes, that I may see. What do you hope to see?",
   a:"When you feel outnumbered today, remind yourself: They that be with us are more."},
  {r:"Jonah 2:2", t:"And said, I cried by reason of mine affliction unto the LORD, and he heard me; out of the belly of hell cried I, and thou heardest my voice.", th:"From the depths", c:"Jonah 2:1-10",
   m:"Jonah ran from God, was thrown overboard, and ended up inside a great fish. From there, the worst place he could be, he prayed. And God heard him. Even when you're in a mess of your own making, it's not too late to cry out. God hears prayers from the belly of the fish.",
   q:"Have you ever run from God?", o:["Yes, I'm running now","Yes, in the past","In small ways","Never"],
   p:"Write a prayer from your own belly of the fish, wherever you feel stuck or far away.",
   a:"If you've been avoiding something God asked of you, take one step toward it today."},
  {r:"Psalm 131:2", t:"Surely I have behaved and quieted myself, as a child that is weaned of his mother: my soul is even as a weaned child.", th:"A quieted soul", c:"Psalm 131",
   m:"A nursing baby is restless and demanding. A weaned child can sit on their mother's lap simply to be near her, content without needing anything. David says he has quieted his soul like that. It's a picture of being with God not to get something, but just to be with him.",
   q:"How do you usually come to God?", o:["With a list of needs","With worries","Just to be with him","I don't often come"],
   p:"What would it look like to sit with God today without asking for anything?",
   a:"Spend five minutes in God's presence today, asking for nothing."},
  {r:"Ecclesiastes 4:9-10", t:"Two are better than one; because they have a good reward for their labour. For if they fall, the one will lift up his fellow: but woe to him that is alone when he falleth; for he hath not another to help him up.", th:"Two are better than one", c:"Ecclesiastes 4:7-12",
   m:"The Teacher watched a man working alone, with no one to share his life, and called it vanity. Two are better than one: when one falls, the other can help them up. God didn't make us to go through life alone. Isolation makes falls more dangerous. Companionship makes them survivable.",
   q:"Who would help you up if you fell?", o:["Several people","One person","I'm not sure","No one right now"],
   p:"Who has helped you up when you fell? Who might need you to help them up?",
   a:"Reach out today to someone who might be isolated."},
  {r:"1 Peter 4:8", t:"And above all things have fervent charity among yourselves: for charity shall cover the multitude of sins.", th:"Love covers", c:"1 Peter 4:7-11",
   m:"Above all, love each other deeply, because love covers a multitude of sins. This doesn't mean ignoring wrong. It means love doesn't keep broadcasting other people's faults or holding them over their heads. Love is willing to let things go.",
   q:"Whose faults do you find hardest to cover?", o:["Family","Friends","Coworkers","My own"],
   p:"Is there someone whose mistakes you keep bringing up? What would covering them in love look like?",
   a:"Let go of one offense today without mentioning it."},
  {r:"John 10:27-28", t:"My sheep hear my voice, and I know them, and they follow me: And I give unto them eternal life; and they shall never perish, neither shall any man pluck them out of my hand.", th:"Held in his hand", c:"John 10:22-30",
   m:"Sheep know their shepherd's voice, even in a crowd of other voices. Jesus's sheep hear him, he knows them, and they follow. Then comes a powerful promise: no one can pluck them out of his hand. You're held securely, not by your grip on him, but by his grip on you.",
   q:"How well do you recognize Jesus's voice?", o:["Very well","Sometimes","Not well","I'm learning"],
   p:"Which voices compete with Jesus's in your life? How can you tune in to his?",
   a:"Spend time today listening, through Scripture and silence, for the Shepherd's voice."},
  {r:"Psalm 136:1", t:"O give thanks unto the LORD; for he is good: for his mercy endureth for ever.", th:"His mercy endures forever", c:"Psalm 136:1-9",
   m:"Psalm 136 repeats one line twenty-six times: for his mercy endureth for ever. After every event, creation, rescue, provision, the response is the same. It was likely sung back and forth between a leader and the people. The repetition is the point. Some truths need to be said again and again.",
   q:"Where do you need to hear that his mercy endures forever?", o:["Over my past","Over my present","Over my future","Over someone I love"],
   p:"Write your own Psalm 136: list events of your life, and after each one write, 'for his mercy endureth for ever.'",
   a:"Say 'His mercy endureth for ever' after each meal or task today."},
  {r:"John 11:35", t:"Jesus wept.", th:"Jesus wept", c:"John 11:32-37",
   m:"It's the shortest verse in the English Bible. Jesus knew he was about to raise Lazarus from the dead. He wept anyway. He didn't rush past Mary's grief or his own. Tears are not a lack of faith. Even when Jesus knows the ending, he grieves with you.",
   q:"How do you handle grief?", o:["I cry freely","I hold it in","I stay busy","I'm learning to grieve"],
   p:"What grief have you been holding? What does it mean that Jesus weeps with you?",
   a:"Give yourself permission today to feel something you've been avoiding."},
  {r:"Micah 7:8", t:"Rejoice not against me, O mine enemy: when I fall, I shall arise; when I sit in darkness, the LORD shall be a light unto me.", th:"When I fall, I shall arise", c:"Micah 7:7-9",
   m:"This is a defiant verse. When I fall, I will get back up. When I sit in darkness, the LORD will be my light. Falling and darkness are both assumed. Neither is final. Faith isn't never falling. It's getting up again, because God is your light.",
   q:"Where have you fallen recently?", o:["A habit","A relationship","A goal","My faith"],
   p:"Write about a recent fall. Then write: I shall arise.",
   a:"Get back up in one area where you've stumbled. Start again today."},
  {r:"1 Peter 4:10", t:"As every man hath received the gift, even so minister the same one to another, as good stewards of the manifold grace of God.", th:"Good stewards", c:"1 Peter 4:10-11",
   m:"Every person has received a gift from God, and it's meant to be used for others. A steward manages something that belongs to someone else. Your gifts aren't just for you. They're God's grace, entrusted to you and meant to be passed on.",
   q:"What gift do you think God has given you?", o:["Encouragement","Serving","Teaching","Hospitality"],
   p:"How could you use your gift to serve someone this week?",
   a:"Use your gift today to serve someone else."},
  {r:"2 Chronicles 7:14", t:"If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.", th:"If my people", c:"2 Chronicles 7:11-16",
   m:"God spoke this to Solomon after the temple was dedicated. Notice who it's addressed to: my people. Healing starts not with pointing fingers at others, but with God's own people humbling themselves, praying, seeking his face, and turning. Change in the world often starts with change in us.",
   q:"Which step feels most needed in your life?", o:["Humble myself","Pray","Seek his face","Turn from something"],
   p:"What would it look like for you to humble yourself and seek God's face this week?",
   a:"Pray today for your community, starting with confessing your own part."},
  {r:"Psalm 139:1-3", t:"O LORD, thou hast searched me, and known me. Thou knowest my downsitting and mine uprising, thou understandest my thought afar off. Thou compassest my path and my lying down, and art acquainted with all my ways.", th:"Fully known", c:"Psalm 139:1-6",
   m:"God knows when you sit down and when you get up. He understands your thoughts from far away. He's acquainted with all your ways. That can feel scary at first: fully seen. But David isn't afraid. Being completely known and still loved is the safest place there is.",
   q:"How does it feel to be fully known by God?", o:["Comforting","Uncomfortable","Both","I'm not sure"],
   p:"What part of you do you hide from others? How does it feel to know God already knows and loves it?",
   a:"Let one trusted person know you a little better today."},
  {r:"John 13:7", t:"Jesus answered and said unto him, What I do thou knowest not now; but thou shalt know hereafter.", th:"You'll understand later", c:"John 13:1-17",
   m:"Jesus knelt to wash Peter's feet, and Peter protested. Jesus said: What I do thou knowest not now; but thou shalt know hereafter. Some of what God is doing in your life won't make sense right now. Understanding may come later. For now, trust is enough.",
   q:"What doesn't make sense to you right now?", o:["A loss","A delay","A closed door","A hard change"],
   p:"Write about something you don't understand. Then write: I will know hereafter.",
   a:"Serve someone humbly today, in a way that might surprise them."},
  {r:"1 John 1:9", t:"If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.", th:"Faithful to forgive", c:"1 John 1:5-10",
   m:"If we confess, God forgives. He's faithful, meaning he always does it. And he's just, meaning it's right for him to forgive, because Jesus paid for it. Then he goes further: he cleanses us from all unrighteousness. Not just pardoned, but made clean.",
   q:"What holds you back from confessing?", o:["Shame","Pride","Fear","Nothing"],
   p:"Bring what needs confessing to God here. Then write: He is faithful and just to forgive me.",
   a:"Confess one specific thing to God today and receive his forgiveness."},
  {r:"Ecclesiastes 5:2", t:"Be not rash with thy mouth, and let not thine heart be hasty to utter any thing before God: for God is in heaven, and thou upon earth: therefore let thy words be few.", th:"Let thy words be few", c:"Ecclesiastes 5:1-7",
   m:"God is in heaven and you are on earth, so let your words be few. This isn't about being afraid to pray. It's about coming to God with humility and attention instead of rushing in with a flood of words. Sometimes the best prayers are short, and the silence after them is long.",
   q:"What are your prayers usually like?", o:["Long and wordy","Short and simple","Mostly requests","Mostly silence"],
   p:"Try praying in only one sentence today. What would that sentence be?",
   a:"Pray today with very few words, then sit in silence for a minute."},
  {r:"Nahum 1:7", t:"The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him.", th:"A stronghold in trouble", c:"Nahum 1:7",
   m:"In the middle of a book about judgment on a cruel empire, here's a gentle line: the LORD is good, a stronghold in the day of trouble, and he knows those who trust him. To be known by God means more than being noticed. It means being cared for personally.",
   q:"What does it mean to you to be known by God?", o:["Comfort","Accountability","Belonging","I'm not sure"],
   p:"Write about how it feels to be known personally by God in your current trouble.",
   a:"Make a list today of the ways God has been your stronghold."},
  {r:"Psalm 139:7-10", t:"Whither shall I go from thy spirit? or whither shall I flee from thy presence? If I ascend up into heaven, thou art there: if I make my bed in hell, behold, thou art there. If I take the wings of the morning, and dwell in the uttermost parts of the sea; Even there shall thy hand lead me, and thy right hand shall hold me.", th:"Even there", c:"Psalm 139:7-12",
   m:"David imagines going to the heights of heaven, the depths of the grave, the farthest edge of the sea. Every time, God is there. There is no place you can go where God is not. Not your darkest place, your farthest wandering, or your worst moment. Even there, his hand will lead you.",
   q:"Where do you feel farthest from God?", o:["In my failures","In my grief","In my busyness","In my doubts"],
   p:"Write about the place where you feel farthest away. Then write: Even there.",
   a:"Wherever you go today, remind yourself: Even here, his hand leads me."},
  {r:"2 Chronicles 20:12", t:"O our God, wilt thou not judge them? for we have no might against this great company that cometh against us; neither know we what to do: but our eyes are upon thee.", th:"Our eyes are upon thee", c:"2 Chronicles 20:1-17",
   m:"King Jehoshaphat faced an army far bigger than his. His prayer was honest: we have no might, neither know we what to do: but our eyes are upon thee. It's a perfect prayer for when you're out of options. You don't need to know what to do. You need to know where to look.",
   q:"Where are you out of answers?", o:["A relationship","A decision","A crisis","My own heart"],
   p:"Write your own version of this prayer: 'I don't know what to do about ___, but my eyes are on you.'",
   a:"Pray Jehoshaphat's prayer over your biggest problem today."},
  {r:"John 14:1-3", t:"Let not your heart be troubled: ye believe in God, believe also in me. In my Father's house are many mansions: if it were not so, I would have told you. I go to prepare a place for you. And if I go and prepare a place for you, I will come again, and receive you unto myself; that where I am, there ye may be also.", th:"A place prepared", c:"John 14:1-7",
   m:"On the night before he died, Jesus comforted his friends. Don't be troubled. Believe in God; believe also in me. Then a promise: in my Father's house are many rooms, and I'm going to prepare a place for you. Jesus is getting a room ready, and he's coming back for you.",
   q:"What is troubling your heart right now?", o:["The future","A loss","Fear of death","Something at home"],
   p:"What does it mean to you that Jesus is preparing a place for you?",
   a:"Prepare something special for someone today, as a picture of what Jesus is doing for you."},
  {r:"1 John 3:1", t:"Behold, what manner of love the Father hath bestowed upon us, that we should be called the sons of God: therefore the world knoweth us not, because it knew him not.", th:"What manner of love", c:"1 John 3:1-3",
   m:"John seems almost amazed as he writes: look at what kind of love the Father has given us, that we should be called the children of God. It's not just a title. It's who we are. And if the world doesn't understand you, it's because it didn't understand him either.",
   q:"How does it feel to be called God's child?", o:["Amazing","Hard to believe","Comforting","Unfamiliar"],
   p:"What manner of love has the Father shown you? Write about it with wonder.",
   a:"Take a moment today to simply marvel at being God's child."},
  {r:"Psalm 139:23-24", t:"Search me, O God, and know my heart: try me, and know my thoughts: And see if there be any wicked way in me, and lead me in the way everlasting.", th:"Search me, O God", c:"Psalm 139:17-24",
   m:"This is a brave prayer. David invites God to search him, test him, and show him anything wrong. It isn't a request for condemnation. It's a request for direction: lead me in the way everlasting. We can't see our own blind spots. God can, and he leads us kindly.",
   q:"How willing are you to pray this prayer?", o:["Very willing","A little nervous","Not yet","I pray it often"],
   p:"Pray this verse slowly. Then write anything that comes to mind. What might God be showing you?",
   a:"Ask a trusted friend today if there's something you're not seeing about yourself."},
  {r:"John 14:6", t:"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me.", th:"The way", c:"John 14:1-11",
   m:"Thomas asked how they could know the way when they didn't know where Jesus was going. Jesus answered: I am the way. Not a map, a person. He doesn't just show the way to God. He is the way. When you don't know which road to take, you can follow him.",
   q:"Which do you need most from Jesus today?", o:["The way","The truth","The life","All three"],
   p:"Where do you feel lost? What would it mean to follow a person rather than a map?",
   a:"When you're unsure today, ask: What would Jesus do here?"},
  {r:"Habakkuk 2:3", t:"For the vision is yet for an appointed time, but at the end it shall speak, and not lie: though it tarry, wait for it; because it will surely come, it will not tarry.", th:"Though it tarry, wait", c:"Habakkuk 2:1-4",
   m:"Habakkuk complained that God was slow. God told him to write the vision down, because it was for an appointed time. It may seem slow, but wait for it, because it will surely come. God's timing often feels late to us. From his side, it never is.",
   q:"What vision or promise are you waiting on?", o:["A dream for my life","Change in someone I love","Justice","Healing"],
   p:"Write down the vision or promise you're waiting on, the way Habakkuk was told to.",
   a:"Write your hope down somewhere safe today, and date it."},

const BY_REF = Object.fromEntries(VERSES.map(v => [v.r, v]));

// ---------- Dates ----------
const pad = n => String(n).padStart(2, "0");
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const dayNumber = k => { const [y, m, d] = k.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const fmtLong = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
const fmtShort = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" });
const fmtWd = new Intl.DateTimeFormat(undefined, { weekday: "short" });
const fmtMonth = new Intl.DateTimeFormat(undefined, { month: "long", year: "numeric" });

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const scripture = t => esc(t).replace(/\b(LORD|GOD)\b/g, w => '<span class="sc">' + w[0] + w.slice(1).toLowerCase() + '</span>');
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const FLAME = '<svg viewBox="0 0 16 20" aria-hidden="true"><path d="M8 1c1.4 3.8 5 5.6 5 10.6a5 5 0 0 1-10 0C3 9 4.3 7.5 5.4 6c.4 2.1 1.4 3.2 3 3.4C7.8 6.6 7.6 3.9 8 1z"/></svg>';

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

// ---------- Storage: private per-person store in your Claude account, with a browser fallback ----------
const DEVICE_KEY = "lamp-path:device";
const CACHE_KEY = "lamp-path:cache";
const DRAFT_KEY = "lamp-path:drafts";
const store = { mode: "starting", docs: {}, col: null, pending: [], unsub: null };
const chains = {};
const drafts = lsGet(DRAFT_KEY) || {};
let draftTimer;
function saveDrafts() { clearTimeout(draftTimer); draftTimer = setTimeout(() => lsSet(DRAFT_KEY, drafts), 300); }

function putDoc(id, data) {
  data = { ...data, updatedAt: Date.now() };
  store.docs = { ...store.docs, [id]: data };
  persist(id, data);
  render();
}
function removeDoc(id) {
  const next = { ...store.docs }; delete next[id];
  store.docs = next;
  persist(id, null);
  render();
}
function persist(id, data, retried) {
  if (store.mode === "starting") { store.pending.push([id, data]); return; }
  if (store.mode === "device") { lsSet(DEVICE_KEY, store.docs); return; }
  const ref = store.col.doc(id);
  chains[id] = (chains[id] || Promise.resolve()).catch(() => {})
    .then(() => data ? ref.set(data) : ref.delete())
    .catch(e => {
      const code = e && e.code;
      if (code === "unavailable" && !retried) { setTimeout(() => persist(id, data, true), 700 + Math.random() * 900); return; }
      if (code === "quota_exceeded") { toast("Your journal is full. Delete a few old entries to make room."); return; }
      useDevice("Couldn't reach your account. New entries are saving in this browser for now.");
    });
}
function useDevice(message) {
  if (store.unsub) { try { store.unsub(); } catch {} store.unsub = null; }
  store.mode = "device";
  lsSet(DEVICE_KEY, store.docs);
  if (message) toast(message);
  render();
}

async function initStore() {
  const deviceDocs = lsGet(DEVICE_KEY) || {};
  store.docs = { ...(lsGet(CACHE_KEY) || {}), ...deviceDocs };
  render();

  let db = null, user = null, uid = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (user) uid = await user.id();
    }
  } catch {}

  setSeed(uid ? String(hashSeed("u:" + uid)) : deviceSeed());
  render();

  if (!db || !uid) {
    store.mode = "device";
    store.pending = [];
    lsSet(DEVICE_KEY, store.docs);
    render();
    return;
  }

  try {
    store.col = db.collection("data/users/" + uid);
    const snap = await store.col.get();
    const cloud = {};
    snap.docs.forEach(d => { cloud[d.id] = d.data(); });
    store.mode = "cloud";
    // Move anything written in this browser (or while starting up) into the account
    const pending = store.pending; store.pending = [];
    const local = { ...deviceDocs };
    pending.forEach(([id, data]) => { local[id] = data; });
    store.docs = { ...cloud };
    Object.entries(local).forEach(([id, data]) => {
      if (data === null) { if (cloud[id]) persist(id, null); return; }
      if (!cloud[id] || (data.updatedAt || 0) > (cloud[id].updatedAt || 0)) {
        store.docs[id] = data;
        persist(id, data);
      }
    });
    Promise.all(Object.keys(local).map(id => chains[id])).then(() => {
      if (store.mode === "cloud") lsSet(DEVICE_KEY, {});
    });
    store.unsub = store.col.onSnapshot(s => {
      const next = {};
      s.docs.forEach(d => { next[d.id] = d.data(); });
      store.docs = next;
      lsSet(CACHE_KEY, next);
      render();
    }, () => useDevice("Lost the connection to your account. Entries are saving in this browser for now."));
    render();
  } catch {
    useDevice();
  }
}

// ---------- Each person's verse order ----------
// Everyone gets all the verses in their own shuffled order, so nothing repeats within a year
// and two people rarely share a day. Signed in, the order comes from your account, so it
// follows you across devices; otherwise it's kept in this browser.
const SEED_KEY = "lamp-path:seed";
const DEVICE_SEED_KEY = "lamp-path:device-seed";
let seed = lsGet(SEED_KEY);
function setSeed(s) { if (s !== seed) { seed = s; lsSet(SEED_KEY, s); } }
function deviceSeed() {
  let s = lsGet(DEVICE_SEED_KEY);
  if (!s) {
    s = "d" + (window.crypto && crypto.getRandomValues ? crypto.getRandomValues(new Uint32Array(1))[0] : Math.floor(Math.random() * 2 ** 32));
    lsSet(DEVICE_SEED_KEY, s);
  }
  return s;
}
function hashSeed(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffledOrder(s) {
  let a = hashSeed(String(s));
  const rand = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const order = VERSES.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}
let orderCache = { key: null, order: null };
function currentOrder() {
  if (!seed) return null;
  const n = VERSES.length, today = dayNumber(todayKey());
  // Days you've answered in the past year keep their verse, and the shuffle works around them
  const pins = Object.values(store.docs)
    .filter(d => d && d.kind === "day" && BY_REF[d.ref] && dayNumber(d.date) > today - n && dayNumber(d.date) <= today)
    .sort((a, b) => (b.date < a.date ? -1 : 1));
  const key = seed + "|" + pins.map(d => d.date + "=" + d.ref).join(",");
  if (orderCache.key === key) return orderCache.order;
  const order = shuffledOrder(seed);
  const slotOf = [];
  order.forEach((vi, slot) => { slotOf[vi] = slot; });
  const fixed = new Set();
  pins.forEach(d => {
    const slot = dayNumber(d.date) % n, vi = VERSES.indexOf(BY_REF[d.ref]), from = slotOf[vi];
    if (fixed.has(slot) || fixed.has(from)) return;
    const other = order[slot];
    order[slot] = vi; order[from] = other;
    slotOf[vi] = slot; slotOf[other] = from;
    fixed.add(slot);
  });
  orderCache = { key, order };
  return order;
}
// Any run of 366 days lands on 366 different slots, so no verse repeats within a year
function verseFor(k) {
  const order = currentOrder();
  return order ? VERSES[order[dayNumber(k) % VERSES.length]] : null;
}

function statusText() {
  if (store.mode === "cloud") return "Private to you, saved to your Claude account";
  if (store.mode === "device") return "Private to you, saved in this browser only";
  return "Opening your journal…";
}

// ---------- Derived data ----------
const dayDoc = k => store.docs["day-" + k] || null;
const hasContent = d => !!d && (d.mood || d.poll != null || d.rating || (d.answer && d.answer.trim()) || d.done);
// A day you've already answered keeps the verse you answered
const verseForDay = k => { const d = dayDoc(k); return (d && BY_REF[d.ref]) || verseFor(k); };
function updateDay(k, patch) {
  const v = verseForDay(k);
  const cur = dayDoc(k) || {};
  putDoc("day-" + k, { ...cur, ...patch, kind: "day", date: k, ref: v.r });
}
function litDays() {
  const s = new Set();
  Object.values(store.docs).forEach(d => { if (d && d.kind === "day" && hasContent(d)) s.add(d.date); });
  return s;
}
function streak(lit) {
  let k = todayKey();
  if (!lit.has(k)) k = addDays(k, -1);
  let n = 0;
  while (lit.has(k)) { n++; k = addDays(k, -1); }
  return n;
}

  const gw = "https://www.biblegateway.com/passage/?search=" + encodeURIComponent(v.c) + "&version=KJV";

  </div>

  <section class="block" aria-labelledby="mood-h">
    <span class="label" id="mood-h">How are you arriving today?</span>
    <div class="chips">
      ${MOODS.map(m => `<button class="chip" id="mood-${m[0]}" data-act="mood" data-v="${m[0]}" aria-pressed="${day.mood === m[0]}">${m[1]}</button>`).join("")}
    </div>
    ${mood ? `<p class="note-line">${esc(mood[2])}</p>` : ""}
  </section>

  <article class="verse" aria-label="Verse">
    <span class="label theme">${esc(v.th)}</span>
    <blockquote>${scripture(v.t)}</blockquote>
    <div class="verse-foot">
      <span class="ref">${esc(v.r)}<small>KJV</small></span>
      <div class="verse-actions">
        <button class="ghost" id="copy" data-act="copy">
          <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Copy
        </button>
        <a class="ghost" href="${gw}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Read ${esc(v.c)}
        </a>
      </div>
    </div>
  </article>

  <section class="section">
    <h2>Reflect</h2>
    <p class="reflection">${esc(v.m)}</p>
  </section>

  <section class="section" aria-labelledby="respond-h">
    <h2 id="respond-h">How does it speak to you?</h2>
    <p class="q" id="poll-q">${esc(v.q)}</p>
    <div class="options" role="radiogroup" aria-labelledby="poll-q">
      ${v.o.map((o, i) => `<button class="option" id="poll-${i}" role="radio" data-act="poll" data-i="${i}" aria-checked="${day.poll === i}"><span class="dot"></span>${esc(o)}</button>`).join("")}
    </div>

    <p class="q" id="rate-q" style="margin-top:10px">How strongly did this verse speak to you?</p>
    <div class="rating" role="group" aria-labelledby="rate-q">
      ${[1, 2, 3, 4, 5].map(n => `<button class="rate" id="rate-${n}" data-act="rate" data-v="${n}" aria-pressed="${day.rating === n}" aria-label="${n} of 5, ${RATE_NOTES[n]}">${n}</button>`).join("")}
      <span class="rate-note">${day.rating ? esc(RATE_NOTES[day.rating]) : "1 is a little, 5 is deeply"}</span>
    </div>
  </section>

  <section class="section" aria-labelledby="journal-h">
    <span class="label" id="journal-h">Journal prompt</span>
    <p class="prompt">${esc(v.p)}</p>
    <textarea id="answer" data-draft="${draftKey}" placeholder="Write freely. Only you can see this." aria-labelledby="journal-h">${esc(answer)}</textarea>
    <div class="row">
      <button class="btn" data-act="save-answer">${day.answer ? "Update journal" : "Save to journal"}</button>
      ${day.answer && !dirty ? `<span class="saved">${CHECK}Saved to your journal</span>` : ""}
      ${dirty && day.answer ? `<span class="saved">Unsaved changes</span>` : ""}
    </div>
  </section>

  <section class="section">
    <h2>Carry it with you</h2>
    <div class="practice">
      <p>${esc(v.a)}</p>
      <button class="done-btn" id="done" data-act="done" aria-pressed="${!!day.done}">
        <span class="box">${day.done ? CHECK : ""}</span>${day.done ? "Done. Well walked." : "I did this today"}
      </button>
    </div>
  </section>

  <p class="status-line">${esc(statusText())}</p>`;
}

function journalEntries() {
  const out = [];
  Object.entries(store.docs).forEach(([id, d]) => {
    if (!d) return;
    if (d.kind === "note") out.push({ id, ...d, when: d.createdAt || d.updatedAt || 0 });
    else if (d.kind === "day" && hasContent(d)) out.push({ id, ...d, when: dateOf(d.date).getTime() + 43200000 });
  });
  return out.sort((a, b) => b.when - a.when);
}

function entryCard(e) {
  const open = ui.open === e.id;
  const dateLabel = fmtShort.format(new Date(e.when));
  let head, title, body, meta = "", actions;
  if (e.kind === "day") {
    const v = BY_REF[e.ref] || verseFor(e.date) || { r: "", th: "" };
    const mood = MOODS.find(m => m[0] === e.mood);
    head = `<span class="entry-kind">Daily reflection</span>`;
    title = `${esc(e.ref || v.r)} · ${esc(v.th)}`;
    const tags = [];
    if (mood) tags.push("Arrived " + mood[1].toLowerCase());
    if (e.pollText) tags.push(e.pollText);
    if (e.rating) tags.push("Spoke " + RATE_NOTES[e.rating].toLowerCase());
    if (e.done) tags.push("Practice done");
    meta = tags.length ? `<div class="meta">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : "";
    body = e.answer ? `<p class="entry-body ${open ? "" : "clamp"}">${esc(e.answer)}</p>` : "";
    actions = `<button class="link" data-act="open-day" data-date="${e.date}">Open this day</button>`;
  } else {
    head = `<span class="entry-kind">Note</span>`;
    title = esc(e.title || (e.body || "").split("\n")[0].slice(0, 70) || "Untitled");
    body = ui.editing === e.id
      ? `<input type="text" id="edit-title" data-draft="edit-title:${e.id}" value="${esc(drafts["edit-title:" + e.id] ?? e.title ?? "")}" placeholder="Title (optional)">
         <textarea id="edit-body" data-draft="edit:${e.id}">${esc(drafts["edit:" + e.id] ?? e.body ?? "")}</textarea>`
      : `<p class="entry-body ${open ? "" : "clamp"}">${esc(e.body)}</p>`;
    actions = ui.editing === e.id
      ? `<button class="btn small" data-act="edit-save" data-id="${e.id}">Save changes</button><button class="link" data-act="edit-cancel" data-id="${e.id}">Cancel</button>`
      : `<button class="link" data-act="edit" data-id="${e.id}">Edit</button>`;
  }
  const confirming = ui.confirm === e.id;
  return `
  <article class="entry">
    <div class="entry-head">${head}<span class="entry-date">${esc(dateLabel)}</span></div>
    <button class="entry-title" id="t-${e.id}" data-act="toggle" data-id="${e.id}" aria-expanded="${open}">${title}</button>
    ${meta}
    ${body}
    ${open || ui.editing === e.id ? `<div class="entry-actions">
      ${actions}
      ${confirming
        ? `<span class="confirm">Delete this entry for good? <button class="btn small danger" data-act="del-yes" data-id="${e.id}">Delete</button><button class="link" data-act="del-no">Keep it</button></span>`
        : `<button class="link" data-act="del" data-id="${e.id}">Delete</button>`}
    </div>` : ""}
  </article>`;
}

function viewJournal() {
  const all = journalEntries();
  const q = ui.q.trim().toLowerCase();
  const list = all.filter(e => {
    if (ui.filter === "day" && e.kind !== "day") return false;
    if (ui.filter === "note" && e.kind !== "note") return false;
    if (ui.filter === "deep" && !(e.rating >= 4)) return false;
    if (!q) return true;
    return [e.title, e.body, e.answer, e.ref, e.pollText].some(x => x && String(x).toLowerCase().includes(q));
  });
  let lastMonth = "";
  const items = list.map(e => {
    const m = fmtMonth.format(new Date(e.when));
    const heading = m !== lastMonth ? `<div class="month">${esc(m)}</div>` : "";
    lastMonth = m;
    return heading + entryCard(e);
  }).join("");
  const filters = [["all", "All"], ["day", "Daily reflections"], ["note", "Notes"], ["deep", "Spoke deeply"]];
  const emptyMsg = all.length
    ? "Nothing matches that search."
    : (store.mode === "starting" ? "Opening your journal…" : "Your journal is empty. Write your first entry above, or answer today's prompt.");

  return `
  <header class="top">
    <span class="mark">${FLAME}Lamp &amp; Path</span>
    <span class="streak">${all.length} ${all.length === 1 ? "entry" : "entries"}</span>
  </header>
  <div class="dateline">
    <h1>Journal</h1>
    <p class="muted">${esc(statusText())}</p>
  </div>

  <section class="composer" aria-labelledby="new-h">
    <span class="label" id="new-h">New entry</span>
    <input type="text" id="c-title" data-draft="c-title" value="${esc(drafts["c-title"] ?? "")}" placeholder="Title (optional)" aria-label="Title">
    <textarea id="c-body" data-draft="c-body" placeholder="What's on your heart today?" aria-label="Entry">${esc(drafts["c-body"] ?? "")}</textarea>
    <div class="row"><button class="btn" data-act="compose">Save entry</button></div>
  </section>

  <div class="block">
    <input type="search" id="search" value="${esc(ui.q)}" placeholder="Search your journal" aria-label="Search your journal">
    <div class="filters" role="group" aria-label="Filter entries">
      ${filters.map(f => `<button class="chip" id="f-${f[0]}" data-act="filter" data-v="${f[0]}" aria-pressed="${ui.filter === f[0]}">${f[1]}</button>`).join("")}
    </div>
  </div>

  <div class="entries">${items || `<p class="empty">${emptyMsg}</p>`}</div>`;
}

function viewPath() {
  const lit = litDays();
  const t = todayKey();
  const s = streak(lit);
  const notes = Object.values(store.docs).filter(d => d && d.kind === "note").length;

  // Five weeks, Sunday first, ending with this week
  const today = dateOf(t);
  const start = addDays(t, -today.getDay() - 28);
  const wd = Array.from({ length: 7 }, (_, i) => fmtWd.format(dateOf(addDays(start, i))).slice(0, 2));
  const cells = Array.from({ length: 35 }, (_, i) => {
    const k = addDays(start, i);
    const future = k > t;
    const cls = ["cell", lit.has(k) ? "lit" : "", k === t ? "today" : "", future ? "future" : ""].join(" ");
    return `<button class="${cls}" id="cal-${k}" data-act="open-day" data-date="${k}" ${future ? 'tabindex="-1" aria-hidden="true"' : ""} aria-label="${esc(fmtLong.format(dateOf(k)))}${lit.has(k) ? ", reflected" : ""}">${dateOf(k).getDate()}</button>`;
  }).join("");

  const rows = Array.from({ length: 21 }, (_, i) => {
    const k = addDays(t, -i);
    const v = verseForDay(k) || { r: "…", th: "" };
    const d = dateOf(k);
    return `<button class="day-row" id="row-${k}" data-act="open-day" data-date="${k}">
      <span class="d"><b>${i === 0 ? "Today" : esc(fmtWd.format(d))}</b>${esc(fmtShort.format(d))}</span>
      <span class="v"><strong>${esc(v.r)}</strong><span>${esc(v.th)}</span></span>
      <svg class="lamp ${lit.has(k) ? "on" : ""}" viewBox="0 0 16 20" aria-label="${lit.has(k) ? "Reflected" : "Not yet"}"><path d="M8 1c1.4 3.8 5 5.6 5 10.6a5 5 0 0 1-10 0C3 9 4.3 7.5 5.4 6c.4 2.1 1.4 3.2 3 3.4C7.8 6.6 7.6 3.9 8 1z"/></svg>
    </button>`;
  }).join("");

  return `
  <header class="top">
    <span class="mark">${FLAME}Lamp &amp; Path</span>
  </header>
  <div class="dateline">
    <h1>Past days</h1>
    <p class="muted">Missed a day? Every verse is still here. Tap one to read and reflect.</p>
  </div>
  <div class="stats">
    <div class="stat"><b>${s}</b><span>day streak</span></div>
    <div class="stat"><b>${lit.size}</b><span>days reflected</span></div>
    <div class="stat"><b>${notes}</b><span>notes written</span></div>
  </div>
  <section class="block" aria-label="Last five weeks">
    <div class="cal">${wd.map(w => `<span class="wd">${esc(w)}</span>`).join("")}${cells}</div>
  </section>
  <section class="days" aria-label="Recent verses">${rows}</section>`;
}

// ---------- Render ----------
function render() {
  const active = document.activeElement;
  const focusId = active && active.id && $("#view").contains(active) ? active.id : null;
  let sel = null;
  try { if (focusId && typeof active.selectionStart === "number") sel = [active.selectionStart, active.selectionEnd]; } catch {}

  $("#view").innerHTML = ui.view === "journal" ? viewJournal() : ui.view === "path" ? viewPath() : viewToday();
  VIEWS.forEach(v => {
    const tab = $("#tab-" + v);
    if (v === ui.view) tab.setAttribute("aria-current", "page"); else tab.removeAttribute("aria-current");
  });

  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus({ preventScroll: true });
      if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch {}
    }
  }
}

function go(view, date) {
  ui.view = view;
  ui.date = date || null;
  ui.open = null; ui.editing = null; ui.confirm = null;
  render();
  window.scrollTo(0, 0);
}

// ---------- Events ----------
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "search") { ui.q = el.value; render(); return; }
  const key = el.dataset && el.dataset.draft;
  if (key) { drafts[key] = el.value; saveDrafts(); }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  const k = ui.date || todayKey();
  const day = dayDoc(k) || {};
  const v = verseForDay(k);

  switch (act) {
    case "nav": go(b.dataset.view); break;
    case "go-today": go("today"); break;
    case "open-day": go("today", b.dataset.date === todayKey() ? null : b.dataset.date); break;
    case "mood": updateDay(k, { mood: day.mood === b.dataset.v ? null : b.dataset.v }); break;
    case "poll": {
      const i = Number(b.dataset.i);
      updateDay(k, day.poll === i ? { poll: null, pollText: null } : { poll: i, pollText: v.o[i] });
      break;
    }
    case "rate": {
      const n = Number(b.dataset.v);
      updateDay(k, { rating: day.rating === n ? null : n });
      break;
    }
    case "done":
      updateDay(k, { done: !day.done });
      if (!day.done) toast("Marked done. Keep walking.");
      break;
    case "save-answer": {
      const text = ($("#answer").value || "").trim();
      if (!text && !day.answer) { $("#answer").focus(); toast("Write a few words first."); break; }
      delete drafts["answer:" + k]; saveDrafts();
      updateDay(k, { answer: text });
      toast(text ? "Saved to your journal" : "Cleared");
      break;
    }
    case "copy": {
      const text = v.t + " (" + v.r + " KJV)";
      try { await navigator.clipboard.writeText(text); toast("Verse copied"); }
      catch {
        const range = document.createRange();
        range.selectNodeContents($(".verse blockquote"));
        const s = getSelection(); s.removeAllRanges(); s.addRange(range);
        toast("Verse selected. Use your device's Copy.");
      }
      break;
    }
    case "compose": {
      const body = ($("#c-body").value || "").trim();
      const title = ($("#c-title").value || "").trim();
      if (!body) { $("#c-body").focus(); toast("Write a few words first."); break; }
      const id = "note-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      delete drafts["c-body"]; delete drafts["c-title"]; saveDrafts();
      putDoc(id, { kind: "note", title, body, date: todayKey(), createdAt: Date.now() });
      toast("Entry saved");
      break;
    }
    case "filter": ui.filter = b.dataset.v; render(); break;
    case "toggle":
      if (ui.editing !== b.dataset.id) { ui.open = ui.open === b.dataset.id ? null : b.dataset.id; ui.confirm = null; render(); }
      break;
    case "edit": ui.editing = b.dataset.id; ui.open = b.dataset.id; ui.confirm = null; render(); $("#edit-body") && $("#edit-body").focus(); break;
    case "edit-cancel": {
      const id = b.dataset.id;
      delete drafts["edit:" + id]; delete drafts["edit-title:" + id]; saveDrafts();
      ui.editing = null; render();
      break;
    }
    case "edit-save": {
      const id = b.dataset.id;
      const cur = store.docs[id]; if (!cur) break;
      const body = ($("#edit-body").value || "").trim();
      const title = ($("#edit-title").value || "").trim();
      if (!body) { toast("An entry needs some words. Use Delete to remove it."); break; }
      delete drafts["edit:" + id]; delete drafts["edit-title:" + id]; saveDrafts();
      ui.editing = null;
      putDoc(id, { ...cur, title, body });
      toast("Changes saved");
      break;
    }
    case "del": ui.confirm = b.dataset.id; render(); break;
    case "del-no": ui.confirm = null; render(); break;
    case "del-yes": {
      const id = b.dataset.id;
      ui.confirm = null; ui.open = null; ui.editing = null;
      removeDoc(id);
      toast("Entry deleted");
      break;
    }
  }
});

// Roll over to the new day's verse if the app is left open past midnight
let shownDay = todayKey();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && todayKey() !== shownDay) { shownDay = todayKey(); render(); }
});

render();
initStore();
</script>
