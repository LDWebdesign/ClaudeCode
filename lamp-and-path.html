   a:"Spend five minutes today meditating on one verse, reading it slowly several times."},
  {r:"Acts 1:8", t:"But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judaea, and in Samaria, and unto the uttermost part of the earth.", th:"Ye shall receive power", c:"Acts 1:1-11",
   m:"Before Jesus ascended, he promised the disciples power through the Holy Spirit, and a mission that would start at home and reach the ends of the earth. They didn't have to manufacture the power. They had to wait for it and then go. Your mission starts right where you are.",
   q:"Where is your Jerusalem, the mission field closest to you?", o:["My home","My workplace","My neighborhood","My friendships"],
   p:"Who in your own Jerusalem needs to see Jesus in you?",
   a:"Ask the Holy Spirit for power today before you step out the door."},
  {r:"Isaiah 1:18", t:"Come now, and let us reason together, saith the LORD: though your sins be as scarlet, they shall be as white as snow; though they be red like crimson, they shall be as wool.", th:"White as snow", c:"Isaiah 1:16-20",
   m:"God invites his people to reason together, to sit down and talk it through. Then comes the offer: scarlet sins made white as snow. Scarlet dye in the ancient world was nearly impossible to wash out. That's the point. What we can't remove, God can.",
   q:"What feels like a stain you can't wash out?", o:["Something I did","Something I said","Something done to me","A pattern I keep repeating"],
   p:"Write about something you feel stained by. Then write God's promise: it shall be as white as snow.",
   a:"Wash your hands slowly today and thank God for washing your heart."},
  {r:"Job 1:21", t:"And said, Naked came I out of my mother's womb, and naked shall I return thither: the LORD gave, and the LORD hath taken away; blessed be the name of the LORD.", th:"Blessed be the name", c:"Job 1:13-22",
   m:"Job lost his wealth, his servants, and all ten of his children in a single day. He tore his robe and grieved honestly. Then he fell down and worshipped. This verse isn't a cliché to hand to grieving people. It's the hard-won prayer of a man in the worst moment of his life.",
   q:"How do you respond to God when you lose something?", o:["With anger","With silence","With questions","With trust, eventually"],
   p:"Write about something you've lost. Can you honestly say 'blessed be the name of the LORD' over it? If not yet, write that too.",
   a:"Be present with someone who is grieving today, without trying to fix it."},
  {r:"Matthew 5:3-4", t:"Blessed are the poor in spirit: for theirs is the kingdom of heaven. Blessed are they that mourn: for they shall be comforted.", th:"Blessed are the poor in spirit", c:"Matthew 5:1-12",
   m:"Jesus begins his most famous sermon by calling unlikely people blessed. The poor in spirit, those who know they don't have it together. Those who mourn. The kingdom belongs to people who know they need it. Grief is not a sign that God is far away. It's where he promises comfort.",
   q:"Which do you relate to more today?", o:["Poor in spirit","Mourning","Both","Neither"],
   p:"Where do you feel poor in spirit or grieving? How does it feel to hear Jesus call you blessed?",
   a:"Comfort someone who is mourning today."},
  {r:"Psalm 4:8", t:"I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.", th:"In peace I will sleep", c:"Psalm 4",
   m:"David wrote this psalm in a time of distress. Yet he ends with a decision to lie down and sleep in peace. Sleep is an act of trust. You have to stop working, stop worrying, and let someone else keep watch. God never sleeps, so you can.",
   q:"How have you been sleeping lately?", o:["Well","Restless","Not enough","Worried thoughts keep me up"],
   p:"What keeps you up at night? Write it down here and hand it to God before you sleep tonight.",
   a:"Tonight, put your phone away early and pray this verse as you lie down."},
  {r:"Acts 2:42", t:"And they continued stedfastly in the apostles' doctrine and fellowship, and in breaking of bread, and in prayers.", th:"Continued stedfastly", c:"Acts 2:41-47",
   m:"The first church did four things steadily: learning the apostles' teaching, sharing life together, breaking bread, and praying. Nothing flashy. Just faithful. The early church grew not through programs but through people consistently doing ordinary things together.",
   q:"Which of the four do you most need right now?", o:["Teaching","Fellowship","Breaking bread","Prayer"],
   p:"Which of these practices is strongest in your life? Which is weakest?",
   a:"Share a meal with someone this week and talk about faith."},
  {r:"Genesis 1:27", t:"So God created man in his own image, in the image of God created he him; male and female created he them.", th:"In his image", c:"Genesis 1:26-31",
   m:"Of everything God made, only people are said to bear his image. In the ancient world, kings set up statues of themselves to mark where they ruled. God puts his image in ordinary people. That gives every person you meet a dignity that can't be earned or lost.",
   q:"Whose dignity is hardest for you to see?", o:["My own","Someone who hurt me","Someone I disagree with","Strangers"],
   p:"How would you treat people differently today if you saw God's image in each of them?",
   a:"Look for God's image in someone who's hard to love today."},
  {r:"Isaiah 6:8", t:"Also I heard the voice of the Lord, saying, Whom shall I send, and who will go for us? Then said I, Here am I; send me.", th:"Here am I; send me", c:"Isaiah 6:1-8",
   m:"Isaiah saw God's glory and felt completely undone by his own sin. Then an angel touched his lips with a coal and declared him clean. Only then did God ask, 'Whom shall I send?' Isaiah's answer came from being forgiven, not from feeling qualified: Here am I; send me.",
   q:"How do you feel about being sent by God?", o:["Excited","Nervous","Unqualified","Not sure where"],
   p:"Where might God be asking you to go or serve? What holds you back?",
   a:"Pray 'Here am I; send me' this morning, and watch for a chance to serve."},
  {r:"Matthew 5:6", t:"Blessed are they which do hunger and thirst after righteousness: for they shall be filled.", th:"Hunger and thirst", c:"Matthew 5:1-12",
   m:"Jesus uses the strongest words for wanting: hunger and thirst. Not mild interest in being good, but craving it like food and water. And the promise is that those who hunger like that will be filled. God satisfies the people who are desperate for him.",
   q:"What do you hunger for most these days?", o:["Peace","Purpose","Justice","God"],
   p:"Describe your spiritual appetite right now. What would it look like to hunger for righteousness?",
   a:"Skip a snack today and use the hunger as a reminder to pray."},
  {r:"Psalm 5:3", t:"My voice shalt thou hear in the morning, O LORD; in the morning will I direct my prayer unto thee, and will look up.", th:"In the morning", c:"Psalm 5:1-8",
   m:"David brings his prayer to God in the morning and then 'will look up,' like a watchman waiting to see what comes. Morning prayer isn't just a box to check. It's setting your request before God and then watching expectantly through the day for his answer.",
   q:"What does your morning usually start with?", o:["My phone","Rushing","Coffee and quiet","Prayer"],
   p:"What request do you want to lay before God this morning? Write it, and watch for his answer today.",
   a:"Tomorrow morning, talk to God before you look at a screen."},
  {r:"Acts 16:25", t:"And at midnight Paul and Silas prayed, and sang praises unto God: and the prisoners heard them.", th:"Songs at midnight", c:"Acts 16:22-34",
   m:"Paul and Silas had been beaten and locked in stocks in an inner cell. At midnight, in pain and darkness, they prayed and sang hymns. And the other prisoners were listening. Your praise in a dark season may be heard by people you don't even know are watching.",
   q:"What is your midnight right now?", o:["A hard situation","Physical pain","Feeling trapped","No midnight right now"],
   p:"Write a short song or prayer of praise from your midnight.",
   a:"Sing or play a worship song today, especially if you don't feel like it."},
  {r:"Matthew 5:7-8", t:"Blessed are the merciful: for they shall obtain mercy. Blessed are the pure in heart: for they shall see God.", th:"The merciful and the pure", c:"Matthew 5:1-12",
   m:"Mercy given becomes mercy received. And the pure in heart, those whose hearts aren't divided or hiding anything, will see God. These aren't rewards for perfect people. They describe what happens as God changes us. Mercy softens us. Purity clears our vision.",
   q:"Which is harder for you right now?", o:["Being merciful","Being pure in heart","Both","Neither"],
   p:"Where could you show mercy this week? What's clouding your heart from seeing God?",
   a:"Show mercy today to someone who doesn't deserve it."},
  {r:"Psalm 8:3-4", t:"When I consider thy heavens, the work of thy fingers, the moon and the stars, which thou hast ordained; What is man, that thou art mindful of him? and the son of man, that thou visitest him?", th:"What is man?", c:"Psalm 8",
   m:"David looked at the night sky, the moon and the stars, the work of God's fingers, and felt very small. Then came the wonder: the God who made all that is mindful of you. He thinks about you. He visits you. You're small, and you're not forgotten.",
   q:"When do you feel closest to awe?", o:["Under the night sky","At the ocean or mountains","Holding a child","In worship"],
   p:"What makes you feel small? How does it feel to know the Creator is mindful of you?",
   a:"Step outside tonight and look at the sky for five minutes."},
  {r:"Genesis 2:7", t:"And the LORD God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.", th:"The breath of life", c:"Genesis 2:4-9",
   m:"God shaped the first person from dust and breathed into him. Picture the closeness of that: God's face near enough to breathe into a human being. Every breath you take is borrowed from him. You are dust, fragile and small, and you are filled with the breath of God.",
   q:"How are you breathing today?", o:["Easily","Shallow and stressed","Tired","Grateful"],
   p:"What does it mean to you that your life began with the breath of God?",
   a:"Take ten slow, deep breaths today, thanking God for each one."},
  {r:"Job 19:25-27", t:"For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth: And though after my skin worms destroy this body, yet in my flesh shall I see God: Whom I shall see for myself, and mine eyes shall behold, and not another; though my reins be consumed within me.", th:"My redeemer liveth", c:"Job 19:23-27",
   m:"In the middle of terrible suffering, misunderstood by his friends, Job declares a hope that reaches beyond death: I know that my redeemer liveth. He believes he will see God with his own eyes. It's one of the earliest glimpses of resurrection hope in the Bible, shining from its darkest book.",
   q:"What gives you hope beyond this life?", o:["The resurrection","God's promises","Seeing loved ones again","I struggle with this"],
   p:"What does it mean to you that your Redeemer lives? How does it change the way you see your suffering?",
   a:"Say out loud today, especially if you're struggling: I know that my redeemer liveth."},
  {r:"Acts 20:35", t:"I have shewed you all things, how that so labouring ye ought to support the weak, and to remember the words of the Lord Jesus, how he said, It is more blessed to give than to receive.", th:"More blessed to give", c:"Acts 20:32-38",
   m:"Paul quotes a saying of Jesus that isn't recorded in any of the four Gospels: it is more blessed to give than to receive. Paul had worked with his own hands to support himself and help the weak. Generosity isn't just good for others. It's a blessing for the giver.",
   q:"When have you felt blessed by giving?", o:["Giving money","Giving time","Giving a gift","Helping someone"],
   p:"Write about a time you felt more blessed by giving than by receiving.",
   a:"Give something to someone today, expecting nothing back."},
  {r:"Isaiah 30:15", t:"For thus saith the Lord GOD, the Holy One of Israel; In returning and rest shall ye be saved; in quietness and in confidence shall be your strength: and ye would not.", th:"Quietness and confidence", c:"Isaiah 30:15-18",
   m:"God told Judah their rescue would come through returning and rest, and their strength through quietness and confidence. Instead, they wanted to run to Egypt for horses. 'And ye would not' is one of the saddest phrases in Scripture. God offered rest, and they chose rushing.",
   q:"Where do you run instead of resting?", o:["Busyness","Worry","My own plans","Other people"],
   p:"What would quietness and confidence look like in your current situation?",
   a:"Choose rest over rushing in one moment today."},
  {r:"Matthew 5:9", t:"Blessed are the peacemakers: for they shall be called the children of God.", th:"Peacemakers", c:"Matthew 5:1-12",
   m:"Jesus didn't say blessed are the peace-lovers or the peace-keepers. Peacemakers actively work for peace, stepping into conflict to bring reconciliation. It's hard, often thankless work. And Jesus says those who do it will be called children of God, because they look like their Father.",
   q:"Where is peace most needed around you?", o:["My family","My workplace","My friendships","My community"],
   p:"Is there a conflict you could help heal? What would being a peacemaker look like there?",
   a:"Take one step toward peace in a strained relationship today."},
  {r:"Psalm 13:5-6", t:"But I have trusted in thy mercy; my heart shall rejoice in thy salvation. I will sing unto the LORD, because he hath dealt bountifully with me.", th:"How long?", c:"Psalm 13",
   m:"Psalm 13 begins with 'How long, O LORD?' four times over. David is honest about feeling forgotten. But by the end, nothing in his circumstances has changed, and he chooses to trust anyway. Lament doesn't stop faith. Often it's the path to it.",
   q:"Where are you asking 'how long?'", o:["An unanswered prayer","A long illness","A hard relationship","A season of waiting"],
   p:"Write your own 'How long' prayer, then end it the way David did: But I have trusted in thy mercy.",
   a:"Read all of Psalm 13 today and pray it in your own words."},
  {r:"Romans 5:1-2", t:"Therefore being justified by faith, we have peace with God through our Lord Jesus Christ: By whom also we have access by faith into this grace wherein we stand, and rejoice in hope of the glory of God.", th:"Peace with God", c:"Romans 5:1-5",
   m:"Being justified, declared right with God, through faith, we have peace with God. Not just peace from God, but peace with him. The war is over. And we have access, a word for being brought into the presence of a king. You can stand before God unafraid.",
   q:"Do you feel at peace with God right now?", o:["Yes","Mostly","Not really","I'm unsure"],
   p:"What does it mean to you that the war between you and God is over?",
   a:"Come to God today with confidence, knowing you stand in grace."},
  {r:"Luke 6:27-28", t:"But I say unto you which hear, Love your enemies, do good to them which hate you, Bless them that curse you, and pray for them which despitefully use you.", th:"Love your enemies", c:"Luke 6:27-36",
   m:"This might be the hardest thing Jesus ever asked. Love your enemies, do good to those who hate you, bless those who curse you, pray for those who mistreat you. It doesn't mean pretending they didn't hurt you. It means refusing to let hate have the last word in your heart.",
   q:"Who is hardest to pray for?", o:["Someone who hurt me","Someone on the other side politically","Someone who's rude to me","Someone from my past"],
   p:"Write a prayer for someone who has hurt you. It's okay if it's hard.",
   a:"Do something kind today for someone you find difficult."},
  {r:"Genesis 3:9", t:"And the LORD God called unto Adam, and said unto him, Where art thou?", th:"Where art thou?", c:"Genesis 3:1-15",
   m:"After Adam and Eve ate the fruit, they hid. And God came looking. His first words after the first sin weren't a sentence of judgment. They were a question: Where art thou? God knew where they were. He was inviting them out of hiding. He still asks the same question.",
   q:"Where do you tend to hide from God?", o:["Behind busyness","Behind shame","Behind my own efforts","I'm not hiding right now"],
   p:"If God asked you today, 'Where art thou?', how would you honestly answer?",
   a:"Step out of hiding in one small way today. Tell God, or someone you trust, the truth."},
  {r:"Psalm 18:2", t:"The LORD is my rock, and my fortress, and my deliverer; my God, my strength, in whom I will trust; my buckler, and the horn of my salvation, and my high tower.", th:"My rock and fortress", c:"Psalm 18:1-6",
   m:"David piles up images: rock, fortress, deliverer, strength, buckler, horn, high tower. He'd spent years hiding in caves and strongholds while Saul hunted him. He knew what it was to need a hiding place. Every image says the same thing: God is where you can be safe.",
   q:"Which image of God speaks to you today?", o:["Rock","Fortress","Deliverer","High tower"],
   p:"Which picture of God do you need most right now, and why?",
   a:"Pick one image from this verse and picture it every time you feel unsafe today."},
  {r:"Isaiah 30:21", t:"And thine ears shall hear a word behind thee, saying, This is the way, walk ye in it, when ye turn to the right hand, and when ye turn to the left.", th:"This is the way", c:"Isaiah 30:19-21",
   m:"Imagine walking and hearing a voice behind you saying, 'This is the way, walk ye in it,' whenever you're about to turn wrong. God promises guidance like that: not always a map, but a voice at the moment you need it. The question is whether we're listening.",
   q:"How do you usually sense God's direction?", o:["A sense of peace","Scripture","Wise advice","Circumstances"],
   p:"Where do you need to hear 'this is the way'? Write about the crossroads you're at.",
   a:"At each choice today, even small ones, pause and listen for a moment."},
  {r:"Romans 5:3-5", t:"And not only so, but we glory in tribulations also: knowing that tribulation worketh patience; And patience, experience; and experience, hope: And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us.", th:"Hope that doesn't disappoint", c:"Romans 5:1-5",
   m:"Paul traces a chain: trouble produces patience, patience produces experience, or proven character, and character produces hope. And this hope won't let us down, because God's love has been poured into our hearts. Suffering isn't pointless. It's building something that lasts.",
   q:"Which link in the chain are you on right now?", o:["Tribulation","Patience","Character","Hope"],
   p:"How has a past trouble built character or hope in you?",
   a:"Encourage someone in a hard time today by sharing how God grew you through yours."},
  {r:"Job 38:4", t:"Where wast thou when I laid the foundations of the earth? declare, if thou hast understanding.", th:"Where were you?", c:"Job 38:1-11",
   m:"After more than thirty chapters of Job's questions, God finally speaks out of a whirlwind. But he doesn't explain Job's suffering. He asks his own questions: Where were you when I made the world? It isn't a put-down. It's an invitation to trust a God whose wisdom is far bigger than our understanding.",
   q:"What 'why' question do you carry?", o:["Why did this happen?","Why hasn't God answered?","Why do good people suffer?","I don't have one right now"],
   p:"Write your biggest 'why.' Then write what you know about God that's bigger than your question.",
   a:"Spend time in nature today and let its size remind you of God's wisdom."},
  {r:"Matthew 6:6", t:"But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly.", th:"Pray in secret", c:"Matthew 6:5-8",
   m:"Jesus warns against praying to impress people. Instead, go into a private room, shut the door, and pray to your Father who is in secret. Prayer isn't a performance. It's a private conversation with someone who sees what no one else does.",
   q:"Where do you pray most often?", o:["In private","In the car","At church","On the go"],
   p:"What would you say to God if no one else could ever hear?",
   a:"Find a private space today and pray honestly with the door closed."},
  {r:"Psalm 19:14", t:"Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O LORD, my strength, and my redeemer.", th:"Words and meditation", c:"Psalm 19:7-14",
   m:"Psalm 19 begins with the heavens declaring God's glory and ends with this personal prayer. It covers what comes out, the words of my mouth, and what goes on inside, the meditation of my heart. Both matter to God. It's a good prayer to pray before you speak, post, or reply.",
   q:"Which is harder to guard?", o:["My words","My thoughts","Both equally","Depends on the day"],
   p:"What words or thoughts from this past week would you like to bring before God?",
   a:"Pray this verse before your first conversation today."},
  {r:"Genesis 15:5-6", t:"And he brought him forth abroad, and said, Look now toward heaven, and tell the stars, if thou be able to number them: and he said unto him, So shall thy seed be. And he believed in the LORD; and he counted it to him for righteousness.", th:"Count the stars", c:"Genesis 15:1-6",
   m:"Abram was old and childless when God took him outside and told him to count the stars. That many descendants, God said. It made no sense. But Abram believed, and God counted that trust as righteousness. Faith isn't seeing how it will happen. It's believing the One who promised.",
   q:"Which promise of God is hardest to believe?", o:["That he'll provide","That he's good","That he hasn't forgotten me","That he can change things"],
   p:"What would it look like to step outside and count the stars over the thing you're waiting for?",
   a:"Look up at the night sky tonight and trust God with one specific hope."},
  {r:"Romans 8:1", t:"There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit.", th:"No condemnation", c:"Romans 8:1-11",
   m:"Right after Paul describes his own struggle with sin in Romans 7, he declares: there is therefore now no condemnation. Not less condemnation. None. If you're in Christ, God is not holding a case against you. Guilt may whisper. But the verdict has already been given.",
   q:"Where do you still feel condemned?", o:["A past mistake","A current struggle","Other people's judgment","My own judgment"],
   p:"Write down what condemns you. Then write over it: No condemnation.",
   a:"When guilt whispers today, answer it out loud: There is no condemnation."},
  {r:"Isaiah 35:3-4", t:"Strengthen ye the weak hands, and confirm the feeble knees. Say to them that are of a fearful heart, Be strong, fear not: behold, your God will come with vengeance, even God with a recompence; he will come and save you.", th:"Be strong, fear not", c:"Isaiah 35:1-10",
   m:"Isaiah 35 is full of a desert blooming and weak knees made strong. The instruction is to strengthen weak hands and to tell fearful hearts: be strong, fear not, your God will come and save you. It's something to receive and something to pass on. Someone near you needs to hear it today.",
   q:"Who around you has a fearful heart?", o:["A family member","A friend","A coworker","Me"],
   p:"Write the words you'd want someone to say to your fearful heart right now.",
   a:"Say 'Be strong, fear not' to someone who needs courage today."},
  {r:"Matthew 6:9-10", t:"After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name. Thy kingdom come. Thy will be done in earth, as it is in heaven.", th:"Our Father", c:"Matthew 6:9-13",
   m:"Jesus taught his disciples to start prayer with 'Our Father,' a family word. Then come God's name and God's kingdom, before any personal requests. Starting with who God is changes how we see everything else. 'Thy will be done' is the bravest line most people pray.",
   q:"Which line is hardest to pray sincerely?", o:["Our Father","Hallowed be thy name","Thy kingdom come","Thy will be done"],
   p:"What would 'thy kingdom come' look like in your home, work, or neighborhood?",
   a:"Pray the Lord's Prayer slowly today, pausing after each line."},
  {r:"Psalm 23:4", t:"Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.", th:"Through the valley", c:"Psalm 23",
   m:"It says through the valley, not into it to stay. The valley is real, and it's dark. But you walk through it. And something changes in the psalm right here: David stops talking about God and starts talking to him. 'Thou art with me.' In the darkest place, God gets closer.",
   q:"Are you in a valley right now?", o:["Yes, a deep one","Coming out of one","Not right now","Walking with someone who is"],
   p:"Write about a valley you've walked through. How did you know God was with you?",
   a:"Call or text someone who's walking through a valley right now."},
  {r:"Matthew 6:11-12", t:"Give us this day our daily bread. And forgive us our debts, as we forgive our debtors.", th:"Daily bread", c:"Matthew 6:9-15",
   m:"Give us this day our daily bread. Not a year's supply, just today's. Like manna, it teaches daily dependence. Then comes forgiveness, with a condition: as we forgive. Daily bread and daily forgiveness go together. Both are needed fresh every day.",
   q:"Which do you need most today?", o:["Daily bread","Forgiveness","To forgive someone","All of it"],
   p:"What is your daily bread today, the thing you need God to provide? Who do you need to forgive?",
   a:"Thank God for today's bread at every meal, and release one grudge."},
  {r:"Romans 8:15", t:"For ye have not received the spirit of bondage again to fear; but ye have received the Spirit of adoption, whereby we cry, Abba, Father.", th:"Abba, Father", c:"Romans 8:14-17",
   m:"Abba is an Aramaic word for father, close and familiar. It's the word Jesus used in Gethsemane. We haven't received a spirit that makes us slaves to fear again. We've been adopted. And the Spirit inside us teaches us to cry out to God as our own dear Father.",
   q:"How easy is it for you to call God 'Father'?", o:["Easy","Hard because of my earthly father","Unfamiliar","Comforting"],
   p:"What would it feel like to come to God as 'Abba'?",
   a:"Pray today starting with 'Abba, Father.'"},
  {r:"Job 42:5", t:"I have heard of thee by the hearing of the ear: but now mine eye seeth thee.", th:"Now mine eye seeth thee", c:"Job 42:1-6",
   m:"At the end of everything, Job says he used to know about God secondhand, by the hearing of the ear. Now he has seen God for himself. His suffering was never explained, but it led to an encounter. Many people find that their hardest seasons moved their faith from secondhand to personal.",
   q:"Is your faith more secondhand or personal right now?", o:["Mostly secondhand","Becoming personal","Very personal","I'm not sure"],
   p:"Write about the difference between hearing about God and seeing him for yourself in your own life.",
   a:"Ask God today to help you know him personally, not just know about him."},
  {r:"Psalm 23:5-6", t:"Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over. Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the LORD for ever.", th:"My cup runneth over", c:"Psalm 23",
   m:"God prepares a table for David in the presence of his enemies. Not after they're gone. Right in the middle of opposition, God serves a feast. And goodness and mercy don't just wait for David. They follow him, a word that can also mean pursue. God's goodness is chasing you down.",
   q:"Where do you need God's table in the middle of trouble?", o:["At work","In conflict","In my health","In my family"],
   p:"List the ways your cup is running over right now, even in the middle of hard things.",
   a:"Look for one way goodness and mercy are following you today, and name it."},
  {r:"Isaiah 40:8", t:"The grass withereth, the flower fadeth: but the word of our God shall stand for ever.", th:"The word stands forever", c:"Isaiah 40:1-8",
   m:"Grass withers. Flowers fade. Trends, opinions, and even empires come and go. But God's word stands forever. In a world that changes constantly, there's one thing that doesn't. Building your life on it means building on something that will still be there when everything else has faded.",
   q:"What feels most unstable in your life?", o:["My circumstances","My feelings","My relationships","The world"],
   p:"What promise from God's word feels most solid to you right now?",
   a:"Write down one promise of God and put it where you'll see it every day this week."},
  {r:"Genesis 16:13", t:"And she called the name of the LORD that spake unto her, Thou God seest me: for she said, Have I also here looked after him that seeth me?", th:"The God who sees me", c:"Genesis 16:1-13",
   m:"Hagar was a slave, mistreated and alone in the desert, running away. No one in the story treats her kindly except God. He finds her, speaks to her, and she gives him a name: Thou God seest me. She is one of the only people in the Bible to give God a name. If you feel invisible, he sees you.",
   q:"When do you feel most unseen?", o:["At home","At work","At church","In my struggles"],
   p:"Write about a time you felt invisible. What does it mean that God sees you there?",
   a:"See someone today who might feel invisible. Ask how they're really doing."},
  {r:"1 John 4:7-8", t:"Beloved, let us love one another: for love is of God; and every one that loveth is born of God, and knoweth God. He that loveth not knoweth not God; for God is love.", th:"God is love", c:"1 John 4:7-12",
   m:"John doesn't say God has love, or does loving things. He says God is love. Love is his nature. That means every real act of love, a parent's patience, a friend's loyalty, a stranger's kindness, is a small reflection of who God is. Today, remember where love comes from.",
   q:"Who has shown you God's love most clearly?", o:["A parent or family member","A friend","A spouse or partner","A stranger"],
   p:"Write about a time someone loved you in a way that helped you understand God's love.",
   a:"Show love today to someone who might not expect it."},
  {r:"Matthew 6:19-21", t:"Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt, and where thieves break through and steal: But lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt, and where thieves do not break through nor steal: For where your treasure is, there will your heart be also.", th:"Where your treasure is", c:"Matthew 6:19-24",
   m:"Everything we own on earth eventually breaks, rusts, or gets lost. Jesus points to treasure that lasts. Then comes a sharp insight: where your treasure is, your heart will follow. If you want to know what you love most, look at where your time and money go.",
   q:"Where does most of your time and money go?", o:["Necessities","Comfort","People","God's work"],
   p:"Look at how you've spent this week. What does it say about your treasure?",
   a:"Invest in something eternal today: a person, a prayer, or a gift."},
  {r:"Romans 8:26", t:"Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered.", th:"When you can't find the words", c:"Romans 8:26-27",
   m:"Sometimes we don't know what to pray. The pain is too deep or the situation too confusing. Paul says the Spirit helps in our weakness and prays for us with groans too deep for words. When you can't find the words, you're not on your own. The Spirit is praying for you.",
   q:"Do you ever not know what to pray?", o:["Often","Sometimes","Rarely","Right now"],
   p:"Sit quietly for a few minutes. If words don't come, just write: Spirit, pray for me.",
   a:"When you don't know what to pray today, simply sigh and trust the Spirit."},
  {r:"Psalm 25:4-5", t:"Shew me thy ways, O LORD; teach me thy paths. Lead me in thy truth, and teach me: for thou art the God of my salvation; on thee do I wait all the day.", th:"Teach me thy paths", c:"Psalm 25:1-10",
   m:"This is the prayer of someone who wants to learn. Show me, teach me, lead me. It doesn't demand the whole map. It asks to be taught, one lesson at a time. And David waits on God all the day, not just in the morning. Learning God's ways is a lifelong, daily thing.",
   q:"What do you most want God to teach you right now?", o:["Patience","Trust","Direction","How to love"],
   p:"What path are you on right now, and what do you need God to show you about it?",
   a:"Ask God today to teach you one thing, then pay attention to what happens."},
  {r:"Matthew 6:26", t:"Behold the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them. Are ye not much better than they?", th:"Look at the birds", c:"Matthew 6:25-34",
   m:"Jesus tells worried people to look at the birds. They don't plant, harvest, or store food in barns. Yet God feeds them. 'Are ye not much better than they?' Next time worry creeps in, step outside and watch the birds. They're living sermons on trust.",
   q:"What are you worried about providing?", o:["Food or money","A home","My kids' future","My own future"],
   p:"Watch the birds for a few minutes today. Then write about what they teach you about trust.",
   a:"Watch the birds today and say: You care for them, and you care for me."},
  {r:"Isaiah 40:11", t:"He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young.", th:"Carried close", c:"Isaiah 40:9-11",
   m:"The same God who measures the oceans in the hollow of his hand, in the very next verse, gathers lambs in his arms and carries them close to his heart. He gently leads those who are tired and vulnerable. God's power is never far from his tenderness.",
   q:"Do you need to be carried or gently led right now?", o:["Carried","Gently led","Both","Neither, I'm doing okay"],
   p:"Imagine being carried close to God's heart. What would you want to tell him?",
   a:"Be gentle with someone today who's carrying a heavy load."},
  {r:"Romans 12:15", t:"Rejoice with them that do rejoice, and weep with them that weep.", th:"Rejoice and weep together", c:"Romans 12:9-16",
   m:"Two simple commands: celebrate with people who are celebrating, cry with people who are crying. The first can be hard if we're envious. The second can be hard if we're uncomfortable with pain. Both are about showing up for people where they actually are.",
   q:"Which is harder for you?", o:["Rejoicing with others","Weeping with others","Both","Neither"],
   p:"Who in your life is rejoicing? Who is weeping? How can you be present for each?",
   a:"Celebrate with one person and comfort another today."},
  {r:"Psalm 27:4", t:"One thing have I desired of the LORD, that will I seek after; that I may dwell in the house of the LORD all the days of my life, to behold the beauty of the LORD, and to enquire in his temple.", th:"One thing", c:"Psalm 27:1-6",
   m:"David had armies, enemies, and a kingdom to run. But he says there's one thing he desires most: to be in God's presence and see his beauty. Our lives are full of many things. This verse asks what your one thing is. When everything else is stripped away, what do you want most?",
   q:"What would you say is your one thing right now?", o:["Peace","Success","Being with God","Being loved"],
   p:"If you could ask God for only one thing, what would it be? Why?",
   a:"Spend a few minutes today simply enjoying God's beauty in creation, music, or Scripture."},
  {r:"Genesis 18:14", t:"Is any thing too hard for the LORD? At the time appointed I will return unto thee, according to the time of life, and Sarah shall have a son.", th:"Is any thing too hard?", c:"Genesis 18:1-15",
   m:"Sarah laughed when she heard she'd have a son in her old age. Honestly, who wouldn't? God's answer was a question: Is any thing too hard for the LORD? A year later she held Isaac, whose name means 'laughter.' God turned her doubting laugh into a joyful one.",
   q:"What feels too hard for God right now?", o:["A health problem","A broken relationship","A money situation","Changing my heart"],
   p:"What impossible thing are you facing? Write God's question at the top: Is any thing too hard for the LORD?",
   a:"Pray boldly today for something you'd stopped asking for."},
  {r:"Proverbs 3:27", t:"Withhold not good from them to whom it is due, when it is in the power of thine hand to do it.", th:"Withhold not good", c:"Proverbs 3:27-35",
   m:"If you have the power to do good for someone who needs it, do it. Don't put it off. This proverb is simple, practical, and convicting. Many good intentions never become good actions because we wait for a better time. The best time is usually now.",
   q:"What good have you been putting off?", o:["A kind word","Helping someone","Giving","Reaching out"],
   p:"Who comes to mind when you read this verse? What good is in your power to do for them?",
   a:"Do the good thing you've been putting off, today."},
  {r:"Matthew 7:1-2", t:"Judge not, that ye be not judged. For with what judgment ye judge, ye shall be judged: and with what measure ye mete, it shall be measured to you again.", th:"Judge not", c:"Matthew 7:1-5",
   m:"Jesus warns that the standard we use to judge others will be used on us. Then he makes it vivid: don't worry about the speck in someone's eye while there's a beam in your own. It's not that we can't recognize wrong. It's that we should start with our own hearts.",
   q:"Who do you find yourself judging most?", o:["Family","Strangers","People online","Myself"],
   p:"What beam might be in your own eye? Write honestly.",
   a:"Catch yourself judging someone today, and pray for them instead."},
  {r:"Romans 12:21", t:"Be not overcome of evil, but overcome evil with good.", th:"Overcome evil with good", c:"Romans 12:17-21",
   m:"When someone wrongs you, the instinct is to get even. Paul says don't let evil win by turning you into what hurt you. Overcome it with good instead. Kindness toward an enemy isn't weakness. It's a way of refusing to let evil have the last word.",
   q:"Where are you tempted to repay evil with evil?", o:["With a family member","At work","Online","In my thoughts"],
   p:"Who has wronged you? What would overcoming that with good look like?",
   a:"Do something good today for someone who has hurt you."},
  {r:"Psalm 27:13-14", t:"I had fainted, unless I had believed to see the goodness of the LORD in the land of the living. Wait on the LORD: be of good courage, and he shall strengthen thine heart: wait, I say, on the LORD.", th:"Wait on the Lord", c:"Psalm 27:7-14",
   m:"David admits he would have fainted unless he believed he'd see God's goodness in the land of the living, meaning here, in this life, not only someday. Then he coaches himself and us: wait, be strong, take heart, wait. Waiting isn't passive. It takes courage.",
   q:"Where are you hoping to see God's goodness?", o:["My health","My family","My future","My faith"],
   p:"Where do you need courage to keep waiting? What would 'be of good courage' look like this week?",
   a:"Write 'Wait on the LORD' somewhere you'll see it often today."},
  {r:"Isaiah 40:28-29", t:"Hast thou not known? hast thou not heard, that the everlasting God, the LORD, the Creator of the ends of the earth, fainteth not, neither is weary? there is no searching of his understanding. He giveth power to the faint; and to them that have no might he increaseth strength.", th:"Power to the faint", c:"Isaiah 40:27-31",
   m:"God never gets tired. And he gives strength to people who do. To those with no might, he increases strength. This comes right before the famous promise about wings like eagles. God doesn't just admire strength. He gives it, especially to those who have run out.",
   q:"How much strength do you have today?", o:["Plenty","Some","Running low","None"],
   p:"Where are you faint? Ask God for strength in that specific place.",
   a:"When you feel weak today, pray: You give power to the faint."},
  {r:"Matthew 7:12", t:"Therefore all things whatsoever ye would that men should do to you, do ye even so to them: for this is the law and the prophets.", th:"The golden rule", c:"Matthew 7:7-12",
   m:"Treat others the way you want to be treated. Jesus says this sums up the law and the prophets. It's simple to say and hard to do. It asks you to put yourself in someone else's place before you act. Most of us know exactly how we'd want to be treated.",
   q:"How would you most like to be treated right now?", o:["With patience","With kindness","With understanding","With respect"],
   p:"Think of someone you'll see today. How would you want to be treated in their position?",
   a:"Treat one person today exactly the way you'd want to be treated."},
  {r:"2 Peter 3:8", t:"But, beloved, be not ignorant of this one thing, that one day is with the Lord as a thousand years, and a thousand years as one day.", th:"One day", c:"2 Peter 3:8-15",
   m:"Peter reminds us that God sees time differently. A thousand years are like a day to him, and a single day like a thousand years. That's why he's patient when we're in a hurry. It also means no single day is small to him, including this one. Today matters.",
   q:"How do you usually think about your time?", o:["There's never enough","I waste too much of it","I'm learning to slow down","I see it as a gift"],
   p:"If one day can be like a thousand years to God, what could today hold? What do you want today to be for?",
   a:"Treat today as a gift. Do one thing with it you'd normally say you don't have time for."},
  {r:"Genesis 22:14", t:"And Abraham called the name of that place Jehovah-jireh: as it is said to this day, In the mount of the LORD it shall be seen.", th:"The Lord will provide", c:"Genesis 22:1-14",
   m:"Abraham was asked to give up what he loved most. On the mountain, God provided a ram instead. Abraham named the place Jehovah-jireh, 'the LORD will provide,' or 'the LORD will see to it.' Provision often comes on the mountain, at the last moment, after we've trusted him with what we hold dear.",
   q:"Where do you need God to provide?", o:["Money","Strength","Direction","A way through"],
   p:"Write about a time God provided at just the right moment. What did you learn?",
   a:"Thank God today for three ways he has provided in the past."},
  {r:"Psalm 28:7", t:"The LORD is my strength and my shield; my heart trusted in him, and I am helped: therefore my heart greatly rejoiceth; and with my song will I praise him.", th:"Trusted, and helped", c:"Psalm 28",
   m:"The order is worth noticing: David trusted, then he was helped, then his heart rejoiced, then he sang. Trust comes before help, and joy comes after. If you're at the trusting stage right now, without the help yet, the psalm says the song is coming.",
   q:"Which stage are you in?", o:["Trusting, waiting for help","Recently helped","Rejoicing","Struggling to trust"],
   p:"Write about a time you trusted God, he helped you, and your heart rejoiced. What do you remember?",
   a:"Sing along to a worship song today, even if it's just under your breath."},
  {r:"1 Corinthians 10:13", t:"There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.", th:"A way to escape", c:"1 Corinthians 10:12-13",
   m:"Your temptations aren't unique. Others have faced them too. And God is faithful. He won't let you be tempted beyond what you can bear, and with every temptation he provides a way out. The way out is often simple: leave, call someone, pray, or change what you're doing.",
   q:"Where do you face temptation most often?", o:["My thoughts","My words","Habits","Relationships"],
   p:"What temptation do you face? What way of escape has God already provided?",
   a:"Plan your way of escape ahead of time for one temptation you'll face today."},
  {r:"Matthew 7:24-25", t:"Therefore whosoever heareth these sayings of mine, and doeth them, I will liken him unto a wise man, which built his house upon a rock: And the rain descended, and the floods came, and the winds blew, and beat upon that house; and it fell not: for it was founded upon a rock.", th:"Built on the rock", c:"Matthew 7:24-29",
   m:"Both builders faced the same storm. The difference wasn't the weather. It was the foundation. The wise man heard Jesus's words and did them. Hearing isn't enough. Faith is built on doing what Jesus says, so that when the storms come, and they will, your house stands.",
   q:"How strong is your foundation right now?", o:["Solid","Mostly solid","Shaky","I'm rebuilding"],
   p:"What has Jesus said that you've heard but haven't put into practice?",
   a:"Put one teaching of Jesus into action today."},
  {r:"Proverbs 4:18", t:"But the path of the just is as the shining light, that shineth more and more unto the perfect day.", th:"Brighter and brighter", c:"Proverbs 4:10-19",
   m:"The path of the righteous is like the light of dawn, shining brighter and brighter until full day. Growth with God is usually gradual, like a sunrise. You may not see the difference minute by minute. But looking back, it's lighter than it was. Keep walking. The day is coming.",
   q:"How would you describe your path right now?", o:["Early dawn","Getting brighter","Full daylight","Clouded over"],
   p:"Compare your faith now to a year ago. Where has it gotten brighter?",
   a:"Notice how the light changes today, from morning to evening, and thank God for growth."},
  {r:"Isaiah 42:3", t:"A bruised reed shall he not break, and the smoking flax shall he not quench: he shall bring forth judgment unto truth.", th:"A flickering wick", c:"Isaiah 42:1-9",
   m:"A bruised reed was useless to most people, easily snapped and thrown away. Smoking flax was a lamp wick about to go out. The servant God sends won't break the bruised or snuff out the flickering. Matthew says this servant is Jesus. If your faith is barely burning, he won't put it out. He'll tend it.",
   q:"How bright is your faith today?", o:["Burning brightly","Steady","Flickering","Barely smoking"],
   p:"Where do you feel bruised or flickering right now? How does this verse speak to you?",
   a:"Light a candle today and thank Jesus that he tends weak flames."},
  {r:"Psalm 31:15", t:"My times are in thy hand: deliver me from the hand of mine enemies, and from them that persecute me.", th:"My times are in thy hand", c:"Psalm 31:9-16",
   m:"David wrote this surrounded by enemies and whispers. His answer wasn't to grab control. It was to remember that his times, his whole life story, were in God's hands. Your schedule, your future, the timing of your answers: they're held by someone who loves you.",
   q:"What timing are you anxious about?", o:["A relationship","A career step","An answer to prayer","My health"],
   p:"What would you let go of if you believed your times are truly in God's hand?",
   a:"When you check the time today, pray: My times are in thy hand."},
  {r:"1 Corinthians 15:58", t:"Therefore, my beloved brethren, be ye stedfast, unmoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.", th:"Not in vain", c:"1 Corinthians 15:50-58",
   m:"After his great chapter on the resurrection, Paul draws a practical conclusion: be steadfast, unmovable, always abounding in the Lord's work. Why? Because your labor is not in vain. Since death isn't the end, nothing done for God is wasted, even when it feels unseen.",
   q:"Where do you feel your work is in vain?", o:["At home","At work","In serving","In prayer"],
   p:"What work do you do that feels unnoticed? How does this verse change how you see it?",
   a:"Keep doing one faithful thing today that no one may notice."},
  {r:"Matthew 8:2-3", t:"And, behold, there came a leper and worshipped him, saying, Lord, if thou wilt, thou canst make me clean. And Jesus put forth his hand, and touched him, saying, I will; be thou clean. And immediately his leprosy was cleansed.", th:"I will; be thou clean", c:"Matthew 8:1-4",
   m:"Lepers were outcasts, forbidden to touch anyone. This man came to Jesus with a humble question: if you're willing, you can make me clean. Jesus did the unthinkable. He reached out and touched him, then healed him. 'I will.' Jesus is not reluctant to reach the untouchable.",
   q:"Where do you feel untouchable?", o:["My shame","My illness","My past","My loneliness"],
   p:"Write your own version of the leper's prayer: 'Lord, if thou wilt, thou canst...'",
   a:"Reach out today to someone who feels like an outcast."},
  {r:"Genesis 28:15", t:"And, behold, I am with thee, and will keep thee in all places whither thou goest, and will bring thee again into this land; for I will not leave thee, until I have done that which I have spoken to thee of.", th:"I will not leave thee", c:"Genesis 28:10-17",
   m:"Jacob was running for his life after deceiving his brother and father. He slept on the ground with a stone for a pillow. That's where God met him, not when Jacob had his life together, but when he was alone and on the run. God promised to be with him everywhere and to finish what he started.",
   q:"Where are you in your own journey?", o:["Running from something","Starting over","Far from home","Settled"],
   p:"Have you had a stone-pillow moment, where God met you at your lowest? Write about it.",
   a:"Wherever you go today, pause at each new place and say: You are with me here."},
  {r:"Psalm 32:8", t:"I will instruct thee and teach thee in the way which thou shalt go: I will guide thee with mine eye.", th:"Guided by his eye", c:"Psalm 32",
   m:"God promises to instruct, teach, and guide. 'Guide thee with mine eye' suggests the closeness of someone who can direct you with just a look, like a parent across a room. That kind of guidance requires staying close enough to see God's face. The next verse warns against being like a stubborn mule.",
   q:"How do you usually sense God's guidance?", o:["Through Scripture","Through people","Through peace or unrest","I struggle to sense it"],
   p:"Where do you need guidance right now? What would it look like to stay close enough to catch his eye?",
   a:"Before a decision today, pause and ask God to guide you, then wait a moment before acting."},
  {r:"2 Corinthians 1:3-4", t:"Blessed be God, even the Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort; Who comforteth us in all our tribulation, that we may be able to comfort them which are in any trouble, by the comfort wherewith we ourselves are comforted of God.", th:"The God of all comfort", c:"2 Corinthians 1:3-7",
   m:"God comforts us in all our troubles, so that we can comfort others with the same comfort. Your pain isn't wasted. The comfort you've received becomes something you can give. Some of the best comforters are people who've been through the same thing.",
   q:"What comfort have you received that you could pass on?", o:["Through grief","Through illness","Through failure","Through loneliness"],
   p:"Who could benefit from the comfort God has given you?",
   a:"Reach out to someone going through something you've been through."},
  {r:"Matthew 9:36", t:"But when he saw the multitudes, he was moved with compassion on them, because they fainted, and were scattered abroad, as sheep having no shepherd.", th:"Moved with compassion", c:"Matthew 9:35-38",
   m:"Jesus looked at the crowds and was moved with compassion. The Greek word comes from the word for the gut, a deep, physical feeling. He saw people as tired and scattered, sheep with no shepherd. That's how he sees the world, and how he sees you on your weary days.",
   q:"Do you feel more scattered or shepherded right now?", o:["Scattered","Shepherded","Somewhere in between","Exhausted"],
   p:"How does it feel to know Jesus looks at you with compassion, not frustration?",
   a:"Look at the crowd around you today, at work, in a store, online, and pray for them with compassion."},
  {r:"Isaiah 43:25", t:"I, even I, am he that blotteth out thy transgressions for mine own sake, and will not remember thy sins.", th:"Blotted out", c:"Isaiah 43:22-25",
   m:"God says he blots out transgressions for his own sake, not because we earned it. And he will not remember our sins. God doesn't forget the way we forget. He chooses not to hold them against us. He won't bring them up again.",
   q:"Do you keep remembering a sin God has chosen to forget?", o:["Something recent","Something long ago","A repeated failure","I'm not sure"],
   p:"If God won't remember your sins, what would it look like to stop rehearsing them yourself?",
   a:"When an old guilt comes up today, say: God has blotted that out."},
  {r:"Psalm 34:4-5", t:"I sought the LORD, and he heard me, and delivered me from all my fears. They looked unto him, and were lightened: and their faces were not ashamed.", th:"Radiant", c:"Psalm 34:1-10",
   m:"David wrote this after escaping danger by pretending to be insane, not his proudest moment. Yet he says God delivered him from all his fears. Those who look to God are 'lightened,' radiant, and not ashamed. Looking to God changes your face, and it changes how you carry yourself.",
   q:"What fear would you like to be delivered from?", o:["Fear of failure","Fear of loss","Fear of people","Fear of the unknown"],
   p:"Name your fears honestly. Then write: I sought the LORD, and he heard me.",
   a:"Each time a fear shows up today, look up, literally, and pray."},
  {r:"Proverbs 4:23", t:"Keep thy heart with all diligence; for out of it are the issues of life.", th:"Keep thy heart", c:"Proverbs 4:20-27",
   m:"In Hebrew thinking, the heart is the center of everything: thoughts, emotions, choices. The issues of life flow out of it, like water from a spring. Guarding your heart means paying attention to what goes in, because sooner or later it comes out in how you live.",
   q:"What do you most need to guard your heart from?", o:["Bitterness","Fear","Comparison","Temptation"],
   p:"What's been flowing into your heart lately, through screens, conversations, and thoughts? What's flowing out?",
   a:"Guard one input today. Skip something that tends to make your heart heavier."},
  {r:"Matthew 10:29-31", t:"Are not two sparrows sold for a farthing? and one of them shall not fall on the ground without your Father. But the very hairs of your head are all numbered. Fear ye not therefore, ye are of more value than many sparrows.", th:"More than sparrows", c:"Matthew 10:26-31",
   m:"Sparrows were among the cheapest things in the market, two for a farthing. Yet not one falls without God knowing. And he's numbered the hairs on your head, a detail no one else would bother to know. If God pays attention to sparrows, he certainly pays attention to you.",
   q:"When do you feel least valuable?", o:["When I fail","When I'm ignored","When I compare myself","Rarely"],
   p:"What does it mean that God knows the number of hairs on your head? What else does he know about you?",
   a:"Notice a small bird today and remind yourself that you're worth more to God than many sparrows."},
  {r:"2 Corinthians 4:7", t:"But we have this treasure in earthen vessels, that the excellency of the power may be of God, and not of us.", th:"Treasure in clay jars", c:"2 Corinthians 4:6-10",
   m:"Clay jars were ordinary and fragile, used for everyday storage. Paul says we carry the treasure of God's light in jars like that. The point isn't that we're worthless. It's that when cracked pots shine with God's glory, everyone can see the power is his, not ours.",
   q:"How do you feel about your cracks?", o:["Ashamed","Accepting","Grateful","Trying to hide them"],
   p:"Where has God's light shone through your weakness or brokenness?",
   a:"Let someone see a weakness of yours today, and let God's strength show through it."},
  {r:"Genesis 28:16", t:"And Jacob awaked out of his sleep, and he said, Surely the LORD is in this place; and I knew it not.", th:"And I knew it not", c:"Genesis 28:16-22",
   m:"Jacob woke from his dream and said, 'Surely the LORD is in this place; and I knew it not.' He'd been in God's presence all night without realizing it. Most of us miss God not because he's absent, but because we aren't paying attention. Today might be full of him.",
   q:"Where are you most likely to miss God's presence?", o:["In routine","In stress","In people","In silence"],
   p:"Looking back on yesterday, where was God present that you didn't notice at the time?",
   a:"Set three reminders today. When each goes off, say: Surely the LORD is in this place."},
  {r:"Psalm 34:8", t:"O taste and see that the LORD is good: blessed is the man that trusteth in him.", th:"Taste and see", c:"Psalm 34:8-14",
   m:"You can describe a meal all day, but you won't know if it's good until you taste it. David invites us to experience God, not just learn about him. Faith isn't only a set of beliefs. It's tasting, testing, and finding out for yourself that God is good.",
   q:"How have you tasted God's goodness lately?", o:["Through answered prayer","In creation","Through people","I'm hungry for it"],
   p:"Write about a time you experienced God's goodness firsthand, not just heard about it.",
   a:"Enjoy a meal slowly today and thank God for his goodness with each bite."},
  {r:"Isaiah 46:4", t:"And even to your old age I am he; and even to hoar hairs will I carry you: I have made, and I will bear; even I will carry, and will deliver you.", th:"Carried to old age", c:"Isaiah 46:3-4",
   m:"God carried his people from birth, and he promises to carry them to old age and gray hair. 'I have made, and I will bear.' Whatever stage of life you're in, from childhood to the last years, God is the one who carries you. He doesn't put you down when you get older.",
   q:"What stage of life are you in?", o:["Young","Middle","Older","Caring for someone older"],
   p:"How has God carried you through different stages of your life?",
   a:"Spend time with an older person today, or call one."},
  {r:"Matthew 13:44", t:"Again, the kingdom of heaven is like unto treasure hid in a field; the which when a man hath found, he hideth, and for joy thereof goeth and selleth all that he hath, and buyeth that field.", th:"Treasure in a field", c:"Matthew 13:44-46",
   m:"A man found treasure in a field and, full of joy, sold everything to buy that field. Notice the motivation: joy, not duty. He wasn't giving things up. He was getting something better. Following Jesus can feel like sacrifice until you realize what you've found.",
   q:"How does following Jesus feel to you right now?", o:["Like treasure","Like sacrifice","Both","I'm still searching"],
   p:"What have you let go of to follow Jesus? Was it worth it? Write honestly.",
   a:"Thank God today for the joy of knowing him."},
  {r:"2 Corinthians 4:16-18", t:"For which cause we faint not; but though our outward man perish, yet the inward man is renewed day by day. For our light affliction, which is but for a moment, worketh for us a far more exceeding and eternal weight of glory; While we look not at the things which are seen, but at the things which are not seen: for the things which are seen are temporal; but the things which are not seen are eternal.", th:"Renewed day by day", c:"2 Corinthians 4:16-18",
   m:"Our bodies are wearing out. That's just true. But Paul says the inward person is renewed day by day. And our troubles, which feel heavy, are light and for a moment compared to the weight of glory to come. The key is where we look: not at what's seen, but at what's unseen.",
   q:"What are you focusing on most these days?", o:["What I can see","What's ahead","My problems","God's promises"],
   p:"What feels heavy right now? How does it look when weighed against eternity?",
   a:"Spend a few minutes today thinking about eternity instead of your to-do list."},
  {r:"Psalm 36:7-9", t:"How excellent is thy lovingkindness, O God! therefore the children of men put their trust under the shadow of thy wings. They shall be abundantly satisfied with the fatness of thy house; and thou shalt make them drink of the river of thy pleasures. For with thee is the fountain of life: in thy light shall we see light.", th:"In thy light", c:"Psalm 36:5-10",
   m:"This psalm is full of abundance: wings to shelter under, a feast in God's house, a river of delights, a fountain of life. The last line is beautiful: in thy light shall we see light. God doesn't just give light. He is the light that helps us see everything else clearly.",
   q:"What do you need to see more clearly?", o:["Myself","A situation","Other people","God"],
   p:"What looks different when you see it in God's light? Write about one thing.",
   a:"Sit in the sunlight for a few minutes today and pray: In your light, I see light."},
  {r:"Matthew 14:29-31", t:"And he said, Come. And when Peter was come down out of the ship, he walked on the water, to go to Jesus. But when he saw the wind boisterous, he was afraid; and beginning to sink, he cried, saying, Lord, save me. And immediately Jesus stretched forth his hand, and caught him, and said unto him, O thou of little faith, wherefore didst thou doubt?", th:"Lord, save me", c:"Matthew 14:22-33",
   m:"Peter actually walked on water, as long as he kept his eyes on Jesus. When he looked at the wind, he started to sink. His prayer was three words: Lord, save me. And immediately Jesus caught him. Even sinking Peter was closer to Jesus than the disciples still sitting in the boat.",
   q:"What wind pulls your eyes off Jesus?", o:["Circumstances","Fear","Other people's opinions","Doubt"],
   p:"Where are you sinking? Write Peter's prayer and what you need Jesus to catch you from.",
   a:"Pray 'Lord, save me' the moment you feel overwhelmed today."},
  {r:"Genesis 32:26", t:"And he said, Let me go, for the day breaketh. And he said, I will not let thee go, except thou bless me.", th:"I will not let thee go", c:"Genesis 32:22-30",
   m:"Jacob wrestled all night with a mysterious man, and came to understand he had wrestled with God. Even injured, Jacob held on: I will not let thee go, except thou bless me. He walked away limping, with a new name. Sometimes faith looks like wrestling with God, refusing to let go until he meets you.",
   q:"What are you wrestling with God about?", o:["A prayer that hasn't been answered","A loss","My calling","My doubts"],
   p:"What would it look like to hold on to God, even while you wrestle?",
   a:"Bring your struggle to God honestly today. Don't let go until you've told him everything."},
  {r:"2 Corinthians 5:7", t:"For we walk by faith, not by sight.", th:"By faith, not by sight", c:"2 Corinthians 5:1-10",
   m:"Walking by sight means moving only when you can see the whole path. Walking by faith means trusting God with the next step, even when you can't see where it leads. Most of life with God is lived this way, one step at a time, in partial light.",
   q:"Where are you walking by sight instead of faith?", o:["My finances","My future","My relationships","My health"],
   p:"What step is God asking you to take even though you can't see the outcome?",
   a:"Take one step of faith today without needing to see the whole path."},
  {r:"Proverbs 9:10", t:"The fear of the LORD is the beginning of wisdom: and the knowledge of the holy is understanding.", th:"The beginning of wisdom", c:"Proverbs 9:7-12",
   m:"'The fear of the LORD' doesn't mean being afraid of God the way you'd fear a bully. It means awe, reverence, taking God seriously. That's where wisdom begins. When God is in his proper place in your life, everything else starts to find its place too.",
   q:"What does 'the fear of the Lord' mean to you?", o:["Awe","Respect","Trembling","I'm not sure"],
   p:"Where in your life do you need to take God more seriously? What would change?",
   a:"Before a decision today, ask: What would honor God here?"},
  {r:"Isaiah 49:15-16", t:"Can a woman forget her sucking child, that she should not have compassion on the son of her womb? yea, they may forget, yet will I not forget thee. Behold, I have graven thee upon the palms of my hands; thy walls are continually before me.", th:"Written on his hands", c:"Isaiah 49:13-16",
   m:"Can a mother forget her nursing baby? It's almost unthinkable. Yet God says even if she could, he will never forget you. Then the picture: your name engraved on his palms, a permanent mark. You are never out of God's sight or out of his hands.",
   q:"When do you feel most forgotten?", o:["When prayers go unanswered","When I'm alone","When others move on","Rarely"],
   p:"Imagine your name written on God's hands. What does that tell you about how he sees you?",
   a:"Look at your own palms today and remember that you're written on his."},
  {r:"Psalm 37:23-24", t:"The steps of a good man are ordered by the LORD: and he delighteth in his way. Though he fall, he shall not be utterly cast down: for the LORD upholdeth him with his hand.", th:"Though he fall", c:"Psalm 37:23-31",
   m:"This verse doesn't promise you won't fall. It promises that when you do, you won't be utterly cast down, because God holds your hand. A child learning to walk falls constantly, but a parent holding their hand keeps them from crashing. Your steps are ordered, and your stumbles are caught.",
   q:"Where have you stumbled recently?", o:["My words","My habits","My relationships","My faith"],
   p:"Write about a recent fall. How might God be holding your hand through it?",
   a:"If you stumble today, say: He upholds me with his hand, and keep going."},
  {r:"Matthew 18:12", t:"How think ye? if a man have an hundred sheep, and one of them be gone astray, doth he not leave the ninety and nine, and goeth into the mountains, and seeketh that which is gone astray?", th:"The one that strayed", c:"Matthew 18:10-14",
   m:"A shepherd with a hundred sheep leaves ninety-nine to look for one that wandered. By normal math, it makes no sense. By love's math, it makes perfect sense. Jesus says this is how God feels about every person: no one is expendable, and no one is too far to be found.",
   q:"Do you relate more to the one or the ninety-nine?", o:["The one who wandered","The ninety-nine","I've been both","The shepherd looking for someone"],
   p:"Who is the one in your life who has wandered? Pray for them here.",
   a:"Reach out to someone who has drifted away."},
  {r:"John 11:25-26", t:"Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whosoever liveth and believeth in me shall never die. Believest thou this?", th:"The resurrection and the life", c:"John 11:17-44",
   m:"Jesus said this to Martha, four days after her brother died. She was grieving and wished he had come sooner. He didn't give her a lecture. He gave her a promise, and then a question: Believest thou this? Then he wept with her family, and called Lazarus out of the tomb.",
   q:"How would you answer Jesus's question today?", o:["Yes, I believe","I want to","I'm struggling to","I don't know"],
   p:"Is there a loss or a 'too late' in your life? Write about it, and how Jesus's promise speaks to it.",
   a:"Pray by name for someone who is grieving today."},
  {r:"John 12:24", t:"Verily, verily, I say unto you, Except a corn of wheat fall into the ground and die, it abideth alone: but if it die, it bringeth forth much fruit.", th:"A grain of wheat", c:"John 12:20-33",
   m:"Jesus said this days before the cross. A seed kept on the shelf stays alone. Only when it's buried does it become a harvest. He was talking about his own death, and about ours too: letting go of the things we cling to. What feels like an ending in God's hands is often the beginning of fruit.",
   q:"What might God be asking you to let go of?", o:["A plan","A relationship","Control","My comfort"],
   p:"Write about something that had to die in your life before something better could grow.",
   a:"Plant a seed, or simply hold one, and pray about what you need to surrender."},
  {r:"Matthew 26:39", t:"And he went a little further, and fell on his face, and prayed, saying, O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou wilt.", th:"Not as I will", c:"Matthew 26:36-46",
   m:"In the garden of Gethsemane, Jesus was in such anguish that he fell on his face. He asked honestly for another way. Then he surrendered: nevertheless not as I will, but as thou wilt. Jesus shows us that it's okay to tell God what you want. Surrender doesn't mean pretending. It means trusting him with the answer.",
   q:"How easy is it for you to pray 'thy will be done'?", o:["Easy","Hard","Depends on the situation","I'm learning"],
   p:"What are you asking God for right now? Write it honestly. Then write: Nevertheless, not as I will, but as thou wilt.",
   a:"Bring your biggest request to God today, then hand the outcome to him."},
  {r:"Luke 22:61-62", t:"And the Lord turned, and looked upon Peter. And Peter remembered the word of the Lord, how he had said unto him, Before the cock crow, thou shalt deny me thrice. And Peter went out, and wept bitterly.", th:"The Lord turned and looked", c:"Luke 22:54-62",
   m:"Peter had sworn he'd never deny Jesus. Then he did, three times. As the rooster crowed, Jesus turned and looked at him. It wasn't the look of someone surprised. It was the look of someone who had known all along and loved him anyway. Peter wept bitterly, but his story didn't end there.",
   q:"How do you think Jesus looks at you after you fail?", o:["With disappointment","With anger","With love","I'm not sure"],
   p:"Think of a time you let God down. How do you imagine Jesus looking at you in that moment?",
   a:"If you owe someone an apology, take the first step today."},
  {r:"Isaiah 53:5", t:"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.", th:"By his stripes", c:"Isaiah 53:1-12",
   m:"Written centuries before the cross, Isaiah 53 describes a servant who suffers for others. Wounded for our transgressions. The peace we couldn't make, he made by taking what we deserved. 'With his stripes we are healed' reaches past the body to the deep wounds of guilt and shame.",
   q:"What do you most need healed?", o:["Guilt","Shame","A broken relationship","A wound someone gave me"],
   p:"Write about what it means to you that Jesus carried your wounds. What would you like to hand him today?",
   a:"Read Isaiah 53 slowly today, and pause at every 'our' and 'us.'"},
  {r:"Isaiah 53:6", t:"All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all.", th:"All we like sheep", c:"Isaiah 53:4-9",
   m:"The verse begins and ends with the word all. All of us have wandered, each to our own way. And the Lord laid on him the iniquity of us all. Nobody is left out of the problem, and nobody is left out of the rescue. Sheep don't find their own way home. The shepherd carries them.",
   q:"Where have you wandered lately?", o:["My priorities","My thoughts","My relationships","My time with God"],
   p:"What does 'turned every one to his own way' look like in your life? What would turning back look like?",
   a:"Tell God one specific way you've gone your own way, and thank him for carrying it."},
  {r:"Luke 23:34", t:"Then said Jesus, Father, forgive them; for they know not what they do. And they parted his raiment, and cast lots.", th:"Father, forgive them", c:"Luke 23:26-38",
   m:"Jesus prayed this while being crucified, about the very people doing it. Not after they apologized. Not once the pain stopped. In the worst moment imaginable, he prayed for their forgiveness. If he can forgive this, nothing in your life is beyond his forgiveness, and no one is beyond yours.",
   q:"How hard is it to forgive someone right now?", o:["Very hard","Somewhat hard","I've already forgiven","I need to forgive myself"],
   p:"Who comes to mind when you read 'Father, forgive them'? Write a prayer for them, even if it's a hard one.",
   a:"Pray Jesus's words for someone who has hurt you: Father, forgive them."},
  {r:"Luke 23:42-43", t:"And he said unto Jesus, Lord, remember me when thou comest into thy kingdom. And Jesus said unto him, Verily I say unto thee, To day shalt thou be with me in paradise.", th:"Remember me", c:"Luke 23:39-43",
   m:"A criminal dying next to Jesus had nothing to offer. No good works, no time left to change. All he could say was 'remember me.' Jesus answered with a promise: today, with me, in paradise. It's never too late, and you're never too far gone, to turn to Jesus.",
   q:"What does this exchange stir in you?", o:["Hope for myself","Hope for someone I love","Wonder at grace","Questions"],
   p:"Is there someone you think is too far gone? Or do you sometimes feel that way about yourself? Write about it.",
   a:"Pray today for someone you've almost given up on."},
  {r:"John 19:30", t:"When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and gave up the ghost.", th:"It is finished", c:"John 19:25-30",
   m:"'It is finished' is one word in Greek, tetelestai. In everyday business the same word could mark a debt as paid. Jesus didn't say 'I am finished,' as in defeated. He said the work is finished, completed. There's nothing left to pay. You don't have to finish what he already completed.",
   q:"What are you still trying to pay for?", o:["A past mistake","Not being good enough","Disappointing someone","Nothing, I'm resting in it"],
   p:"What would it feel like to believe your debt is paid in full? Write about what you'd stop carrying.",
   a:"Write 'Paid in full' over something you've been carrying guilt about, then throw the paper away."},
  {r:"Romans 5:8", t:"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.", th:"While we were yet sinners", c:"Romans 5:6-11",
   m:"God didn't wait for us to clean up before he loved us. Christ died for us while we were still sinners, still wrong, still far off. That's how God commends his love, how he proves it. His love isn't a reward for getting better. It's what makes getting better possible.",
   q:"Do you ever feel you have to earn God's love?", o:["Often","Sometimes","Rarely","I used to"],
   p:"How does it change things to know God loved you at your worst, not your best?",
   a:"Show kindness today to someone who hasn't earned it."},
  {r:"Matthew 28:5-6", t:"And the angel answered and said unto the women, Fear not ye: for I know that ye seek Jesus, which was crucified. He is not here: for he is risen, as he said. Come, see the place where the Lord lay.", th:"He is risen", c:"Matthew 28:1-10",
   m:"The women came to the tomb expecting to anoint a dead body. Instead, an angel told them not to be afraid: he is not here, for he is risen. Come, see the place. Easter isn't only a nice idea. It's an empty tomb you're invited to come and see. Death doesn't have the last word.",
   q:"What does the resurrection mean to you today?", o:["Hope","Forgiveness","Victory over death","New life"],
   p:"Where in your life do you need to hear 'he is not here: for he is risen'? What tomb needs to be emptied?",
   a:"Tell someone today, in your own words, why the resurrection matters to you."},
  {r:"John 20:15-16", t:"Jesus saith unto her, Woman, why weepest thou? whom seekest thou? She, supposing him to be the gardener, saith unto him, Sir, if thou have borne him hence, tell me where thou hast laid him, and I will take him away. Jesus saith unto her, Mary. She turned herself, and saith unto him, Rabboni; which is to say, Master.", th:"Mary", c:"John 20:11-18",
   m:"Mary Magdalene was weeping so hard she didn't recognize Jesus. She thought he was the gardener. Then he said one word, her name. That's all it took. The risen Jesus didn't announce himself with power. He called her by name. He knows yours too.",
   q:"When have you felt God call you by name?", o:["In a hard moment","In worship","Through another person","I'm still waiting"],
   p:"Imagine Jesus saying your name the way he said Mary's. What do you hear in his voice?",
   a:"Use someone's name warmly today, and really see them."},
  {r:"Luke 24:32", t:"And they said one to another, Did not our heart burn within us, while he talked with us by the way, and while he opened to us the scriptures?", th:"Did not our heart burn?", c:"Luke 24:13-35",
   m:"Two disciples walked to Emmaus, sad and confused, and a stranger joined them. He opened the Scriptures to them as they walked. Only later did they realize it was Jesus. Looking back, they said their hearts had been burning the whole time. Sometimes we only see where God was walking with us after the fact.",
   q:"Where have you seen God walking with you, looking back?", o:["Through a hard season","In a friendship","In Scripture","I haven't noticed yet"],
   p:"Think of a season where you only recognized God's presence afterward. What did you learn?",
   a:"Take a walk today and talk with Jesus the way you'd talk with a friend."},
  {r:"John 20:29", t:"Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed are they that have not seen, and yet have believed.", th:"Not seen, yet believed", c:"John 20:24-29",
   m:"Thomas wasn't there when Jesus first appeared, and he wanted proof. Jesus didn't scold him. He showed him his hands and side. Then he spoke about us: blessed are those who believe without seeing. Your faith, which has never seen his face, is something Jesus calls blessed.",
   q:"What helps your faith most when you can't see?", o:["Scripture","Other believers","Answered prayer","Creation"],
   p:"What questions or doubts do you have? Write them honestly, the way Thomas spoke his.",
   a:"Share your faith story with someone, including the doubts."},
  {r:"John 21:17", t:"He saith unto him the third time, Simon, son of Jonas, lovest thou me? Peter was grieved because he said unto him the third time, Lovest thou me? And he said unto him, Lord, thou knowest all things; thou knowest that I love thee. Jesus saith unto him, Feed my sheep.", th:"Feed my sheep", c:"John 21:15-19",
   m:"Peter denied Jesus three times. After the resurrection, Jesus asked him three times: lovest thou me? Each question gave Peter a chance to answer a denial. And each time, Jesus gave him a job: feed my sheep. Jesus doesn't just forgive failure. He restores us and gives us purpose again.",
   q:"How would you answer 'lovest thou me?'", o:["Yes, Lord","I want to love you more","It's complicated","You know all things"],
   p:"Where do you need Jesus to restore you after a failure? What sheep might he be asking you to feed?",
   a:"Care for someone today in a practical way: a meal, a call, or your time."},
