  {r:"1 Corinthians 15:55-57", t:"O death, where is thy sting? O grave, where is thy victory? The sting of death is sin; and the strength of sin is the law. But thanks be to God, which giveth us the victory through our Lord Jesus Christ.", th:"Where is thy sting?", c:"1 Corinthians 15:50-58",
   m:"Paul taunts death like a defeated enemy. O death, where is thy sting? Death is still real, and it still hurts. But because of the resurrection, it isn't the end. Its sting has been pulled. The victory isn't something we achieve. It's given to us through Jesus.",
   q:"What loss do you carry into this verse?", o:["Someone I love","A dream","My own fear of death","None right now"],
   p:"How does knowing death has lost its sting change the way you face loss or fear?",
   a:"Remember someone you've lost today, and thank God for the hope of seeing them again."},
  {r:"2 Corinthians 9:7", t:"Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver.", th:"A cheerful giver", c:"2 Corinthians 9:6-11",
   m:"God doesn't want gifts given grudgingly or because we feel forced. He loves a cheerful giver. The Greek word for cheerful is hilaros, which gives us the word 'hilarious.' Giving is meant to be joyful, an overflow of gratitude, not an obligation we put up with.",
   q:"How do you feel when you give?", o:["Joyful","Reluctant","Obligated","It depends"],
   p:"What would it look like to give joyfully this week?",
   a:"Give something today with a smile, just for the joy of it."},
  {r:"Genesis 50:20", t:"But as for you, ye thought evil against me; but God meant it unto good, to bring to pass, as it is this day, to save much people alive.", th:"God meant it unto good", c:"Genesis 50:15-21",
   m:"Joseph's brothers sold him into slavery. Years later, he was second in command of Egypt and could have taken revenge. Instead he said, 'Ye thought evil against me; but God meant it unto good.' He didn't pretend the harm wasn't real. He saw God at work through it.",
   q:"Is there a wound you're still waiting to see God redeem?", o:["Yes, from family","Yes, from a friend","Yes, from my own choices","I've seen him redeem it"],
   p:"Write about something meant for harm in your life. Where, if anywhere, have you seen God bring good from it?",
   a:"Choose kindness today toward someone who once hurt you."},
  {r:"Psalm 40:1-3", t:"I waited patiently for the LORD; and he inclined unto me, and heard my cry. He brought me up also out of an horrible pit, out of the miry clay, and set my feet upon a rock, and established my goings. And he hath put a new song in my mouth, even praise unto our God: many shall see it, and fear, and shall trust in the LORD.", th:"Out of the miry clay", c:"Psalm 40:1-5",
   m:"David waited patiently, and God bent down and heard him. Then God lifted him out of a pit of mud, set his feet on a rock, and put a new song in his mouth. The waiting came first. But the pit isn't the end of the story. The new song is.",
   q:"Where are you in this story?", o:["In the pit","Waiting patiently","Just lifted out","Singing a new song"],
   p:"What pit has God lifted you out of? Or what pit are you asking him to lift you from now?",
   a:"Share your new-song story with someone today: how God helped you."},
  {r:"Matthew 18:21-22", t:"Then came Peter to him, and said, Lord, how oft shall my brother sin against me, and I forgive him? till seven times? Jesus saith unto him, I say not unto thee, Until seven times: but, Until seventy times seven.", th:"Seventy times seven", c:"Matthew 18:21-35",
   m:"Peter thought forgiving someone seven times was generous. Jesus said seventy times seven. He wasn't setting a limit of 490. He was saying, stop counting. Forgiveness isn't always a one-time event. Sometimes you have to forgive the same hurt again each time it comes back up.",
   q:"Is there someone you keep having to forgive?", o:["Yes, a family member","Yes, a friend","Yes, myself","Not right now"],
   p:"Who are you tempted to stop forgiving? What would it look like to forgive again?",
   a:"Choose to forgive one more time today, even if it's for an old hurt."},
  {r:"Isaiah 54:10", t:"For the mountains shall depart, and the hills be removed; but my kindness shall not depart from thee, neither shall the covenant of my peace be removed, saith the LORD that hath mercy on thee.", th:"Kindness that stays", c:"Isaiah 54:7-10",
   m:"Mountains seem permanent. They're the picture of things that never move. God says even mountains could depart, but his kindness will not. His covenant of peace won't be removed. Of all the things in your life that might shift, God's kindness toward you isn't one of them.",
   q:"What feels like a mountain that's shaking?", o:["My health","My job","A relationship","My sense of security"],
   p:"Write about something that once felt permanent and changed. Then write about God's kindness that won't.",
   a:"Thank God today for one thing in your life that has stayed steady."},
  {r:"Galatians 2:20", t:"I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me.", th:"Christ lives in me", c:"Galatians 2:16-21",
   m:"Paul says his old self was crucified with Christ. Now Christ lives in him. And the life he lives, he lives by faith in the Son of God, 'who loved me, and gave himself for me.' Notice how personal that is. Not just the world. Me. Jesus loved you and gave himself for you.",
   q:"How personal does Jesus's love feel to you?", o:["Very personal","Somewhat","Distant","I'm learning"],
   p:"Write the last line of this verse with your name in it. How does it feel?",
   a:"Say throughout the day: He loved me, and gave himself for me."},
  {r:"Proverbs 11:25", t:"The liberal soul shall be made fat: and he that watereth shall be watered also himself.", th:"He that watereth", c:"Proverbs 11:24-28",
   m:"'Liberal' here means generous. The generous person will be refreshed, and the one who waters others will be watered too. It sounds backward that giving away makes you fuller. But it's true in a hundred small ways. Generosity with money, time, or kindness has a way of coming back to refresh the giver.",
   q:"Where are you most generous?", o:["Time","Money","Encouragement","Hospitality"],
   p:"Think of a time you gave generously and felt refreshed. What happened?",
   a:"Water someone else today: encourage, help, or give, and see what happens."},
  {r:"Matthew 19:26", t:"But Jesus beheld them, and said unto them, With men this is impossible; but with God all things are possible.", th:"All things possible", c:"Matthew 19:16-26",
   m:"Jesus said this after a rich young man walked away sad, unable to let go of his wealth. The disciples were stunned: who then can be saved? Jesus admitted it's impossible for people. But with God all things are possible, including changing hearts that seem stuck.",
   q:"What feels impossible to you right now?", o:["Changing a habit","Someone's heart","My situation","Forgiving"],
   p:"Write about the impossible thing. Then write: With God all things are possible.",
   a:"Pray today for the most impossible thing you can think of."},
  {r:"Psalm 42:1-2", t:"As the hart panteth after the water brooks, so panteth my soul after thee, O God. My soul thirsteth for God, for the living God: when shall I come and appear before God?", th:"As the deer pants", c:"Psalm 42",
   m:"A deer in a dry land is desperate for water. That's how the psalmist describes his longing for God. Thirst is uncomfortable, but it's also a sign of life. If you feel spiritually dry, that ache isn't a failure. It's your soul telling you what it really needs.",
   q:"How would you describe your soul's thirst?", o:["Desperate","Dry","Satisfied","Numb"],
   p:"What are you thirsty for? Write about it, and about where you've been trying to quench it.",
   a:"Each time you drink water today, pray: My soul thirsts for you, God."},
  {r:"Exodus 3:5", t:"And he said, Draw not nigh hither: put off thy shoes from off thy feet, for the place whereon thou standest is holy ground.", th:"Holy ground", c:"Exodus 3:1-6",
   m:"Moses was tending sheep, an ordinary day at work, when he noticed a bush burning without burning up. God told him to take off his sandals because the ground was holy. It wasn't a temple. It was a desert. Holy ground is wherever God shows up, including your kitchen, your car, or your desk.",
   q:"Where could your holy ground be today?", o:["At home","At work","Outdoors","In a conversation"],
   p:"What ordinary place in your life might God want to turn into holy ground?",
   a:"Pause somewhere ordinary today and treat it as holy for one quiet minute."},
  {r:"Galatians 5:1", t:"Stand fast therefore in the liberty wherewith Christ hath made us free, and be not entangled again with the yoke of bondage.", th:"Stand fast in freedom", c:"Galatians 5:1-6",
   m:"Christ set us free so that we could live free. Paul warns the Galatians not to go back to a yoke of bondage, trying to earn God's favor by keeping rules. Freedom in Christ is easy to lose if we slip back into performing for God. Stand firm in it.",
   q:"What tends to put a yoke back on you?", o:["Rules and performance","Guilt","Old habits","Other people's expectations"],
   p:"Where are you living like a slave instead of free? What would freedom look like there?",
   a:"Do something today out of freedom in Christ, not obligation."},
  {r:"Isaiah 55:1", t:"Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy, and eat; yea, come, buy wine and milk without money and without price.", th:"Come to the waters", c:"Isaiah 55:1-7",
   m:"This is an open invitation, like a street vendor calling out, with one difference: everything is free. Come, buy, eat, without money and without price. God's grace can't be purchased or earned. All you have to do is be thirsty and come.",
   q:"What are you spending yourself on that doesn't satisfy?", o:["Work","Approval","Things","Entertainment"],
   p:"The next verse asks why you spend money on what isn't bread. What isn't satisfying you right now?",
   a:"Give something away for free today, as a picture of God's grace."},
  {r:"Matthew 22:37-39", t:"Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind. This is the first and great commandment. And the second is like unto it, Thou shalt love thy neighbour as thyself.", th:"The great commandment", c:"Matthew 22:34-40",
   m:"Asked which commandment was greatest, Jesus summed up the whole law in two: love God with everything, and love your neighbor as yourself. Every other rule hangs on these. When life gets complicated, it can help to come back to two simple questions: am I loving God? Am I loving people?",
   q:"Which is harder for you today?", o:["Loving God fully","Loving my neighbor","Loving myself rightly","All three"],
   p:"What would loving God with all your heart, soul, and mind look like today, specifically?",
   a:"Do one thing today to love God and one thing to love a neighbor."},
  {r:"Psalm 46:1-3", t:"God is our refuge and strength, a very present help in trouble. Therefore will not we fear, though the earth be removed, and though the mountains be carried into the midst of the sea; Though the waters thereof roar and be troubled, though the mountains shake with the swelling thereof. Selah.", th:"A very present help", c:"Psalm 46",
   m:"The psalmist imagines the worst possible scenario: the earth giving way, mountains falling into the sea, waters roaring. And still he says, 'we will not fear.' Not because the danger isn't real, but because God is a very present help, near and available right now, not someday.",
   q:"What feels like mountains shaking in your life?", o:["Big changes","World events","Health","Family"],
   p:"What would it look like to not fear, even if your worst-case scenario happened?",
   a:"When you hear bad news today, pause and say: God is my refuge and strength."},
  {r:"Galatians 6:2", t:"Bear ye one another's burdens, and so fulfil the law of Christ.", th:"Bear one another's burdens", c:"Galatians 6:1-5",
   m:"We're not meant to carry everything alone. Paul says bearing each other's burdens fulfills the law of Christ, the law of love. Sometimes you're the one carrying someone else's load. Sometimes you need to let someone help carry yours. Both are part of being the body of Christ.",
   q:"Which is harder for you?", o:["Carrying others' burdens","Letting others carry mine","Both","Neither"],
   p:"Whose burden could you help carry? Who could help carry yours?",
   a:"Offer specific help to someone today, or accept help someone offers."},
  {r:"Matthew 25:40", t:"And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.", th:"The least of these", c:"Matthew 25:31-40",
   m:"Jesus identifies himself with the hungry, the thirsty, the stranger, the sick, and the prisoner. Whatever we do for them, we do for him. The surprising thing is that the people in the story didn't realize it. They were just being kind. Jesus is closer than we think, in the faces of people in need.",
   q:"Who are 'the least of these' near you?", o:["The poor","The lonely","The sick","Strangers"],
   p:"Where might Jesus be waiting for you in someone in need this week?",
   a:"Do something kind today for someone who can't pay you back."},
  {r:"Psalm 51:17", t:"The sacrifices of God are a broken spirit: a broken and a contrite heart, O God, thou wilt not despise.", th:"A broken and contrite heart", c:"Psalm 51:15-19",
   m:"After his worst sin, David realized God didn't want an impressive offering. He wanted a broken spirit, an honest heart that stops pretending. God will not despise it. You don't have to come to God put together. Bringing him your brokenness is the sacrifice he welcomes.",
   q:"What do you try to bring God instead of your honest heart?", o:["Good works","Religious habits","Excuses","Nothing, I come as I am"],
   p:"What part of your heart feels broken? Bring it to God here, without trying to fix it first.",
   a:"Be completely honest with God today about one thing you've been avoiding."},
  {r:"Proverbs 12:25", t:"Heaviness in the heart of man maketh it stoop: but a good word maketh it glad.", th:"A good word", c:"Proverbs 12:18-25",
   m:"Anxiety weighs a person down and makes them stoop. But a good word can lift them up. This proverb is a reminder of how much power a kind word has. Someone you see today may be carrying a heavy heart. A simple, sincere encouragement could be exactly what they need.",
   q:"When did a kind word last lift you up?", o:["Today","This week","A while ago","I can't remember"],
   p:"Who in your life is carrying heaviness? What good word could you give them?",
   a:"Send three people a sincere word of encouragement today."},
  {r:"Isaiah 55:8-9", t:"For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.", th:"Higher ways", c:"Isaiah 55:6-13",
   m:"God's thoughts aren't our thoughts. His ways are as high above ours as the heavens are above the earth. That can be frustrating when we want explanations. It can also be a relief. We don't have to understand everything. We can trust the One who does.",
   q:"What situation don't you understand right now?", o:["Something in my life","Something in someone else's life","Something in the world","Something about God"],
   p:"Write about something you don't understand. Then write a prayer of trust in God's higher ways.",
   a:"Let go of needing to understand one thing today, and trust God with it."},
  {r:"Exodus 3:14", t:"And God said unto Moses, I AM THAT I AM: and he said, Thus shalt thou say unto the children of Israel, I AM hath sent me unto you.", th:"I AM", c:"Exodus 3:7-15",
   m:"When Moses asked God's name, God answered: I AM THAT I AM. God simply is. He doesn't depend on anything, and he doesn't change. Moses felt unqualified, and God didn't answer by telling Moses who Moses was. He told Moses who he was. That was enough.",
   q:"When you feel inadequate, where does your mind go?", o:["What I can't do","What others think","What God can do","I try not to think about it"],
   p:"Fill in the blank: 'God, you are ___.' Write as many as you can that you need today.",
   a:"When you feel inadequate today, remind yourself: It's not about who I am, but who he is."},
  {r:"Matthew 28:19-20", t:"Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost: Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen.", th:"I am with you alway", c:"Matthew 28:16-20",
   m:"Jesus's last words in Matthew are a mission and a promise. Go, make disciples, teach. And: lo, I am with you alway, even unto the end of the world. The mission is big. But you never do it alone. He promised to be with you every single day.",
   q:"Where do you need the promise 'I am with you alway'?", o:["In sharing my faith","In daily life","In a hard place","In my loneliness"],
   p:"Who in your life might God want you to encourage in faith?",
   a:"Share something about your faith with one person today."},
  {r:"Ephesians 3:17-19", t:"That Christ may dwell in your hearts by faith; that ye, being rooted and grounded in love, May be able to comprehend with all saints what is the breadth, and length, and depth, and height; And to know the love of Christ, which passeth knowledge, that ye might be filled with all the fulness of God.", th:"Rooted in love", c:"Ephesians 3:14-19",
   m:"Paul prays that we'd grasp how wide, long, deep, and high Christ's love is, and know a love that passes knowledge. It's a love you can experience but never fully measure. Being rooted in it is like a tree whose roots go so deep that storms can't pull it up.",
   q:"Which dimension of God's love do you need to grasp most?", o:["How wide","How long","How deep","How high"],
   p:"Write about a time you experienced Christ's love in a way you couldn't explain.",
   a:"Pray this prayer of Paul's today for someone you love."},
  {r:"Psalm 55:22", t:"Cast thy burden upon the LORD, and he shall sustain thee: he shall never suffer the righteous to be moved.", th:"Cast thy burden", c:"Psalm 55:16-23",
   m:"David wrote this psalm after being betrayed by a close friend, someone he used to worship with. The pain was deep. His answer was to throw his burden onto God. The Hebrew word for burden can mean 'what has been given you.' Even the loads in your life can be handed back to the One who will sustain you.",
   q:"What burden have you been carrying the longest?", o:["A worry","A hurt","A responsibility","A secret"],
   p:"Describe the burden you carry. What would it feel like to throw it onto God?",
   a:"Write your burden on a piece of paper, pray over it, then tear it up."},
  {r:"Mark 1:35", t:"And in the morning, rising up a great while before day, he went out, and departed into a solitary place, and there prayed.", th:"A solitary place", c:"Mark 1:29-39",
   m:"The night before, the whole town had crowded around Jesus's door for healing. The next morning, long before sunrise, he went off alone to pray. If Jesus needed solitude with the Father, how much more do we? Busy seasons are when we need quiet the most.",
   q:"How much solitude do you get?", o:["Plenty","Some","Very little","None"],
   p:"What would it take to find a solitary place this week? What gets in the way?",
   a:"Get up a few minutes earlier tomorrow and spend them alone with God."},
  {r:"Isaiah 58:11", t:"And the LORD shall guide thee continually, and satisfy thy soul in drought, and make fat thy bones: and thou shalt be like a watered garden, and like a spring of water, whose waters fail not.", th:"A watered garden", c:"Isaiah 58:6-12",
   m:"This promise comes right after God describes the kind of fasting he wants: feeding the hungry, sheltering the poor, breaking chains. Those who pour themselves out for others will be like a watered garden, a spring that doesn't run dry. Giving yourself away doesn't empty you. God refills you.",
   q:"How full is your garden right now?", o:["Lush","Doing okay","Dry","Overgrown"],
   p:"Where do you need God to satisfy your soul in drought?",
   a:"Do one thing for someone in need today, and watch God refresh you."},
  {r:"Psalm 56:8", t:"Thou tellest my wanderings: put thou my tears into thy bottle: are they not in thy book?", th:"Tears in a bottle", c:"Psalm 56",
   m:"David wrote this when he had been seized by enemies. He asks God to put his tears in a bottle and write them in his book. None of your tears are wasted or unnoticed. God counts your wanderings and keeps your tears. Your sorrow matters to him.",
   q:"When did you last cry?", o:["Today","This week","A while ago","I can't remember"],
   p:"What has caused you tears lately? Write about it, knowing God keeps every one.",
   a:"Let yourself feel today. If tears come, tell God about them."},
  {r:"Ephesians 3:20-21", t:"Now unto him that is able to do exceeding abundantly above all that we ask or think, according to the power that worketh in us, Unto him be glory in the church by Christ Jesus throughout all ages, world without end. Amen.", th:"Exceeding abundantly", c:"Ephesians 3:20-21",
   m:"God is able to do exceeding abundantly above all that we ask or think. Paul stacks words on top of each other because one isn't big enough. Whatever you can imagine, God can do more. And the power to do it is already at work in you.",
   q:"What are you asking God for?", o:["Something small","Something big","Nothing right now","Something I'm afraid to ask"],
   p:"What would you ask God for if you really believed he could do more than you imagine?",
   a:"Pray a bigger prayer today than you normally would."},
  {r:"Exodus 4:11-12", t:"And the LORD said unto him, Who hath made man's mouth? or who maketh the dumb, or deaf, or the seeing, or the blind? have not I the LORD? Now therefore go, and I will be with thy mouth, and teach thee what thou shalt say.", th:"I will be with thy mouth", c:"Exodus 4:10-17",
   m:"Moses made excuses: he wasn't a good speaker. God's answer was gentle and direct: Who made your mouth? Your weaknesses don't surprise the One who made you. God didn't argue that Moses was secretly eloquent. He promised to go with him and give him the words.",
   q:"What excuse do you use most with God?", o:["I'm not good enough","I'm too busy","Someone else would be better","I'm afraid"],
   p:"What has God been nudging you to do that you've been making excuses about?",
   a:"Say yes to one small thing today you'd normally say no to out of insecurity."},
  {r:"Proverbs 15:1", t:"A soft answer turneth away wrath: but grievous words stir up anger.", th:"A soft answer", c:"Proverbs 15:1-4",
   m:"When someone comes at you with anger, the natural response is to push back. Proverbs says a gentle answer turns wrath away. It doesn't mean being a doormat. It means choosing a tone that cools things down instead of heating them up. That takes more strength, not less.",
   q:"How do you usually respond when someone is angry with you?", o:["I fight back","I shut down","I stay calm","It depends"],
   p:"Think of a recent tense conversation. What would a soft answer have looked like?",
   a:"In your next tense moment today, lower your voice and soften your words."},
  {r:"Mark 4:39", t:"And he arose, and rebuked the wind, and said unto the sea, Peace, be still. And the wind ceased, and there was a great calm.", th:"Peace, be still", c:"Mark 4:35-41",
   m:"A violent storm hit while Jesus slept in the boat. The terrified disciples woke him: don't you care that we're dying? He stood and spoke to the wind and waves: Peace, be still. And there was a great calm. The storm obeyed him. Your storm hears his voice too.",
   q:"Do you ever feel like Jesus is asleep in your storm?", o:["Yes, right now","Sometimes","Not usually","I've felt that before"],
   p:"What storm do you need Jesus to speak 'Peace, be still' to?",
   a:"When stress rises today, whisper: Peace, be still."},
  {r:"Psalm 61:2", t:"From the end of the earth will I cry unto thee, when my heart is overwhelmed: lead me to the rock that is higher than I.", th:"The rock higher than I", c:"Psalm 61",
   m:"When your heart is overwhelmed, you need to get above the flood. David asks God to lead him to a rock higher than himself. When we're overwhelmed, we can't climb out on our own. We need to be led to something more solid and higher than our own understanding.",
   q:"What's overwhelming you right now?", o:["Responsibilities","Emotions","The news","Decisions"],
   p:"Write a prayer from the end of the earth, wherever you feel farthest from peace.",
   a:"When you feel overwhelmed today, stop and pray: Lead me to the rock that is higher than I."},
  {r:"Ephesians 4:2-3", t:"With all lowliness and meekness, with longsuffering, forbearing one another in love; Endeavouring to keep the unity of the Spirit in the bond of peace.", th:"The bond of peace", c:"Ephesians 4:1-6",
   m:"Unity takes work. Paul lists what it requires: humility, gentleness, patience, bearing with each other in love. And then 'endeavouring,' making every effort. Peace between people doesn't just happen. It's kept through daily, intentional love.",
   q:"Where is unity hardest for you?", o:["Family","Church","Work","Friendships"],
   p:"Which quality, humility, gentleness, or patience, would most help a relationship you're in?",
   a:"Make an effort toward peace in a strained relationship today."},
  {r:"Isaiah 61:3", t:"To appoint unto them that mourn in Zion, to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they might be called trees of righteousness, the planting of the LORD, that he might be glorified.", th:"Beauty for ashes", c:"Isaiah 61:1-4",
   m:"Jesus read from this chapter at the start of his ministry. It promises beauty for ashes, joy for mourning, praise for heaviness. In the ancient world, mourners put ashes on their heads. God trades the signs of grief for a crown of beauty. And he plants his people like strong trees.",
   q:"What ashes do you need God to trade?", o:["Grief","Shame","Disappointment","Heaviness"],
   p:"What would it look like for God to give you beauty for your ashes? Write about it.",
   a:"Wear something today that reminds you of God's garment of praise."},
  {r:"Mark 5:34", t:"And he said unto her, Daughter, thy faith hath made thee whole; go in peace, and be whole of thy plague.", th:"Daughter, go in peace", c:"Mark 5:25-34",
   m:"A woman had been bleeding for twelve years, considered unclean, out of money from doctors, and isolated. She touched Jesus's robe secretly, hoping to slip away. He stopped and looked for her. He called her 'Daughter,' the only person the Gospels record him addressing that way. He healed her body and restored her place.",
   q:"What have you been carrying for a long time?", o:["A health issue","A hurt","A secret","A shame"],
   p:"Imagine Jesus stopping in a crowd to find you. What would he call you? What would he say?",
   a:"Reach out in faith today for what you need, even if it's just a whispered prayer."},
  {r:"Exodus 14:14", t:"The LORD shall fight for you, and ye shall hold your peace.", th:"Hold your peace", c:"Exodus 14:10-22",
   m:"The Israelites were trapped between Pharaoh's army and the Red Sea, panicking. Moses told them: The LORD shall fight for you, and ye shall hold your peace. Sometimes the bravest thing isn't action. It's standing still, being quiet, and watching God work.",
   q:"What battle are you trying to fight on your own?", o:["At work","In my family","In my mind","With my health"],
   p:"What would it look like to hold your peace and let God fight for you this week?",
   a:"When you feel the urge to control something today, stop and pray instead."},
  {r:"Psalm 63:3-4", t:"Because thy lovingkindness is better than life, my lips shall praise thee. Thus will I bless thee while I live: I will lift up my hands in thy name.", th:"Better than life", c:"Psalm 63:1-8",
   m:"David wrote this psalm in the wilderness of Judah, far from home and comfort. He had lost a great deal. Yet he says God's lovingkindness is better than life itself. When that's true, you can lose a lot and still have what matters most.",
   q:"What do you treasure most besides God?", o:["My family","My health","My security","My plans"],
   p:"What would it mean for God's love to be better than life to you?",
   a:"Lift up your hands in prayer today, even privately, as a sign of surrender and praise."},
  {r:"Ephesians 4:26-27", t:"Be ye angry, and sin not: let not the sun go down upon your wrath: Neither give place to the devil.", th:"Before the sun goes down", c:"Ephesians 4:25-32",
   m:"Paul doesn't say never be angry. Anger can be right. But don't let it lead you into sin, and don't go to bed with it. Unresolved anger turns into bitterness. 'Neither give place to the devil' means not giving bitterness a foothold to grow.",
   q:"Is there anger you've been carrying?", o:["Yes, toward someone","Yes, toward myself","Yes, toward God","Not right now"],
   p:"What anger needs to be dealt with before the sun goes down today?",
   a:"Resolve or release one source of anger before you go to bed tonight."},
  {r:"Mark 6:31", t:"And he said unto them, Come ye yourselves apart into a desert place, and rest a while: for there were many coming and going, and they had no leisure so much as to eat.", th:"Rest a while", c:"Mark 6:30-32",
   m:"The disciples came back from a mission, excited and exhausted. So many people were coming and going that they didn't even have time to eat. Jesus said: come away by yourselves to a quiet place and rest a while. Rest isn't a reward for finishing. It's something Jesus invites you into.",
   q:"When did you last really rest?", o:["This week","This month","I can't remember","I rest well"],
   p:"What would 'come apart and rest a while' look like for you this week?",
   a:"Schedule real rest this week, and protect it."},
  {r:"Psalm 68:19", t:"Blessed be the Lord, who daily loadeth us with benefits, even the God of our salvation. Selah.", th:"Daily benefits", c:"Psalm 68:19-20",
   m:"God doesn't bless us once a year. He daily loads us with benefits. Every day comes with new gifts, many of which we never notice: breath, food, people, beauty, protection. Gratitude is learning to see the load of benefits God piles on each day.",
   q:"What benefit did you almost miss today?", o:["My health","A person","A meal","A moment of beauty"],
   p:"List as many of today's benefits as you can, even small ones.",
   a:"Tonight, write down three specific gifts from your day."},
  {r:"Proverbs 16:3", t:"Commit thy works unto the LORD, and thy thoughts shall be established.", th:"Commit thy works", c:"Proverbs 16:1-9",
   m:"To commit your works is literally to roll them onto the LORD, like handing a heavy load to someone stronger. When you do, your thoughts are established, steadied and made firm. Anxious plans become settled ones when they're placed in God's hands.",
   q:"What work or plan do you need to commit to God?", o:["A project","A decision","A goal","My daily work"],
   p:"Write down your plans for this week, then commit each one to God in prayer.",
   a:"Before starting your work today, pray: I commit this to you."},
  {r:"Isaiah 64:8", t:"But now, O LORD, thou art our father; we are the clay, and thou our potter; and we all are the work of thy hand.", th:"The potter and the clay", c:"Isaiah 64:1-9",
   m:"Clay doesn't tell the potter what to make. It yields to the potter's hands. Isaiah calls God both Father and Potter: someone who loves you and someone who shapes you. Being clay means trusting that the pressure you feel is often his hands, forming something good.",
   q:"How do you feel about being shaped by God?", o:["Grateful","Resistant","Uncomfortable","Peaceful"],
   p:"Where do you feel God's hands shaping you right now? What might he be forming?",
   a:"Pray today: You are the potter, I am the clay. Shape me."},
  {r:"Ephesians 4:29", t:"Let no corrupt communication proceed out of your mouth, but that which is good to the use of edifying, that it may minister grace unto the hearers.", th:"Words that build up", c:"Ephesians 4:29-32",
   m:"'Corrupt' here means rotten, like spoiled fruit. Paul says let no rotten words come out of your mouth. Instead, speak what builds people up and gives grace to those who hear it. Before speaking, it's worth asking: will this build up or tear down?",
   q:"What kind of words come out most often?", o:["Encouraging","Critical","Complaining","Careful"],
   p:"Think about the words you spoke yesterday. Which built people up? Which didn't?",
   a:"Before you speak today, ask: Will this give grace to the person hearing it?"},
  {r:"Mark 10:51", t:"And Jesus answered and said unto him, What wilt thou that I should do unto thee? The blind man said unto him, Lord, that I might receive my sight.", th:"What do you want?", c:"Mark 10:46-52",
   m:"Blind Bartimaeus shouted for Jesus while the crowd told him to be quiet. Jesus stopped and asked: What do you want me to do for you? The answer seems obvious. But Jesus wanted him to say it. God invites us to name what we want, plainly and honestly.",
   q:"If Jesus asked you that today, what would you say?", o:["Heal me","Help me","Show me","Change me"],
   p:"Answer Jesus's question in writing: What do you want me to do for you?",
   a:"Ask God for something specific and honest today."},
  {r:"Exodus 15:2", t:"The LORD is my strength and song, and he is become my salvation: he is my God, and I will prepare him an habitation; my father's God, and I will exalt him.", th:"My strength and song", c:"Exodus 15:1-13",
   m:"This is from one of the oldest songs in the Bible, sung right after the crossing of the Red Sea. The people who had been terrified a day earlier were now singing. God hadn't just given them strength. He had become their song. Remembering what God has done is how fear turns into praise.",
   q:"What would your song of thanks be about?", o:["A rescue","A provision","A healing","A quiet faithfulness"],
   p:"Write your own short song about what God has brought you through.",
   a:"Sing or listen to a song of praise today and think about what God has done for you."},
  {r:"Psalm 71:17-18", t:"O God, thou hast taught me from my youth: and hitherto have I declared thy wondrous works. Now also when I am old and grayheaded, O God, forsake me not; until I have shewed thy strength unto this generation, and thy power to every one that is to come.", th:"When I am old", c:"Psalm 71:14-21",
   m:"This psalm was written by someone who had walked with God since youth and was now old and gray. The prayer is not to be forsaken, so they can tell the next generation what God has done. Faith is meant to be passed on. Your story of God's faithfulness is a gift to those coming after you.",
   q:"Who passed faith on to you?", o:["A parent or grandparent","A teacher or pastor","A friend","No one, I found it myself"],
   p:"What story of God's faithfulness would you want the next generation to hear from you?",
   a:"Tell a younger person one way God has been faithful to you."},
  {r:"Ephesians 4:32", t:"And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ's sake hath forgiven you.", th:"Kind and tenderhearted", c:"Ephesians 4:31-32",
   m:"Paul ends this section with three simple words: kind, tenderhearted, forgiving. And the reason: because God for Christ's sake has forgiven you. When you remember how much you've been forgiven, it gets easier to extend that same forgiveness to others.",
   q:"Which of the three comes hardest to you?", o:["Kind","Tenderhearted","Forgiving","All three"],
   p:"Who do you need to be kinder, more tender, or more forgiving toward?",
   a:"Be intentionally kind and tender to everyone you meet today."},
  {r:"Mark 12:43-44", t:"And he called unto him his disciples, and saith unto them, Verily I say unto you, That this poor widow hath cast more in, than all they which have cast into the treasury: For all they did cast in of their abundance; but she of her want did cast in all that she had, even all her living.", th:"All that she had", c:"Mark 12:41-44",
   m:"Jesus watched people giving at the temple. Rich people gave large amounts. A poor widow gave two tiny coins. Jesus said she gave more than all of them, because she gave everything. God doesn't measure gifts by their size. He measures them by the heart, and by what they cost.",
   q:"What could you give God that would truly cost you?", o:["Time","Money","Pride","Control"],
   p:"What does it mean to give out of your want rather than your abundance?",
   a:"Give something today that costs you a little."},
  {r:"Jeremiah 1:5", t:"Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I sanctified thee, and I ordained thee a prophet unto the nations.", th:"Known before birth", c:"Jeremiah 1:4-10",
   m:"Before Jeremiah was born, God knew him and set him apart. Jeremiah protested that he was too young. God told him not to say that, because God would be with him. Your life wasn't an accident. God knew you before anyone else did, and he had a purpose in mind.",
   q:"What do you think you were made for?", o:["To help people","To create","To lead","I'm still figuring it out"],
   p:"What excuse do you make, like Jeremiah's 'I am a child'? What might God say back?",
   a:"Do one thing today that uses a gift God has given you."},
  {r:"Psalm 73:25-26", t:"Whom have I in heaven but thee? and there is none upon earth that I desire beside thee. My flesh and my heart faileth: but God is the strength of my heart, and my portion for ever.", th:"My portion forever", c:"Psalm 73:21-28",
   m:"Asaph had been envious of people who seemed to have it all. Then he went into God's sanctuary and saw things differently. His flesh and heart might fail, but God would be his strength and his portion forever. A portion was an inheritance. God himself is what we inherit.",
   q:"What do you envy most in others?", o:["Their success","Their ease","Their relationships","Their health"],
   p:"What would change if God himself were your portion, your inheritance, your enough?",
   a:"When envy shows up today, pray: Whom have I in heaven but thee?"},
  {r:"Exodus 17:12", t:"But Moses' hands were heavy; and they took a stone, and put it under him, and he sat thereon; and Aaron and Hur stayed up his hands, the one on the one side, and the other on the other side; and his hands were steady until the going down of the sun.", th:"Hold up his hands", c:"Exodus 17:8-13",
   m:"As long as Moses held up his hands, Israel was winning the battle. When his arms got tired, they started losing. So Aaron and Hur sat him on a stone and held his arms up until sunset. Even Moses couldn't do it alone. We all need people who hold up our hands.",
   q:"Who holds up your hands?", o:["Family","Friends","My church","I don't have anyone right now"],
   p:"Who has held up your hands when you were tired? Whose hands could you hold up this week?",
   a:"Reach out to someone who's carrying a lot and offer specific help."},
  {r:"Luke 1:78-79", t:"Through the tender mercy of our God; whereby the dayspring from on high hath visited us, To give light to them that sit in darkness and in the shadow of death, to guide our feet into the way of peace.", th:"The dayspring from on high", c:"Luke 1:67-79",
   m:"Zacharias sang this after his son John was born. The 'dayspring' is the sunrise, a picture of Jesus breaking into a dark world. He gives light to those sitting in darkness and guides our feet into the way of peace. Light for the path. That's what God does.",
   q:"Where do you need light on your path?", o:["A decision","A relationship","My emotions","My future"],
   p:"Where are you sitting in darkness? What would the sunrise of God's mercy look like there?",
   a:"Watch a sunrise this week and pray these verses as the light comes up."},
  {r:"Ephesians 6:10-11", t:"Finally, my brethren, be strong in the Lord, and in the power of his might. Put on the whole armour of God, that ye may be able to stand against the wiles of the devil.", th:"The whole armour of God", c:"Ephesians 6:10-18",
   m:"Paul wrote this as a prisoner, likely guarded by Roman soldiers whose armor he could see every day. Be strong in the Lord, not in yourself, and put on the whole armor of God. The struggles we face aren't only against people. God provides everything we need to stand firm.",
   q:"Which piece of armor do you need most today?", o:["Truth","Righteousness","Peace","Faith"],
   p:"Read Ephesians 6:13-18. Which piece of armor do you most need to put on today, and why?",
   a:"As you get dressed today, name each piece of God's armor."},
  {r:"Proverbs 16:9", t:"A man's heart deviseth his way: but the LORD directeth his steps.", th:"He directs the steps", c:"Proverbs 16:1-9",
   m:"Make plans. That's wise. But hold them loosely. We map out the way, and God directs the actual steps. Sometimes his direction looks like a closed door, a detour, or an unexpected opportunity. The plan is ours to make. The path is his to direct.",
   q:"How do you handle it when plans change?", o:["Frustrated","Anxious","Flexible","Curious"],
   p:"Write about a time your plans changed and God led you somewhere better.",
   a:"When something doesn't go as planned today, ask God what he might be directing."},
  {r:"Psalm 77:11", t:"I will remember the works of the LORD: surely I will remember thy wonders of old.", th:"I will remember", c:"Psalm 77:1-15",
   m:"Psalm 77 starts with sleepless nights and questions. Has God forgotten to be gracious? Then the turn comes: I will remember. Memory is a weapon against despair. When the present feels dark, remembering what God has done gives you hope for what's ahead.",
   q:"When you're struggling, what do you tend to remember?", o:["My failures","Hard times","God's faithfulness","I don't look back"],
   p:"List three times God came through for you. Keep this list for the next hard day.",
   a:"Start a list today of God's faithfulness, and add to it this week."},
  {r:"Jeremiah 6:16", t:"Thus saith the LORD, Stand ye in the ways, and see, and ask for the old paths, where is the good way, and walk therein, and ye shall find rest for your souls. But they said, We will not walk therein.", th:"The old paths", c:"Jeremiah 6:16-19",
   m:"God tells his people to stand at the crossroads and look, to ask for the old paths where the good way is, and to walk in it. Then they would find rest for their souls. Sadly, they refused. Not every new road is better. Sometimes the way forward is a return to well-worn paths of faith.",
   q:"Which old path do you want to return to?", o:["Daily prayer","Reading Scripture","Church community","A day of rest"],
   p:"You're at a crossroads. What would asking for the old paths look like for you?",
   a:"Practice one old discipline today: prayer, fasting, Scripture, or rest."},
  {r:"Luke 5:4-5", t:"Now when he had left speaking, he said unto Simon, Launch out into the deep, and let down your nets for a draught. And Simon answering said unto him, Master, we have toiled all the night, and have taken nothing: nevertheless at thy word I will let down the net.", th:"At thy word", c:"Luke 5:1-11",
   m:"Peter had fished all night and caught nothing. Then Jesus, a carpenter, told this professional fisherman where to put his nets. Peter was tired and skeptical, but he said: nevertheless at thy word. The nets filled until they began to break. Obedience doesn't require feeling optimistic. Just willing.",
   q:"Where are you tired of trying?", o:["Work","A relationship","Prayer","A goal"],
   p:"Where has Jesus asked you to let down your nets one more time?",
   a:"Try one more time today at something you've almost given up on."},
  {r:"Philippians 1:6", t:"Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ.", th:"He will finish it", c:"Philippians 1:3-11",
   m:"God started a good work in you, and he's not going to quit halfway. He will carry it on to completion. You might feel unfinished, and you are. But you're not abandoned. God is a craftsman who finishes what he starts.",
   q:"Where do you feel most unfinished?", o:["My character","My faith","My habits","My relationships"],
   p:"What good work do you see God doing in you? Thank him for it, even if it isn't finished.",
   a:"Be patient with yourself today. God isn't finished yet."},
  {r:"Psalm 84:10", t:"For a day in thy courts is better than a thousand. I had rather be a doorkeeper in the house of my God, than to dwell in the tents of wickedness.", th:"A day in thy courts", c:"Psalm 84",
   m:"One day near God is better than a thousand anywhere else. The psalmist would rather be a doorkeeper, the lowest job, in God's house than live in comfort far from him. What we often treat as one option among many, this psalm treats as the best thing there is.",
   q:"What competes most with your time with God?", o:["Work","Screens","Rest","Other people"],
   p:"What makes time with God feel like a day in his courts for you? What gets in the way?",
   a:"Give God a bit more of your time today than you planned to."},
  {r:"Exodus 33:14", t:"And he said, My presence shall go with thee, and I will give thee rest.", th:"My presence shall go with thee", c:"Exodus 33:12-17",
   m:"Moses was leading a stubborn people through the wilderness, and he told God he wouldn't go another step without him. God answered with a promise of presence and rest. The journey would still be long. But God's presence would make it possible, and his rest would be found along the way.",
   q:"Where do you need God's presence most this week?", o:["A decision","A hard place","A transition","Everyday life"],
   p:"Like Moses, what would you tell God you can't do without him?",
   a:"Before you leave home today, pray: Your presence goes with me."},
  {r:"Luke 6:38", t:"Give, and it shall be given unto you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom. For with the same measure that ye mete withal it shall be measured to you again.", th:"Running over", c:"Luke 6:37-38",
   m:"Picture grain being poured into a measure, then pressed down and shaken to fit more, until it overflows into your lap. That's how God responds to generosity. And the measure you use with others, in giving, forgiving, and judging, is the measure you'll receive.",
   q:"What measure are you using with others?", o:["Generous","Careful","Stingy","It depends on the person"],
   p:"Where could you be more generous this week: with money, time, forgiveness, or grace?",
   a:"Be extravagantly generous with someone today."},
  {r:"Philippians 2:3-4", t:"Let nothing be done through strife or vainglory; but in lowliness of mind let each esteem other better than themselves. Look not every man on his own things, but every man also on the things of others.", th:"Others first", c:"Philippians 2:1-11",
   m:"Do nothing from selfish ambition or conceit. In humility, count others as more important than yourself. Look out for others' interests, not just your own. Paul follows this with the greatest example: Jesus, who emptied himself and became a servant.",
   q:"Where does selfishness show up most in your life?", o:["At home","At work","In conversations","In my plans"],
   p:"Whose interests could you put ahead of your own this week?",
   a:"Let someone else go first today, in big or small ways."},
  {r:"Jeremiah 17:7-8", t:"Blessed is the man that trusteth in the LORD, and whose hope the LORD is. For he shall be as a tree planted by the waters, and that spreadeth out her roots by the river, and shall not see when heat cometh, but her leaf shall be green; and shall not be careful in the year of drought, neither shall cease from yielding fruit.", th:"Roots by the river", c:"Jeremiah 17:5-8",
   m:"The tree planted by water still faces heat and drought. The difference is that its roots reach the river, so its leaves stay green and it keeps bearing fruit. Trusting God doesn't mean avoiding dry seasons. It means having roots deep enough to survive them.",
   q:"Is this a dry season for you?", o:["Yes, very dry","A little","No, things are green","It's hard to tell"],
   p:"Where are your roots? What would it take to send them deeper toward God this week?",
   a:"Water a plant today and pray about sending your roots deeper."},
  {r:"Proverbs 17:17", t:"A friend loveth at all times, and a brother is born for adversity.", th:"A friend at all times", c:"Proverbs 17:17",
   m:"A real friend loves at all times, not just when it's convenient. And a brother, or a sister, is born for adversity, made for the hard times. True friendship shows up when things fall apart. Jesus is that kind of friend, and he calls us to be that kind of friend too.",
   q:"Who has been a friend to you in hard times?", o:["Family","A close friend","Someone unexpected","I've felt alone"],
   p:"Write about a friend who loved you at all times. How can you be that friend to someone else?",
   a:"Check in today on a friend who might be going through something hard."},
  {r:"Psalm 85:10", t:"Mercy and truth are met together; righteousness and peace have kissed each other.", th:"Mercy and truth meet", c:"Psalm 85",
   m:"This is a beautiful picture of things that usually seem opposed coming together: mercy and truth meeting, righteousness and peace kissing. In our lives we often choose one, honesty or kindness, justice or peace. In God, they're never at odds. The cross is where they meet completely.",
   q:"Which do you lean toward more naturally?", o:["Truth","Mercy","Justice","Peace"],
   p:"Where do you need both mercy and truth in a relationship right now?",
   a:"In a hard conversation today, speak truth with mercy."},
  {r:"Luke 7:47", t:"Wherefore I say unto thee, Her sins, which are many, are forgiven; for she loved much: but to whom little is forgiven, the same loveth little.", th:"She loved much", c:"Luke 7:36-50",
   m:"A woman with a sinful reputation walked into a dinner party, wept on Jesus's feet, and anointed them with perfume. The religious host was appalled. Jesus said: her many sins are forgiven, for she loved much. Those who know how much they've been forgiven tend to love the most.",
   q:"How aware are you of what you've been forgiven?", o:["Very aware","Somewhat","I don't think about it","I struggle to accept it"],
   p:"Write about what Jesus has forgiven you. How does that make you want to respond?",
   a:"Express your love for Jesus today in a generous way: worship, giving, or service."},
  {r:"Philippians 4:8", t:"Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things.", th:"Think on these things", c:"Philippians 4:8-9",
   m:"Paul gives a filter for our thoughts: true, honest, just, pure, lovely, of good report. What we think about shapes how we feel and act. You can't always control what pops into your head, but you can choose what you dwell on.",
   q:"What do you think about most during the day?", o:["Worries","Plans","Other people","Good things"],
   p:"List some true, lovely, and praiseworthy things in your life right now.",
   a:"When a negative thought loops today, replace it with one thing from your list."},
  {r:"Psalm 86:11", t:"Teach me thy way, O LORD; I will walk in thy truth: unite my heart to fear thy name.", th:"Unite my heart", c:"Psalm 86:8-13",
   m:"'Unite my heart' asks God to make a divided heart whole. Most of us are pulled in many directions, wanting God and wanting other things at the same time. This prayer admits that and asks for help. A united heart has one center, and everything else finds its place around it.",
   q:"What divides your heart most?", o:["Fear","Distraction","Competing desires","Old wounds"],
   p:"What pulls your heart in different directions? Write a prayer asking God to unite it.",
   a:"Pray 'Unite my heart' each time you feel scattered today."},
  {r:"Deuteronomy 8:3", t:"And he humbled thee, and suffered thee to hunger, and fed thee with manna, which thou knewest not, neither did thy fathers know; that he might make thee know that man doth not live by bread only, but by every word that proceedeth out of the mouth of the LORD doth man live.", th:"Not by bread only", c:"Deuteronomy 8:1-10",
   m:"God let his people get hungry in the wilderness, then fed them with manna, something they'd never seen. It was a lesson: life is more than what keeps the body going. We live by every word that comes from God. Jesus quoted this verse when he was tempted in the desert.",
   q:"What do you lean on most to feel full?", o:["Food or comfort","Achievement","Relationships","God's word"],
   p:"What wilderness season has taught you that you need more than bread?",
   a:"Before you eat today, read one verse and let it feed you first."},
  {r:"Luke 9:23", t:"And he said to them all, If any man will come after me, let him deny himself, and take up his cross daily, and follow me.", th:"Take up the cross daily", c:"Luke 9:18-27",
   m:"Luke includes a word the other Gospels leave out here: daily. Following Jesus isn't a one-time decision. It's a daily choice to set aside our own way and follow his. Every morning comes with a new cross to take up and a new invitation to follow.",
   q:"What does 'deny himself' look like for you today?", o:["My comfort","My pride","My schedule","My wants"],
   p:"What would taking up your cross look like today, specifically?",
   a:"Choose one way today to put Jesus's will ahead of your own."},
  {r:"Jeremiah 29:12-13", t:"Then shall ye call upon me, and ye shall go and pray unto me, and I will hearken unto you. And ye shall seek me, and find me, when ye shall search for me with all your heart.", th:"With all your heart", c:"Jeremiah 29:10-14",
   m:"These words come right after the famous promise of Jeremiah 29:11. God's plans of peace lead here: you will call, and I will listen; you will seek me, and you will find me, when you search with all your heart. God is not hiding. He wants to be found.",
   q:"How wholeheartedly are you seeking God right now?", o:["With all my heart","Halfheartedly","Distractedly","I've stopped seeking"],
   p:"What would it look like to seek God with all your heart this week?",
   a:"Set aside extra time today to seek God without distractions."},
  {r:"Philippians 4:19", t:"But my God shall supply all your need according to his riches in glory by Christ Jesus.", th:"All your need", c:"Philippians 4:14-20",
   m:"Paul wrote this to a church that had given generously to support him. Because they gave, he assures them God will supply all their need, according to his riches. Not a little help from a small budget, but provision from unlimited riches. Notice the word: need, not every want.",
   q:"What need are you trusting God to supply?", o:["Financial","Emotional","Physical","Spiritual"],
   p:"Write about a time God supplied a need, maybe in an unexpected way.",
   a:"Thank God today for a need he's already met."},
  {r:"Psalm 86:15", t:"But thou, O Lord, art a God full of compassion, and gracious, longsuffering, and plenteous in mercy and truth.", th:"Full of compassion", c:"Psalm 86:14-17",
   m:"This is one of the Bible's most repeated descriptions of God, first spoken to Moses on Mount Sinai: full of compassion, gracious, longsuffering, plenteous in mercy and truth. When you wonder what God is really like, this is how he describes himself. It's worth memorizing.",
   q:"Which part of this description do you need most?", o:["Compassion","Grace","Patience","Mercy"],
   p:"How does this description compare with how you usually picture God?",
   a:"Memorize this verse today. Say it whenever you doubt what God thinks of you."},
  {r:"Luke 10:33-34", t:"But a certain Samaritan, as he journeyed, came where he was: and when he saw him, he had compassion on him, And went to him, and bound up his wounds, pouring in oil and wine, and set him on his own beast, and brought him to an inn, and took care of him.", th:"The Good Samaritan", c:"Luke 10:25-37",
   m:"A man was beaten and left on the road. A priest and a Levite, religious leaders, walked past. A Samaritan, someone Jesus's audience would have looked down on, stopped and cared for him at his own cost. Jesus's point: your neighbor is anyone who needs you, and anyone can be a neighbor.",
   q:"Who is it hardest to see as your neighbor?", o:["Someone different from me","Someone who's been unkind","Strangers","People in need"],
   p:"Who have you been walking past? What would it look like to stop?",
   a:"Stop today for someone you'd normally walk past."},
  {r:"Proverbs 17:22", t:"A merry heart doeth good like a medicine: but a broken spirit drieth the bones.", th:"Good medicine", c:"Proverbs 17:22",
   m:"Long before modern research on laughter and health, Proverbs said a cheerful heart is good medicine. Joy isn't a luxury. It's part of how God made us to be well. A crushed spirit drains everything. Laughter, gratitude, and delight are gifts that heal.",
   q:"When did you last laugh really hard?", o:["Today","This week","A while ago","I can't remember"],
   p:"What brings you real joy? How can you make room for more of it?",
   a:"Do something today just because it makes you laugh."},
  {r:"Deuteronomy 31:8", t:"And the LORD, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.", th:"He goes before you", c:"Deuteronomy 31:1-8",
   m:"Moses said this to Joshua as he handed over leadership. God doesn't just walk with you. He goes ahead of you. Whatever is coming tomorrow, he's already there. He will not fail you, neither forsake you. That's why you don't have to be afraid of what's ahead.",
   q:"What's coming up that you're nervous about?", o:["A conversation","A decision","A change","An appointment"],
   p:"What would change about tomorrow if you believed God was already there, waiting for you?",
   a:"Think of something you're dreading this week and picture God already standing there."},
  {r:"Colossians 3:15", t:"And let the peace of God rule in your hearts, to the which also ye are called in one body; and be ye thankful.", th:"Let peace make the call", c:"Colossians 3:12-17",
   m:"The Greek word for 'rule' means to act as umpire, to make the call. Let God's peace be the referee in your heart. When you're deciding what to do or how to react, let his peace make the call. And Paul adds three simple words: be ye thankful.",
   q:"What usually makes the call in your heart?", o:["My feelings","Other people","Fear","God's peace"],
   p:"What decision or reaction could you let God's peace referee this week?",
   a:"Before reacting to something today, pause and ask: What would peace choose?"},
  {r:"Psalm 91:4", t:"He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler.", th:"Under his feathers", c:"Psalm 91:1-8",
   m:"The psalmist pictures God like a mother bird spreading her wings over her chicks. It's a tender, protective image, and Jesus used it too, saying he longed to gather Jerusalem like a hen gathers her chicks. Under his wings is a place of warmth, safety, and closeness.",
   q:"What do you need sheltering from today?", o:["Worry","Danger","Criticism","My own thoughts"],
   p:"Imagine resting under God's wings. What would you let go of there?",
   a:"When you feel exposed or anxious today, picture yourself under his wings."},
  {r:"Jeremiah 31:3", t:"The LORD hath appeared of old unto me, saying, Yea, I have loved thee with an everlasting love: therefore with lovingkindness have I drawn thee.", th:"An everlasting love", c:"Jeremiah 31:1-6",
   m:"God speaks to a people in exile who think he's abandoned them. His message: I have loved you with an everlasting love; with lovingkindness I have drawn you. Not a love that started when you behaved, or one that ends when you fail. Everlasting, from before the beginning to after the end.",
   q:"How hard is it to believe God's love is everlasting?", o:["Easy","Hard on bad days","Very hard","I believe it"],
   p:"Write about a time you felt God drawing you with lovingkindness.",
   a:"Tell yourself today, as often as you need to: I am loved with an everlasting love."},
  {r:"Luke 12:32", t:"Fear not, little flock; for it is your Father's good pleasure to give you the kingdom.", th:"Fear not, little flock", c:"Luke 12:22-34",
   m:"Jesus calls his followers 'little flock,' a tender, protective name. Then he says something amazing: it's your Father's good pleasure to give you the kingdom. God isn't reluctantly handing it over. It makes him glad to give it. You're not scraping by on scraps. You're heirs.",
   q:"How do you think God feels about giving to you?", o:["Glad","Reluctant","Indifferent","I'm not sure"],
   p:"What does it mean to you that God takes pleasure in giving you the kingdom?",
   a:"Receive something today with gratitude, without feeling you have to earn it."},
  {r:"Psalm 94:19", t:"In the multitude of my thoughts within me thy comforts delight my soul.", th:"A multitude of thoughts", c:"Psalm 94:16-23",
   m:"When your mind is racing with a multitude of thoughts, this verse offers something better than trying to stop thinking. It's God's comfort, which delights the soul right in the middle of anxious thoughts. You don't have to calm down first. His comfort meets you in the noise.",
   q:"What do your thoughts circle around most?", o:["Worries","Regrets","Plans","Other people"],
   p:"Write down the thoughts crowding your mind right now. Then ask God to bring his comfort into each one.",
   a:"When your thoughts start racing today, stop and name one comfort from God."},
  {r:"Colossians 3:23", t:"And whatsoever ye do, do it heartily, as to the Lord, and not unto men.", th:"As to the Lord", c:"Colossians 3:22-25",
   m:"Paul wrote this to servants, people with little control over their work. Whatever you do, do it with your whole heart, as working for the Lord, not for people. That changes everything about ordinary work. Dishes, spreadsheets, and errands become offerings to God.",
   q:"Which task feels least meaningful to you?", o:["Housework","My job","Errands","Caregiving"],
   p:"How would your work feel different today if you did it for God, not for anyone else?",
   a:"Do your least favorite task today as an offering to God."},
  {r:"Luke 15:20", t:"And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him.", th:"The father ran", c:"Luke 15:11-24",
   m:"The son had demanded his inheritance early, wasted it all, and come home rehearsing an apology. But his father saw him a long way off and ran. In that culture, a dignified older man didn't run. The father didn't wait for the speech. He ran, embraced him, and kissed him. That's what God is like.",
   q:"Where are you in this story?", o:["Far from home","On the road back","In the father's arms","Waiting for someone to come home"],
   p:"Imagine God running toward you. What speech could you stop rehearsing?",
   a:"Welcome someone today with warmth, the way the father did."},
  {r:"Joshua 24:15", t:"And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD.", th:"As for me and my house", c:"Joshua 24:14-18",
   m:"At the end of his life, Joshua gathered the people and told them to choose whom they would serve. Faith is a daily choice, and it's personal. Joshua didn't wait to see what everyone else would do. He decided: as for me and my house, we will serve the LORD.",
   q:"What competes most for your loyalty?", o:["Comfort","Money","Approval","Busyness"],
   p:"What does 'choose you this day' look like for you, today specifically?",
   a:"Make one choice today that puts God first, even if it's small."},
  {r:"Jeremiah 33:3", t:"Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not.", th:"Call unto me", c:"Jeremiah 33:1-9",
   m:"Jeremiah was locked in the court of the prison when God said this. Call to me, and I will answer, and show you great and mighty things you don't know. It's an invitation to pray big, from wherever you are. Even confined, Jeremiah was invited to see far beyond his walls.",
   q:"What would you ask God to show you?", o:["My next step","His purpose in my pain","How to love better","Something about himself"],
   p:"Write a bold prayer asking God to show you great and mighty things.",
   a:"Ask God today for something bigger than you usually would."},
  {r:"Proverbs 18:10", t:"The name of the LORD is a strong tower: the righteous runneth into it, and is safe.", th:"A strong tower", c:"Proverbs 18:10-12",
   m:"Ancient cities had towers where people ran when enemies attacked. God's name, meaning his character and who he is, is that kind of tower. The righteous run into it. You don't stroll to a tower in an emergency. You run. And inside, you're safe.",
   q:"What do you run to when you're scared?", o:["People","Distractions","Food or comfort","God"],
   p:"What is it about God's name and character that makes you feel safe?",
   a:"The next time you feel threatened or anxious today, say the name of Jesus."},
  {r:"Psalm 95:6", t:"O come, let us worship and bow down: let us kneel before the LORD our maker.", th:"Let us kneel", c:"Psalm 95:1-7",
   m:"Worship isn't only singing. Sometimes it's bowing down and kneeling, physically showing that God is God and you are not. Kneeling is humbling and restful at the same time. It's a posture that says, 'You're my maker, and I trust you.'",
   q:"How do you usually worship?", o:["Singing","Praying","Serving","Quietly"],
   p:"What does it mean to you that God is your maker? How does that make you want to respond?",
   a:"Kneel for a minute of prayer today, even if it feels unusual."},
  {r:"Luke 15:31-32", t:"And he said unto him, Son, thou art ever with me, and all that I have is thine. It was meet that we should make merry, and be glad: for this thy brother was dead, and is alive again; and was lost, and is found.", th:"The older brother", c:"Luke 15:25-32",
   m:"The older brother had stayed home and worked hard, and he was angry when his brother got a party. The father went out to him too. Son, you're always with me, and everything I have is yours. God pursues both kinds of lost: the ones who run away and the ones who stay home resentful.",
   q:"Do you ever relate to the older brother?", o:["Often","Sometimes","Rarely","Not at all"],
   p:"Where might resentment be keeping you from the father's celebration?",
   a:"Celebrate someone else's good news today, sincerely."},
  {r:"1 Thessalonians 5:11", t:"Wherefore comfort yourselves together, and edify one another, even as also ye do.", th:"Build each other up", c:"1 Thessalonians 5:9-11",
   m:"Encourage one another and build each other up. Paul adds: just as you're already doing. He isn't scolding. He's cheering them on to keep going. Nobody outgrows encouragement. Everyone needs it, including the people who seem to have it all together.",
   q:"Who encourages you most?", o:["Family","Friends","A mentor","No one lately"],
   p:"Who could use a word of encouragement from you? What would you say?",
   a:"Send three encouraging messages today."},
  {r:"Psalm 100:4-5", t:"Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name. For the LORD is good; his mercy is everlasting; and his truth endureth to all generations.", th:"Gates of thanksgiving", c:"Psalm 100",
   m:"Thanksgiving is how you enter God's presence. The psalm gives three reasons: the LORD is good, his mercy is everlasting, and his truth endures to all generations. When it's hard to pray, start with thanks. It opens the gate.",
   q:"What's hardest to be thankful for right now?", o:["My circumstances","My body","My relationships","My past"],
   p:"Begin today's prayer here with ten thank-yous. What do you notice?",
   a:"Before asking God for anything today, thank him for three things."},
  {r:"Luke 17:15-16", t:"And one of them, when he saw that he was healed, turned back, and with a loud voice glorified God, And fell down on his face at his feet, giving him thanks: and he was a Samaritan.", th:"The one who returned", c:"Luke 17:11-19",
   m:"Ten lepers were healed. Only one came back to thank Jesus, and he was a Samaritan, an outsider. Jesus noticed: Were there not ten cleansed? But where are the nine? Gratitude is rarer than we think. It's easy to receive God's gifts and forget to come back.",
   q:"What blessing have you forgotten to thank God for?", o:["My health","My family","An answered prayer","My daily needs"],
   p:"Be the one who returns. Write a thank-you to God for something specific.",
   a:"Thank one person today who has helped you, and be specific."},
  {r:"Lamentations 3:25-26", t:"The LORD is good unto them that wait for him, to the soul that seeketh him. It is good that a man should both hope and quietly wait for the salvation of the LORD.", th:"Quietly wait", c:"Lamentations 3:22-33",
   m:"These verses come from the middle of a book of grief. The writer has lost almost everything, and he says it's good to hope and quietly wait for God. Quietly is the key word. Not pretending everything's fine, and not demanding answers. Just a steady, hopeful patience.",
   q:"How do you usually wait?", o:["Impatiently","Anxiously","Quietly","I try to make things happen"],
   p:"What are you waiting on? What would quietly waiting look like for you this week?",
   a:"Spend five minutes today in quiet waiting, without asking for anything."},
  {r:"1 Timothy 4:12", t:"Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity.", th:"Be an example", c:"1 Timothy 4:11-16",
   m:"Timothy was young, and some people looked down on him. Paul's advice wasn't to argue. It was to live in a way that couldn't be dismissed: be an example in word, in conversation (an old word for conduct), in love, in spirit, in faith, and in purity. Whatever your age, your life can show what following Jesus looks like.",
   q:"Where do you feel underestimated?", o:["My age","My experience","My background","My faith"],
   p:"In which area could you be a stronger example: words, conduct, love, faith, or purity?",
   a:"Be an example in one specific area today."},
  {r:"Ruth 2:12", t:"The LORD recompense thy work, and a full reward be given thee of the LORD God of Israel, under whose wings thou art come to trust.", th:"Under his wings", c:"Ruth 2:8-13",
   m:"Ruth was a foreign widow gathering leftover grain to survive. Boaz noticed her loyalty to her mother-in-law and blessed her: may the God under whose wings you've come to trust reward you. Ruth had left everything behind. God saw her faithfulness, and he was already writing her into a much bigger story.",
   q:"Where do you feel like an outsider?", o:["At work","In my family","In church","In my community"],
   p:"What have you given up or left behind to follow God? How has he sheltered you?",
   a:"Welcome an outsider today with kindness, the way Boaz did."},
  {r:"Psalm 103:1-5", t:"Bless the LORD, O my soul: and all that is within me, bless his holy name. Bless the LORD, O my soul, and forget not all his benefits: Who forgiveth all thine iniquities; who healeth all thy diseases; Who redeemeth thy life from destruction; who crowneth thee with lovingkindness and tender mercies; Who satisfieth thy mouth with good things; so that thy youth is renewed like the eagle's.", th:"Forget not all his benefits", c:"Psalm 103:1-14",
   m:"David talks to his own soul: Bless the LORD, and forget not. Then he lists what God does: forgives, heals, redeems, crowns, satisfies, renews. Forgetfulness is our natural drift. Praise is how we remember. This psalm is a good one to read out loud when your soul feels flat.",
   q:"Which benefit means most to you today?", o:["He forgives","He heals","He redeems","He renews"],
   p:"Talk to your own soul like David did. Remind it of what God has done for you.",
   a:"Read Psalm 103 out loud today, slowly."},
  {r:"Luke 18:13", t:"And the publican, standing afar off, would not lift up so much as his eyes unto heaven, but smote upon his breast, saying, God be merciful to me a sinner.", th:"God be merciful to me", c:"Luke 18:9-14",
   m:"A proud Pharisee prayed about how good he was. A tax collector stood far off, wouldn't even look up, and prayed seven words: God be merciful to me a sinner. Jesus said the tax collector was the one who went home right with God. Humble, honest prayers are the ones God hears.",
   q:"Which prayer sounds more like yours?", o:["The Pharisee's","The tax collector's","A mix","I'm not sure"],
   p:"Write a prayer like the tax collector's: short, honest, and humble.",
   a:"Pray 'God be merciful to me' today, and mean it."},
  {r:"Proverbs 18:21", t:"Death and life are in the power of the tongue: and they that love it shall eat the fruit thereof.", th:"The power of the tongue", c:"Proverbs 18:20-21",
   m:"Words have power to build up or tear down, to give life or to wound. 'They that love it shall eat the fruit thereof' means we live with the harvest of our words. What you say to others, and to yourself, shapes the world you live in.",
   q:"Whose words affect you most?", o:["My own","A parent's","A friend's","A boss's"],
   p:"Think about the words you've spoken this week. Which brought life? Which didn't?",
   a:"Speak only life-giving words today: no complaining, gossip, or harsh self-talk."},
  {r:"2 Timothy 4:7", t:"I have fought a good fight, I have finished my course, I have kept the faith.", th:"I have kept the faith", c:"2 Timothy 4:6-8",
   m:"Paul wrote this from prison near the end of his life, knowing he would soon be executed. Looking back, he could say: I have fought a good fight, I have finished my course, I have kept the faith. Not a perfect fight, and not an easy course. But faithful to the end.",
   q:"What would you want to say at the end of your life?", o:["I loved well","I kept the faith","I finished my work","I made a difference"],
   p:"What would it look like to finish your course well? What do you want to be true at the end?",
   a:"Do one thing today that the person you want to be at the end would do."},
  {r:"Ezekiel 36:26", t:"A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh.", th:"A heart of flesh", c:"Ezekiel 36:24-28",
   m:"A stony heart is hard, cold, and unresponsive. God promises to take it out and give a heart of flesh, one that can feel, respond, and love again. This is heart surgery only God can do. If you feel numb or hardened, this promise is for you.",
   q:"Has part of your heart become hard?", o:["Toward someone","Toward God","Toward myself","Toward the world"],
   p:"Where has your heart become stony? Ask God for a heart of flesh there.",
   a:"Let yourself be moved by something today: a story, a person, a song."},
  {r:"Luke 19:5", t:"And when Jesus came to the place, he looked up, and saw him, and said unto him, Zacchaeus, make haste, and come down; for to day I must abide at thy house.", th:"Come down", c:"Luke 19:1-10",
   m:"Zacchaeus was a rich, despised tax collector, too short to see over the crowd, so he climbed a tree. Jesus stopped right under it, called him by name, and invited himself over. Before Zacchaeus changed anything, Jesus wanted to be with him. Love came first. Change followed.",
   q:"What would you do if Jesus said he was coming to your house today?", o:["Panic and clean","Feel unworthy","Feel excited","Welcome him as I am"],
   p:"Jesus called Zacchaeus by name before he changed. What does that tell you about how Jesus sees you?",
   a:"Spend time today with someone others tend to avoid."},
  {r:"Psalm 103:13-14", t:"Like as a father pitieth his children, so the LORD pitieth them that fear him. For he knoweth our frame; he remembereth that we are dust.", th:"He remembers we are dust", c:"Psalm 103:13-18",
   m:"God is like a loving father who knows how his children are made. He remembers that we are dust. He isn't surprised by our weakness or frustrated that we're not stronger. He knows our limits better than we do, and he responds with compassion, not disappointment.",
   q:"Where are you hardest on yourself?", o:["My mistakes","My progress","My body","My faith"],
   p:"If God remembers that you are dust, how might you treat yourself more gently today?",
   a:"Speak to yourself today the way a loving father would."},
  {r:"1 Samuel 3:10", t:"And the LORD came, and stood, and called as at other times, Samuel, Samuel. Then Samuel answered, Speak; for thy servant heareth.", th:"Speak, Lord", c:"1 Samuel 3:1-10",
   m:"Young Samuel heard his name called in the night and thought it was the priest Eli. Finally Eli realized God was calling and told Samuel how to answer: Speak; for thy servant heareth. Most of our prayers sound more like 'Listen, Lord, your servant is speaking.' Samuel's prayer turns that around.",
   q:"How much of your prayer time is listening?", o:["Almost none","A little","About half","Most of it"],
   p:"Sit quietly for a few minutes. Then write whatever you sense God might be saying.",
   a:"Begin your prayer today with Samuel's words, then stay silent for two minutes."},
  {r:"Hebrews 4:15-16", t:"For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as we are, yet without sin. Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.", th:"The throne of grace", c:"Hebrews 4:14-16",
   m:"Jesus isn't a distant high priest who can't relate. He was tempted in every way we are, yet didn't sin. He knows what it feels like. That's why we can come boldly to God's throne, a throne of grace, and find help exactly when we need it.",
   q:"How do you bring your struggles to God?", o:["Boldly","Timidly","I avoid him","With shame"],
   p:"What struggle would you bring to the throne of grace if you came boldly?",
   a:"Come boldly to God today with something you've been hesitant to bring."},
  {r:"John 1:12", t:"But as many as received him, to them gave he power to become the sons of God, even to them that believe on his name.", th:"Children of God", c:"John 1:9-13",
